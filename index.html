lesson({id:'gib',m:'clin',t:'GI bleeding and massive transfusion',
sum:'Shock gives a lactic acidosis; the urea rises from digested blood. Massive transfusion adds citrate: low ionised calcium early and metabolic alkalosis later.',
body:`<h3>The bleeding patient</h3>
<ul><li><b>Lactate</b> and base deficit mark hypoperfusion before the haemoglobin falls; the Hb lags for hours.</li>
<li><b>Urea</b> rises out of proportion to creatinine in upper GI bleeding (digested blood plus hypovolaemia).</li>
<li>Trend the lactate: clearance follows successful resuscitation.</li></ul>
<h3>Massive transfusion</h3>
<ul><li><b>Ionised calcium</b> falls as citrate binds it, worse with liver failure (slower citrate metabolism). Check iCa²⁺ on the gas and replace (calcium chloride or gluconate) during massive transfusion.</li>
<li><b>Potassium</b> can rise from stored red cells.</li>
<li><b>Metabolic alkalosis</b> appears a day or two later as citrate is metabolised to bicarbonate.</li>
<li>Acidosis, hypothermia and coagulopathy (the lethal triad, with hypocalcaemia often added as a fourth) feed each other: warm everything, give blood products early in balanced ratios, use tranexamic acid in trauma within 3 hours (not routinely in GI bleeding).</li></ul>`,
keys:[['Early marker','Lactate / base deficit'],['Citrate','↓ iCa²⁺ early, alkalosis later'],['TXA','Trauma ≤ 3 h; not routine in GI bleed']],
hook:'Bleeding shows on the gas before it shows on the haemoglobin.',
q:[['During massive transfusion iCa²⁺ is 0.82 mmol/L. Mechanism?',['Dilution only','Citrate binding calcium','Hyperkalaemia','Alkalosis from vomiting'],1,'Citrate chelates calcium; liver dysfunction slows its clearance.'],
['Two days after a massive transfusion: HCO₃⁻ 33, no vomiting, no diuretics. Likely?',['Laboratory error','Citrate metabolised to bicarbonate','Respiratory acidosis','Type 4 RTA'],1,'Each unit carries citrate that the liver turns into bicarbonate.']]});

lesson({id:'kids',m:'clin',t:'Children: what is different',
sum:'Same rules, different traps: gastroenteritis with ketosis, saline hyperchloraemia, pyloric stenosis, and paediatric DKA with cerebral oedema.',
body:`<ul><li><b>Normal values</b> are broadly the adult ones beyond infancy; newborns and young infants run a slightly lower bicarbonate (around 20–22). Capillary gases are common: fine for pH and PCO₂, not for PO₂.</li>
<li><b>Gastroenteritis</b>: stool bicarbonate loss gives NAGMA; poor intake adds starvation ketosis (children become ketotic quickly), so a mixed gap is common. Oral rehydration first.</li>
<li><b>Big saline resuscitation</b>: hyperchloraemic acidosis can look like ongoing shock. Check the chloride and the lactate before giving more fluid.</li>
<li><b>Pyloric stenosis</b> (2–8 weeks old, projectile non-bilious vomiting): hypochloraemic, hypokalaemic metabolic alkalosis. The alkalosis and chloride are corrected with fluids and potassium before surgery because alkalosis raises the risk of postoperative apnoea.</li>
<li><b>Paediatric DKA</b>: cerebral oedema is the main killer. Fluids are calculated carefully, insulin infusion (often 0.05–0.1 units/kg/h) starts after initial fluids, and bicarbonate is avoided. Headache, falling GCS, bradycardia or rising BP during treatment → treat cerebral oedema at once (mannitol or hypertonic saline).</li>
<li><b>Inborn errors</b>: an unexplained high gap with hypoglycaemia or hyperammonaemia in a sick infant needs specialist input.</li></ul>`,
keys:[['Infant HCO₃⁻','≈ 20–22'],['Pyloric stenosis','↓Cl ↓K metabolic alkalosis'],['Paediatric DKA killer','Cerebral oedema']],
hook:'Children run the same chemistry faster: they get ketotic, alkalotic and oedematous sooner.',
q:[['Six-week-old with projectile vomiting: pH 7.52, HCO₃⁻ 34, Cl 88, K 3.0. Before theatre?',['Operate now','Correct fluids, chloride and potassium first','Give acetazolamide','Give bicarbonate'],1,'Alkalosis increases the risk of postoperative apnoea.'],
['Child in DKA treatment develops headache and bradycardia. Next?',['More insulin','Treat cerebral oedema now (mannitol or hypertonic saline)','Bicarbonate','Stop fluids and wait'],1,'Cerebral oedema is the leading cause of death in paediatric DKA.']]});

lesson({id:'tc-radial',m:'samp',t:'Technique clinic: the radial puncture, step by step',
sum:'Eight steps, each with the reason behind it, the usual error and how to rescue it. Most failed or misleading gases come from steps 2, 5 and 6.',
body:`<p>Treat this as a checklist you rehearse before your hands are shaking. Each step has a <b>why</b> so that you can adapt when the patient does not look like the textbook.</p>
${tw('<tr><th>#</th><th>Do</th><th>Why</th><th>Common error → rescue</th></tr><tr><td>1</td><td>Check indication, anticoagulation, the other wrist and the FiO₂ or device</td><td>An unreadable gas (no FiO₂) is wasted pain</td><td>Forgetting FiO₂ → write it on the syringe now</td></tr><tr><td>2</td><td>Wrist extended about 30° over a rolled towel, hand relaxed</td><td>Brings the artery close to the skin and steadies it</td><td>Over-extension flattens the pulse → ease back until it is strongest</td></tr><tr><td>3</td><td>Palpate with two fingers 1–2 cm above the crease, mark the line of the artery</td><td>The artery runs straight; you want to enter along it</td><td>Palpating with the thumb (it has its own pulse) → use index and middle</td></tr><tr><td>4</td><td>Clean the skin; consider 0.25–0.5 mL of 1% lidocaine</td><td>Local anaesthetic reduces pain without making the stick harder</td><td>Skipping it in a conscious patient → offer it</td></tr><tr><td>5</td><td>Needle at 30–45°, bevel up, advance slowly towards the pulse</td><td>Bevel up gives a clean entry; a slow advance lets you feel the wall</td><td>Going too steep and through the back wall → withdraw slowly until the flash appears</td></tr><tr><td>6</td><td>Let the pulse fill the syringe (1–2 mL); do not pull the plunger</td><td>Pulsatile self-filling confirms an artery; pulling draws venous blood and air</td><td>Dark, non-pulsatile blood → vein; stop and repeat</td></tr><tr><td>7</td><td>Needle out, pressure for at least 5 minutes (longer on anticoagulants), then expel air, cap and roll the syringe</td><td>Prevents haematoma; air and delay corrupt the gas</td><td>Releasing pressure early to check → hold, do not peek</td></tr><tr><td>8</td><td>Label with name, time, FiO₂, temperature and site; analyse within 30 minutes</td><td>The gas is only as good as the context attached to it</td><td>Leaving the sample on a desk → run it now or repeat it</td></tr>')}
<h3>When not to puncture the radial artery</h3>
<ul><li>Infection, burn or skin lesion over the site, or no palpable pulse.</li>
<li>A limb with a dialysis fistula or vascular graft.</li>
<li>Severe peripheral vascular disease or an ischaemic hand. Pick another site.</li>
<li>Bleeding disorders and anticoagulation are not absolute bars. Choose a compressible site, use the smallest needle and press for longer.</li></ul>
<h3>If you miss</h3>
<p>Pull back to just under the skin and redirect without leaving the artery's line. After two misses, change wrist or ask a colleague. Repeated probing hurts and causes haematoma.</p>`,
keys:[['Angle','30–45°, bevel up'],['Syringe','Fills by the pulse, no pulling'],['Pressure','≥ 5 min (longer if anticoagulated)'],['Label','FiO₂, time, temperature, site']],
hook:'Pulse fills the syringe, pressure for five minutes, FiO₂ on the label.',
q:[['Dark blood fills the syringe slowly and only when you pull the plunger. What does that suggest?',['A clean arterial sample','Venous blood, not arterial','A very high PaCO₂','A syringe with too much heparin'],1,'An arterial sample is bright, pulsatile and self-filling. Pulling and dark colour point to a vein.'],
['After the needle is withdrawn, what is the right next action?',['Press firmly for 5 minutes or more','Press for 30 seconds, then look','Apply a light dressing and go','Ask the patient to flex the wrist for a while'],0,'Short pressure is the commonest cause of haematoma.'],
['Which patient needs a different site rather than a radial attempt?',['An anxious patient on a monitor','A limb with a dialysis fistula','A patient breathing room air','A patient with a high fever'],1,'Never puncture a fistula or graft limb.']]});

lesson({id:'tc-allen',m:'samp',t:'Technique clinic: the Allen test and collateral flow',
sum:'How to do the modified Allen test, how to read it, and why it is a quick check rather than a guarantee.',
body:`<h3>The modified Allen test</h3>
<ol><li>Patient clenches the fist for about 30 seconds while you press on both the radial and ulnar arteries.</li>
<li>Open the hand. It should be pale.</li>
<li>Release the <b>ulnar</b> artery only and time the return of colour to the whole palm and thumb.</li></ol>
${tw('<tr><th>Colour returns in</th><th>Reading</th></tr><tr><td>Under about 5–7 seconds</td><td>Ulnar supply is adequate</td></tr><tr><td>8–14 seconds</td><td>Equivocal</td></tr><tr><td>Over about 15 seconds</td><td>Ulnar supply poor: avoid that radial artery</td></tr>')}
<h3>What the evidence says</h3>
<ul><li>The test is subjective: results vary by examiner, skin tone, room temperature and how hard the patient clenches.</li>
<li>It has not been shown to predict hand ischaemia after radial puncture, and ischaemic complications are very rare either way. Some guidelines still recommend it, others do not.</li>
<li>More objective options exist: a pulse oximeter or Doppler on the thumb while the radial artery is compressed (the Barbeau test).</li></ul>
<h3>How to use it</h3>
<p>Use it as a quick screen that takes under a minute, not as permission or as a veto. A clearly abnormal result is a reason to choose the other wrist, or another site. A normal one does not remove the need for the usual care: one attempt at a time, pressure afterwards, and a look at the hand if the patient complains of pain or numbness.</p>
<h3>Red flags after puncture</h3>
<p>Persistent pain, a cold, pale or numb hand, or a growing swelling at the wrist need review at once. They can mean haematoma, spasm or arterial occlusion.</p>`,
keys:[['Release','Ulnar artery only'],['Abnormal','Colour back in over ~15 s'],['Evidence','Poor predictor of ischaemia']],
hook:'Allen test: a quick screen, not a promise.',
q:[['In the modified Allen test, which artery is released first?',['The radial artery','The ulnar artery','The brachial artery above it','Both arteries together at once'],1,'You are testing whether the ulnar artery can supply the whole hand.'],
['How should the Allen test be used?',['A quick screen that helps pick the site','Proof that ischaemia can never happen','A full substitute for pressure afterwards','A test that is used only in small children'],0,'It is subjective and a weak predictor, so it informs the choice and never replaces care.'],
['After a radial gas the hand becomes cold, pale and numb. What now?',['Reassure and watch the hand','Urgent review for arterial compromise','Give another dose of heparin now','Repeat the puncture on the same wrist'],1,'Treat it as possible occlusion until proven otherwise.']]});

lesson({id:'tc-venous',m:'samp',t:'Technique clinic: getting a good venous or capillary gas',
sum:'When a vein will do, how to draw it without distorting the numbers, and when an earlobe sample is worth it.',
body:`<h3>Choose the sample for the question</h3>
${tw('<tr><th>You want to know</th><th>Sample</th></tr><tr><td>Is the patient acidotic? Lactate, K⁺, glucose</td><td>Peripheral venous is enough</td></tr><tr><td>Is the patient hypercapnic?</td><td>Venous screens it out (normal PCO₂ is reassuring); abnormal or doubtful → arterial</td></tr><tr><td>Is oxygenation the problem?</td><td>Arterial with FiO₂ (or pulse oximetry first)</td></tr><tr><td>Repeated gases in a stable COPD or child</td><td>Arterialised capillary (earlobe), warmed and free-flowing</td></tr>')}
<h3>Drawing a venous gas well</h3>
<ul><li>Use a heparinised gas syringe. A tourniquet for more than a minute and a clenched fist push up lactate and potassium and lower pH, so release it before or soon after puncture.</li>
<li>Avoid the arm with an infusion running. Fluids dilute the sample.</li>
<li>Sample at the time of cannulation when you can, free-flowing, without pulling hard.</li>
<li>Expel air, cap, label as <b>venous</b>, and note the site. A venous sample labelled arterial is a classic trap.</li></ul>
<h3>Remember the offsets</h3>
<p>Compared with arterial: pH about 0.03 lower, PCO₂ about 5 mmHg higher, HCO₃⁻ about 1 mmol/L higher. Use the Labs → venous to arterial tool and keep the scatter in mind. A venous value is a screen, not a substitute, when the number sits near a decision line.</p>
<h3>Earlobe (arterialised capillary)</h3>
<ul><li>Warm the lobe or apply vasodilator cream for about 10 minutes so that blood is arterialised.</li>
<li>Free flow into a capillary tube. Squeezing mixes in tissue fluid and distorts the values.</li>
<li>Reliable for pH and PCO₂; treat PO₂ with caution.</li></ul>`,
keys:[['Tourniquet','Under 1 min, release early'],['Venous vs arterial','pH −0.03 · PCO₂ +5 · HCO₃⁻ +1'],['Earlobe','Warm, free-flowing, PO₂ unreliable']],
hook:'A vein answers acid-base; only an artery answers oxygen.',
q:[['Which question can a peripheral venous gas answer reliably?',['The PaO₂ in a shocked patient','pH and lactate levels','The A–a gradient of the patient','The shunt fraction in the lungs'],1,'Venous pH and lactate track arterial values closely.'],
['What does a long tourniquet and fist clenching do to a venous sample?',['Lowers the lactate by dilution','Raises lactate and K⁺, lowers pH','Raises the pH and the glucose','Changes nothing that you can measure'],1,'Local stasis and muscle work change the sample.'],
['An earlobe sample is squeezed hard to get enough blood. What is the effect?',['No effect on any value','Tissue fluid distorts the values','PO₂ rises falsely and only that','Only the glucose changes'],1,'Free flow is essential for capillary gases.']]});

lesson({id:'tc-bubbles',m:'samp',t:'Technique clinic: bubbles, heparin and delay, with drills',
sum:'What to do in the first minute after the draw, and the quick checks that tell you the sample cannot be trusted.',
body:`<h3>The first minute</h3>
<ol><li><b>Expel the air at once</b>: hold the syringe upright, tap, push the bubbles out and cap it.</li>
<li><b>Mix by rolling</b> the syringe between the palms and inverting a few times. Do not shake it.</li>
<li><b>Label</b> and send, or run it yourself.</li></ol>
<h3>Why a bubble matters</h3>
<p>Room air has a PO₂ of about 150 mmHg and almost no CO₂. A bubble in the syringe drags the sample's PO₂ towards 150 and its PCO₂ downwards. A patient with a PaO₂ of 60 looks better; one on high-flow oxygen with a PaO₂ of 400 looks worse. The longer it sits and the bigger the bubble, the larger the error.</p>
<h3>Heparin and delay</h3>
<ul><li>Use dry or balanced heparin and fill the syringe. Leaving a lot of liquid heparin dilutes the sample: PCO₂ and HCO₃⁻ fall and calcium binds.</li>
<li>Cells keep working in the syringe: PO₂ falls, PCO₂ and lactate rise, pH and glucose fall. Plastic at room temperature is fine for about 30 minutes. Longer than that, run a fresh sample.</li></ul>
<h3>Four drills</h3>
${tw('<tr><th>You see</th><th>Think</th><th>Do</th></tr><tr><td>PaO₂ 36, SO₂ 68%, SpO₂ 97%</td><td>Venous blood in an arterial syringe</td><td>Repeat from an artery</td></tr><tr><td>PaO₂ 140 on room air, PCO₂ 12 in a well patient</td><td>Air bubble</td><td>Repeat, expel air at once</td></tr><tr><td>Lactate 9 in a bright, well patient; sample 2 hours old</td><td>Delay</td><td>Repeat and run it within 30 minutes</td></tr><tr><td>K⁺ 7.4, no ECG changes, difficult draw</td><td>Haemolysis</td><td>Repeat before treating</td></tr>')}
<p>The rule behind all four: when the numbers and the patient disagree, believe the patient and repeat the sample.</p>`,
keys:[['Air','PO₂ → ~150, PCO₂ ↓'],['Delay','PO₂ ↓, PCO₂ ↑, lactate ↑'],['Window','~30 min in plastic at room temperature']],
hook:'Bubbles out, roll never shake, run it inside half an hour.',
q:[['A well patient on room air has a "PaO₂ 142, PCO₂ 12". Most likely?',['Excellent gas exchange','An air bubble in the syringe','Simple hyperventilation in a calm patient','Methaemoglobinaemia that is present'],1,'A PO₂ near 150 with a very low PCO₂ is the bubble signature.'],
['A sample sits for two hours. What happens?',['Lactate falls steadily as cells rest','PO₂ rises over time in the syringe','Lactate and PCO₂ up, PO₂ and pH down','The pH climbs slowly with glucose'],2,'Cells keep metabolising in the syringe.'],
['Why roll the syringe instead of shaking it?',['To warm the sample up slowly','Shaking can haemolyse and add air','Rolling removes the lactate first','Rolling raises the pH slightly at once'],1,'Gentle mixing keeps cells intact and prevents bubbles.']]});

 body:'<h3>Definition</h3><ul><li>Inadequate tissue oxygen use: hypotension (MAP below 65 mmHg) is common but not required.</li><li>Look for the three windows: skin (mottling, capillary refill over 3 s), kidney (urine under 0.5 mL/kg/h), brain (confusion).</li><li>Lactate above 2 mmol/L supports it.</li></ul><h3>Four types</h3><ul><li><b>Hypovolaemic:</b> bleeding, GI or burn losses. Low filling, low output, cold.</li><li><b>Cardiogenic:</b> pump failure. High filling, low output, cold and wet.</li><li><b>Distributive:</b> sepsis, anaphylaxis, spinal injury. Low resistance, often warm, output can be high.</li><li><b>Obstructive:</b> PE, tamponade, tension pneumothorax. High venous pressure, low output.</li></ul><h3>The gas</h3><ul><li>Lactic HAGMA with Winter\'s compensation. A PCO₂ above the Winter\'s band is respiratory fatigue: plan the airway early.</li><li>Central venous saturation (ScvO₂) below 70% suggests low delivery (hypovolaemic, cardiogenic, obstructive); it is often normal or high in sepsis.</li></ul>',
 keys:[['Shock','Delivery below demand'],['MAP target','≥ 65 mmHg'],['ScvO₂ low','Low output types'],['PCO₂ above Winter\'s','Tiring: think airway']],hook:'Shock is a delivery problem: the gas tells you how badly the tissues are paying for it.'},
{id:'icu-perf',t:'Perfusion targets: lactate, capillary refill, ScvO₂ and the CO₂ gap',
 sum:'Recheck lactate every 2–4 h while it is raised. Capillary refill time is a fast, valid target. A venous–arterial PCO₂ gap above 6 mmHg suggests flow is still too low.',
 body:'<h3>Lactate</h3><ul><li>Falling lactate is reassuring; a rise means look again. Repeat every 2–4 h while above 2.</li><li>Not only hypoxia: adrenaline (β₂ aerobic glycolysis), liver failure and metformin raise it too.</li></ul><h3>Capillary refill time</h3><ul><li>ANDROMEDA-SHOCK (2019): resuscitation targeting a normal capillary refill was at least as good as targeting lactate (28-day mortality 34.9% vs 43.4%, not significant).</li></ul><h3>Venous oxygen and CO₂</h3><ul><li>ScvO₂ about 70% is normal. Low means delivery is not meeting demand.</li><li><b>CO₂ gap</b> (central venous PCO₂ − arterial PCO₂): normal ≤ 6 mmHg. Above 6 suggests low cardiac output even when ScvO₂ looks normal.</li><li>Use paired arterial and central venous samples taken together.</li></ul>',
 keys:[['Lactate recheck','Every 2–4 h'],['CO₂ gap normal','≤ 6 mmHg'],['ScvO₂ normal','≈ 70%'],['Adrenaline','Raises lactate itself']],hook:'Lactate is a smoke alarm, not a fire map. The CO₂ gap tells you if the flow is enough.'},
{id:'icu-fluids',t:'Fluids and fluid responsiveness',
 sum:'In sepsis-induced hypoperfusion start with about 30 mL/kg of balanced crystalloid. After that give fluid only to patients who respond, judged by a dynamic test such as passive leg raising.',
 body:'<h3>First fluid</h3><ul><li>Surviving Sepsis 2021: about 30 mL/kg crystalloid in the first 3 h for hypoperfusion (a weak recommendation; adjust for heart and kidney failure).</li><li>Balanced crystalloids are suggested over 0.9% saline; large saline volumes cause hyperchloraemic NAGMA (SMART).</li></ul><h3>Will more fluid help?</h3><ul><li>Only about half of ICU patients increase their cardiac output with fluid.</li><li><b>Passive leg raising:</b> a rise in cardiac output or stroke volume of 10% or more predicts response; it is reversible and needs a real-time output measure.</li><li>Static numbers such as CVP predict poorly.</li></ul><h3>When to stop</h3><ul><li>No response, rising oxygen need, B-lines on ultrasound, or a falling P/F.</li></ul>',
 keys:[['Initial sepsis fluid','≈ 30 mL/kg'],['PLR positive','Output ↑ ≥ 10%'],['CVP','Poor predictor'],['Saline in bulk','Hyperchloraemic NAGMA']],hook:'Fluid is a drug: give it to responders, and stop when it stops working.'},
{id:'icu-press',t:'Vasopressors and inotropes',
 sum:'Noradrenaline first for septic shock, target MAP 65. Add vasopressin rather than escalating noradrenaline beyond 0.25–0.5 µg/kg/min. Add an inotrope for poor cardiac function. Adrenaline raises lactate by itself.',
 body:'<h3>Choices</h3><ul><li><b>Noradrenaline:</b> first line in septic shock. Starting through a good peripheral line is acceptable rather than waiting for a central line.</li><li><b>Vasopressin</b> 0.03 U/min: add when noradrenaline reaches 0.25–0.5 µg/kg/min (VASST showed no mortality difference but it spares catecholamine).</li><li><b>Dopamine:</b> more arrhythmias than noradrenaline (SOAP II); avoid as first line.</li><li><b>Dobutamine</b> or <b>adrenaline</b>: for cardiac dysfunction with persistent hypoperfusion despite adequate MAP and volume.</li><li><b>Hydrocortisone</b> 200 mg/day when vasopressor need persists (noradrenaline ≥ 0.25 µg/kg/min for at least 4 h).</li></ul><h3>The gas on pressors</h3><ul><li>Adrenaline causes a lactate rise through β₂ stimulation; watch capillary refill and the CO₂ gap before calling it worsening shock.</li><li>Profound acidaemia (pH below 7.1–7.15) blunts catecholamine response; correct the cause.</li></ul>',
 keys:[['First line','Noradrenaline'],['Add vasopressin at','NA 0.25–0.5 µg/kg/min'],['MAP target','65 mmHg'],['Steroid','Hydrocortisone 200 mg/day']],hook:'Squeeze with noradrenaline, add vasopressin, push the pump only if it is weak.'},
{id:'icu-vent1',t:'Ventilator basics: modes, settings and pressures',
 sum:'Oxygenation is moved by FiO₂ and PEEP. CO₂ is moved by minute ventilation. Plateau pressure reflects the lung; peak minus plateau reflects the airways.',
 body:'<h3>Modes</h3><ul><li><b>Volume control:</b> you set the tidal volume; the pressure is the result.</li><li><b>Pressure control:</b> you set the pressure; the tidal volume is the result and falls if the lung stiffens.</li><li><b>Pressure support:</b> the patient triggers each breath; used to wean.</li></ul><h3>Settings</h3><ul><li>Tidal volume 6–8 mL/kg <b>predicted</b> body weight. PBW (kg) = 50 (men) or 45.5 (women) + 0.91 × (height cm − 152.4).</li><li>Rate 14–20; FiO₂ to SpO₂ target; PEEP 5 or more.</li></ul><h3>Pressures</h3><ul><li><b>Peak</b> = airway resistance + lung stiffness. <b>Plateau</b> (inspiratory hold) = lung and chest wall stiffness. Keep plateau ≤ 30 cmH₂O.</li><li><b>Driving pressure</b> = plateau − PEEP; below about 15 cmH₂O is associated with better survival (Amato 2015).</li></ul><h3>Steering the gas</h3><ul><li>New PaCO₂ ≈ old PaCO₂ × old minute ventilation ÷ new minute ventilation (dead space fixed).</li><li>PaO₂: FiO₂ first; PEEP opens collapsed lung (shunt), which oxygen alone cannot fix.</li></ul>',
 keys:[['TV','6–8 mL/kg PBW'],['Plateau','≤ 30 cmH₂O'],['Driving pressure','< 15 cmH₂O'],['CO₂ lever','Minute ventilation']],hook:'Two dials for oxygen (FiO₂, PEEP), two for CO₂ (rate, volume).'},
{id:'icu-ards',t:'ARDS on the ventilator',ex:{pH:7.28,pco2:52,hco3:24,po2:62,fio2:0.7,na:140,cl:106,alb:28,age:52},
 sum:'Low tidal volume (6 mL/kg PBW), plateau ≤ 30, PEEP for oxygenation, prone positioning for P/F below 150, and accept a high PaCO₂ while pH stays above about 7.20.',
 body:'<h3>Lung-protective ventilation</h3><ul><li>6 mL/kg PBW (ARDSNet 2000: mortality 31% vs 39.8% with 12 mL/kg).</li><li>Plateau ≤ 30 cmH₂O; keep driving pressure low.</li><li>Oxygen target: PaO₂ 55–80 mmHg or SpO₂ 88–95%.</li></ul><h3>Rescue steps by severity</h3><ul><li>Higher PEEP for moderate–severe ARDS.</li><li><b>Prone</b> at least 12 h a day when P/F below 150 (PROSEVA: 28-day mortality 16% vs 32.8%).</li><li>Neuromuscular blockade in selected early severe cases.</li><li>VV-ECMO for refractory hypoxaemia in expert centres (EOLIA: 35% vs 46%, not statistically significant).</li></ul><h3>The gas</h3><ul><li><b>Permissive hypercapnia:</b> accept a raised PaCO₂ to protect the lung if pH stays above about 7.20 (avoid in raised intracranial pressure).</li><li>Record P/F with the PEEP: P/F changes with both.</li></ul>',
 keys:[['TV','6 mL/kg PBW'],['Prone if','P/F < 150'],['Permissive pH floor','≈ 7.20'],['PaO₂ target','55–80 mmHg']],hook:'Protect the lung first; let the CO₂ drift up.'},
{id:'icu-obst',t:'Asthma and COPD on the ventilator',
 sum:'Obstruction needs time to breathe out. Use a low rate, short inspiration and a long expiration; accept hypercapnia. If the patient crashes after intubation, disconnect and let the trapped air out.',
 body:'<h3>Trapped air (auto-PEEP)</h3><ul><li>A breath starts before the last one is out. Pressure builds inside the chest, venous return falls, BP drops, and barotrauma follows.</li><li>Measure it with an expiratory hold.</li></ul><h3>Settings</h3><ul><li>Rate 10–12, tidal volume 6–8 mL/kg PBW, high inspiratory flow, I:E 1:4 or longer.</li><li>Accept PaCO₂ well above normal if pH stays above about 7.20.</li></ul><h3>Crash after intubation</h3><ul><li>Disconnect the circuit and let the chest empty; consider tension pneumothorax.</li></ul><h3>COPD and the bicarbonate</h3><ul><li>A chronic retainer has a high HCO₃⁻. Ventilating to a "normal" PaCO₂ of 40 creates a severe post-hypercapnic metabolic alkalosis. Aim for their usual PaCO₂ and a normal pH.</li></ul>',
 keys:[['Rate','10–12'],['I:E','1:4 or longer'],['Crash','Disconnect, let air out'],['COPD target','Their baseline PaCO₂']],hook:'In obstruction, the problem is getting air out, not in.'},
{id:'icu-trouble',t:'Troubleshooting: DOPES and the falling saturation',
 sum:'Sudden deterioration on the ventilator: disconnect and bag on 100% oxygen, then work through DOPES. Peak high with plateau normal = airways; both high = lung or chest.',
 body:'<h3>DOPES</h3><ul><li><b>D</b>isplacement of the tube (check capnography waveform).</li><li><b>O</b>bstruction: secretions, kink, biting.</li><li><b>P</b>neumothorax.</li><li><b>E</b>quipment failure: ventilator, oxygen supply, circuit.</li><li><b>S</b>tacked breaths (auto-PEEP).</li></ul><h3>Read the pressures</h3><ul><li>Peak up, plateau unchanged: resistance (tube, secretions, bronchospasm).</li><li>Both up: compliance (pneumothorax, right main bronchus intubation, pulmonary oedema, abdominal distension).</li></ul><h3>Read the CO₂</h3><ul><li>Lost capnography trace: displacement, obstruction or no circulation.</li><li>End-tidal CO₂ falls suddenly while PaCO₂ rises: dead space jumped (PE, low cardiac output).</li></ul>',
 keys:[['First move','Disconnect, bag 100% O₂'],['Peak ↑ plateau =','Airway resistance'],['Both ↑','Lung or chest stiffness'],['ETCO₂ lost','Tube or circulation']],hook:'When in doubt, take the ventilator out of the equation.'},
{id:'icu-wean',t:'Weaning and extubation',
 sum:'Every day ask: can this patient breathe alone? Pair sedation holds with a spontaneous breathing trial. A rapid shallow breathing index below 105 favours success. High-risk patients go to NIV or high-flow after extubation.',
 body:'<h3>Ready for a trial?</h3><ul><li>The cause is improving; FiO₂ ≤ 0.4–0.5 and PEEP ≤ 5–8; stable without escalating pressors; awake enough to cough.</li></ul><h3>Spontaneous breathing trial</h3><ul><li>30–120 min on low pressure support (5–8 cmH₂O) or a T-piece.</li><li><b>RSBI</b> = rate ÷ tidal volume in litres; below 105 predicts success (Yang & Tobin 1991).</li><li>Fail if rate above 35, SpO₂ below 90%, big HR or BP changes, distress, or a rising PaCO₂ with acidaemia.</li></ul><h3>After extubation</h3><ul><li>Hypercapnic or high-risk patients: planned NIV. Others at risk: high-flow nasal oxygen.</li></ul>',
 keys:[['RSBI cut-off','< 105'],['SBT length','30–120 min'],['SBT failure gas','Rising PaCO₂, falling pH'],['Hypercapnic extubation','Planned NIV']],hook:'Test the breathing, not the ventilator.'},
{id:'icu-rosc',t:'After ROSC: the gas targets',
 sum:'After return of circulation: SpO₂ 94–98%, PaCO₂ 35–45 mmHg, MAP above 65, avoid fever, avoid hypoglycaemia. Expect a mixed acidosis that improves with good perfusion; bicarbonate is not routine.',
 body:'<h3>Targets (ERC–ESICM 2021)</h3><ul><li>Oxygen: avoid hypoxaemia and hyperoxia; SpO₂ 94–98% once reliable.</li><li>CO₂: normocapnia 35–45 mmHg (4.7–6.0 kPa). Hyperventilation lowers cerebral blood flow.</li><li>MAP above 65 mmHg with urine output above 0.5 mL/kg/h and falling lactate.</li><li>Prevent fever above 37.7 °C for at least 72 h; avoid hypoglycaemia.</li></ul><h3>The gas</h3><ul><li>A mixed respiratory and lactic acidosis is usual early and clears with ventilation and perfusion.</li><li>If the patient is cooled, analysers report at 37 °C; ICUs usually manage on these values (alpha-stat).</li></ul>',
 keys:[['SpO₂','94–98%'],['PaCO₂','35–45 mmHg'],['Fever','Avoid > 37.7 °C for 72 h'],['Bicarbonate','Not routine']],hook:'After the arrest: normal oxygen, normal CO₂, no fever.'},
{id:'icu-rrt',t:'Dialysis in the ICU: acid–base, citrate and indications',
 sum:'Urgent dialysis for refractory acidosis, potassium, toxins, fluid overload or uraemic complications. CRRT corrects acidosis with bicarbonate fluids. Citrate anticoagulation can cause alkalosis, or, when it accumulates, a HAGMA with low ionised calcium.',
 body:'<h3>Urgent indications</h3><ul><li><b>A</b>cidosis refractory to treatment; <b>E</b>lectrolytes (K⁺ above 6.5 despite treatment); <b>I</b>ntoxications (methanol, ethylene glycol, lithium, salicylate, metformin); <b>O</b>verload unresponsive to diuretics; <b>U</b>raemic pericarditis or encephalopathy.</li></ul><h3>Citrate</h3><ul><li>Citrate anticoagulates the circuit by binding calcium. The liver turns each citrate into three bicarbonate.</li><li>Too much delivered: metabolic alkalosis.</li><li>Not metabolised (liver failure, shock): citrate accumulates. Signs: rising anion gap, falling ionised calcium, and a total-to-ionised calcium ratio above 2.5.</li></ul><h3>Reading gases on CRRT</h3><ul><li>The bicarbonate is partly set by the machine; look at trends, the anion gap and lactate to judge the illness.</li></ul>',
 keys:[['Indications','A E I O U'],['Citrate','→ 3 HCO₃⁻ in the liver'],['Accumulation','Total/ionised Ca > 2.5'],['Too much citrate','Metabolic alkalosis']],hook:'On citrate, watch the calcium ratio, not just the pH.'}];

{id:'sp-neo',t:'Newborns and cord gases',ex:{pH:6.98,pco2:72,hco3:16.5,po2:18,fio2:0.21,age:0},
 sum:'Umbilical artery gas reflects the baby. Pathological metabolic acidaemia at birth: artery pH below 7.0 and base deficit 12 mmol/L or more. Artery and vein should differ; identical values mean both came from one vessel.',
 body:'<h3>Taking cord gases</h3><ul><li>Double-clamp a segment, sample the <b>artery</b> (smaller, thick-walled) and the <b>vein</b>.</li><li>Artery: from the baby. Vein: from the placenta. Arterial pH is lower and PCO₂ higher.</li><li>Arterial pH − venous pH is usually at least 0.02 and PCO₂ differs by several mmHg. Near-identical results suggest both samples were venous.</li></ul><h3>Reading it</h3><ul><li>Normal umbilical artery pH about 7.26 (lower limit about 7.10).</li><li>Respiratory acidaemia (high PCO₂, normal base deficit): brief cord compression, clears fast, usually benign.</li><li>Metabolic acidaemia: pH below 7.0 with base deficit ≥ 12 is the threshold linked to hypoxic-ischaemic injury (ACOG).</li></ul><h3>First days</h3><ul><li>Neonatal HCO₃⁻ is lower (about 20–22). Capillary heel gases are fine for pH and PCO₂ but not PO₂.</li></ul>',
 keys:[['Pathological acidaemia','pH < 7.0 and BD ≥ 12'],['Normal UA pH','≈ 7.26'],['Artery = vein','Both from the vein'],['Heel gas','pH and PCO₂ only']],hook:'Cord artery is the baby; cord vein is the placenta.'},
{id:'sp-elder',t:'Older adults',
 sum:'PaO₂ falls with age (≈ 109 − 0.43 × age on room air) and the expected A–a gradient rises (≈ age ÷ 4 + 4). Kidneys acidify and concentrate less well, and drugs often drive the gas.',
 body:'<h3>Oxygen</h3><ul><li>Healthy PaO₂ falls with age: about 109 − 0.43 × age (Sorbini). At 80 that is about 75 mmHg.</li><li>Expected A–a gradient ≈ age ÷ 4 + 4.</li></ul><h3>Kidneys and drugs</h3><ul><li>Lower GFR and reduced ammonium excretion make acid loads hit harder.</li><li>Look at the drug chart: diuretics (alkalosis, hypokalaemia), metformin (lactic acidosis), NSAIDs, ACE inhibitors and spironolactone (hyperkalaemic type 4 picture), opioids and benzodiazepines (hypoventilation).</li></ul><h3>Presentation</h3><ul><li>Sepsis may come without fever; hypoxia may come as confusion or falls.</li></ul>',
 keys:[['PaO₂ by age','≈ 109 − 0.43 × age'],['A–a by age','≈ age ÷ 4 + 4'],['Type 4 drugs','ACEi, spironolactone, NSAIDs'],['Hypoxia sign','Confusion, falls']],hook:'At 80, a PaO₂ of 75 may be normal; a confused patient may be hypoxic.'},
{id:'sp-ohs',t:'Obesity hypoventilation',ex:{pH:7.36,pco2:55,hco3:30.4,po2:58,fio2:0.21,age:48},
 sum:'Obesity hypoventilation: BMI ≥ 30 with daytime PaCO₂ above 45 mmHg and no other cause. A serum bicarbonate below 27 makes it unlikely. Treat with positive airway pressure; oxygen alone can worsen the CO₂.',
 body:'<h3>Diagnosis</h3><ul><li>BMI ≥ 30 kg/m², awake PaCO₂ above 45 mmHg, other causes excluded. Most also have obstructive sleep apnoea.</li><li>Screening: serum HCO₃⁻ below 27 mmol/L makes OHS unlikely (ATS 2019).</li></ul><h3>The gas</h3><ul><li>Chronic compensated respiratory acidosis: high PCO₂, high HCO₃⁻, near-normal pH, low PaO₂ with a normal A–a gradient.</li></ul><h3>Management</h3><ul><li>CPAP or NIV at night. Weight loss.</li><li>Uncontrolled oxygen worsens hypercapnia; target SpO₂ 88–92% when acutely unwell.</li><li>Peri-operative risk: opioids and sedatives, extubation onto NIV.</li></ul>',
 keys:[['Definition','BMI ≥ 30 + PaCO₂ > 45'],['Screen out','HCO₃⁻ < 27'],['Oxygen target','88–92%'],['Treatment','CPAP or NIV']],hook:'A high bicarbonate in an obese patient is a clue to night-time hypoventilation.'},
{id:'sp-dial',t:'The dialysis patient',
 sum:'Before haemodialysis: a mild HAGMA and often high potassium. After: alkalosis from the bicarbonate bath. A missed session brings acidosis, hyperkalaemia and fluid overload together.',
 body:'<h3>The cycle</h3><ul><li>Between sessions acids accumulate: HAGMA with HCO₃⁻ often 18–22.</li><li>Dialysate bicarbonate (often 32–35 mmol/L) raises plasma HCO₃⁻; just after a session a mild metabolic alkalosis is common.</li><li>Peritoneal dialysis is continuous, so gases are steadier.</li></ul><h3>Missed dialysis</h3><ul><li>Hyperkalaemia (ECG first), fluid overload with hypoxaemia, and metabolic acidosis. Calcium, insulin with glucose and urgent dialysis.</li></ul><h3>Pitfalls</h3><ul><li>Very low urea and creatinine do not mean good kidneys if the sample was taken just after dialysis.</li><li>Arteriovenous fistula arm: never take samples or blood pressure there.</li></ul>',
 keys:[['Pre-dialysis','Mild HAGMA, K⁺ high'],['Post-dialysis','Mild alkalosis'],['Missed session','K⁺, fluid, acid'],['Fistula arm','No samples']],hook:'Ask when the last session was before you read the gas.'},
{id:'sp-alt',t:'Altitude',
 sum:'Inspired PO₂ falls with barometric pressure. Hypoxic drive lowers PaCO₂; the kidneys compensate over days. On Everest summit climbers had PaO₂ about 25 and PaCO₂ about 13 mmHg.',
 body:'<h3>Physics</h3><ul><li>PiO₂ = 0.21 × (barometric pressure − 47). At sea level about 150 mmHg; at 2,500 m about 110; at 5,000 m about 75.</li><li>Set the barometric pressure in Settings so the A–a gradient is right for your city.</li></ul><h3>Acclimatisation</h3><ul><li>Hours: hyperventilation, respiratory alkalosis.</li><li>Days: renal bicarbonate loss, pH normalises, 2,3-BPG rises.</li><li>Acetazolamide speeds this by causing a mild NAGMA.</li></ul><h3>Extremes</h3><ul><li>Grocott 2009, at 8,400 m: mean PaO₂ 24.6 mmHg, PaCO₂ 13.3 mmHg.</li><li>Illness: acute mountain sickness, HAPE (hypoxaemia, crackles) and HACE (ataxia, confusion). Descent and oxygen first.</li></ul>',
 keys:[['PiO₂','0.21 × (Pb − 47)'],['First change','Respiratory alkalosis'],['Everest PaO₂','≈ 25 mmHg'],['Acetazolamide','Mild NAGMA']],hook:'Up high, low CO₂ is normal; the kidneys catch up in days.'},
{id:'sp-dive',t:'Diving and hyperbaric oxygen',
 sum:'Pressure rises 1 atmosphere per 10 m of seawater. Decompression illness and arterial gas embolism need 100% oxygen and recompression. In a hyperbaric chamber the PaO₂ can exceed 1,000 mmHg.',
 body:'<h3>Pressure</h3><ul><li>Every 10 m of seawater adds 1 atmosphere. Gas volumes shrink on descent and expand on ascent (Boyle).</li><li>More nitrogen dissolves at depth (Henry). A fast ascent lets it bubble out: decompression sickness.</li></ul><h3>Emergencies</h3><ul><li><b>Pulmonary barotrauma</b> with arterial gas embolism: sudden neurology after ascent.</li><li>Treatment: high-flow 100% oxygen, lie flat, fluids, urgent recompression (Vann 2011).</li></ul><h3>Hyperbaric oxygen</h3><ul><li>At 2.4 atmospheres on 100% oxygen, PaO₂ can exceed 1,000 mmHg and dissolved oxygen alone can meet basic needs.</li><li>Used for decompression illness, gas embolism, and selected carbon monoxide poisoning.</li></ul>',
 keys:[['Each 10 m seawater','+1 atmosphere'],['DCI first aid','100% O₂, recompression'],['HBO PaO₂','> 1,000 mmHg'],['Gas embolism','Neurology after ascent']],hook:'Down deep, gas dissolves; coming up too fast, it bubbles.'},
{id:'sp-pregem',t:'Pregnancy emergencies',
 sum:'Pregnancy baseline: PaCO₂ about 30, HCO₃⁻ about 20. In ventilated pregnant patients aim for PaCO₂ 30–32. Hyperemesis causes metabolic alkalosis; magnesium toxicity causes hypoventilation.',
 body:'<h3>Ventilating a pregnant patient</h3><ul><li>Target the pregnancy baseline: PaCO₂ about 30–32 mmHg. A "normal" 40 is maternal hypercapnia; marked hypocapnia may reduce uterine blood flow.</li><li>Left lateral tilt after 20 weeks to relieve aortocaval compression.</li><li>Keep SpO₂ ≥ 95%: the fetus depends on it.</li></ul><h3>Conditions</h3><ul><li><b>Hyperemesis:</b> chloride-responsive metabolic alkalosis, hypokalaemia, ketosis; give thiamine before glucose.</li><li><b>DKA:</b> faster and at lower glucose.</li><li><b>Magnesium for pre-eclampsia:</b> toxicity first removes reflexes, then depresses breathing (respiratory acidosis). Stop the infusion and give calcium gluconate.</li><li><b>PE and asthma:</b> a PaCO₂ of 40 is already high in pregnancy.</li></ul>',
 keys:[['Ventilated PaCO₂ target','30–32 mmHg'],['Hyperemesis','Metabolic alkalosis'],['Mg toxicity','Reflexes lost, then breathing'],['Antidote','Calcium gluconate']],hook:'In pregnancy, 40 is the new high.'}];

{id:'ch-dka',fmt:'chat',t:'Nineteen and vomiting',pres:'vomit',dis:['hagma'],set:'ER',exam:['MRCEM','USMLE'],src:['jbds23','kraut10'],
 intro:'Triage: 19-year-old woman, vomiting since last night, abdominal pain, breathing fast and deep. HR 124, BP 102/64, RR 30, SpO₂ 99% on air, temperature 37.4 °C.',
 steps:[{m:[['Nurse','Her capillary glucose reads HIGH. Ketone meter says 5.8.'],['Patient','I stopped my insulin, I could not keep anything down.']],q:'What do you do first?',o:[['Venous gas, then start fluids while you assess',1,'The VBG confirms the acidosis in minutes; fluids start straight away.'],['Give 10 units of rapid-acting insulin IV now',0,'Insulin before you know the potassium can cause dangerous hypokalaemia; JBDS starts with fluid and a fixed-rate infusion after the potassium is known.'],['Wait for the formal lab glucose',0,'The meter plus ketones is enough to act; delay worsens the acidosis.']]},
  {m:[['Nurse','VBG is back.']],gas:{sample:'v',pH:7.08,pco2:19,hco3:5.6,na:131,cl:96,k:5.6,glu:31,lac:1.9,alb:42},q:'Read it.',o:[['Severe HAGMA, appropriate respiratory compensation',1,'AG = 131 − (96 + 5.6) ≈ 29. Winter\'s: 1.5 × 5.6 + 8 ≈ 16 ± 2; the venous 19 matches an arterial ≈ 14–17.'],['HAGMA with an added respiratory acidosis',0,'Winter\'s band is about 14–18 (arterial); the venous PCO₂ of 19 sits there once you subtract about 5.'],['NAGMA from vomiting',0,'The anion gap is about 29: high, from ketoacids.']]},
  {m:[['Nurse','Potassium 5.6 on the gas. The first litre of saline is running. What next?']],q:'Insulin and potassium plan?',o:[['Fixed-rate insulin 0.1 units/kg/h; no potassium in this bag; recheck K⁺ in 1–2 h',1,'K⁺ above 5.5: no added potassium yet. It will fall fast once insulin starts.'],['Fixed-rate insulin and add 40 mmol KCl to every bag now',0,'Above 5.5 you do not add potassium; you recheck after insulin starts.'],['Hold insulin until potassium is normal',0,'Potassium 5.6 is not a reason to delay insulin; below 3.5 is.']]},
  {m:[['Nurse','Six hours later: glucose 12, ketones 1.4, pH 7.24, HCO₃⁻ 14, chloride 112.']],q:'What is happening?',o:[['Ketones are clearing; the chloride rise is a hyperchloraemic NAGMA from saline',1,'The gap is closing. Keep the insulin running and add 10% glucose once glucose is below 14 mmol/L.'],['Insulin is failing; double the rate',0,'Ketones fell from 5.8 to 1.4: the insulin is working.'],['DKA has resolved; stop the insulin',0,'Resolution needs ketones below 0.6 and pH above 7.3.']]}]},

{id:'ch-meth',fmt:'chat',t:'Drunk, or something else?',pres:'tox',dis:['hagma'],set:'ER',exam:['MRCEM','USMLE'],src:['kraut18','kraut07'],

  {m:[['Lab','Measured osmolality 338. Calculated 2 × Na + glucose + urea = 293.']],q:'Interpretation and action?',o:[['Osmolar gap 45: give fomepizole (or ethanol) and arrange haemodialysis',1,'Block alcohol dehydrogenase to stop formic acid forming, and remove methanol and formate by dialysis.'],['Normal gap; treat as alcoholic ketoacidosis',0,'A gap of 45 is far above 10.'],['Give bicarbonate and send him home when the pH improves',0,'The toxin is still being metabolised; he needs an antidote and dialysis.']]}]},

  {gas:{sample:'a',pH:7.26,pco2:74,hco3:32,po2:88,fio2:0.36,na:140,cl:97,age:58},q:'Read the gas.',o:[['Acute respiratory acidosis on a probable chronic background',1,'Acute alone gives HCO₃⁻ ≈ 27, chronic ≈ 38; 32 sits between them: chronic retention with an acute rise, fitting likely obesity hypoventilation.'],['Pure acute respiratory acidosis with no background',0,'The bicarbonate is a little higher than acute alone predicts.'],['Metabolic acidosis',0,'HCO₃⁻ is raised, not low.']]},

function safeCase(kind,lvl,opt){for(let i=0;i<4;i++){const c=genCase(kind,lvl,opt);if(c)return c;}

function chooseKind(sess){const ks=kindsFor(sess.lvl);const used=sess.res.map(r=>r.kind);const last=used[used.length-1];
 if(sess.kind&&KINDS[sess.kind])return sess.kind;
 if(sess.mode==='due'){const due=dueKinds().filter(k=>!used.includes(k));if(due.length)return pick(due);}
 if(sess.mode==='today'){const due=dueKinds().filter(k=>ks.includes(k)&&!used.includes(k));if(due.length&&Math.random()<0.75)return pick(due);}
 const pool=ks.filter(k=>k!==last);const wts=pool.map(k=>{const s=S.kinds[k];return (s&&s.n?1+(1-s.c/s.n)*3:2)*(used.includes(k)?0.4:1);});
 let t=Math.random()*wts.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){t-=wts[i];if(t<=0)return pool[i];}return pool[0]||ks[0];}

const PRIMOPT={mac:'Metabolic acidosis',malk:'Metabolic alkalosis',rac:'Respiratory acidosis',ralk:'Respiratory alkalosis',two:'Two primary processes',none:'No primary disturbance'};
const COMPOPT={met:{ok:'Appropriate compensation',rac:'PCO₂ too high → added respiratory acidosis',ralk:'PCO₂ too low → added respiratory alkalosis'},
 rac:{a:'Acute',ac:'Acute-on-chronic (or 1–2 days old)',c:'Chronic, renally compensated',mac:'HCO₃⁻ too low → added metabolic acidosis',malk:'HCO₃⁻ too high → added metabolic alkalosis'},

const DELTAOPT=['< 0.4 · normal-gap acidosis dominates','0.4–0.8 · HAGMA + NAGMA','0.8–2 · pure HAGMA','> 2 · HAGMA + metabolic alkalosis'];

const REALOPT=['Yes: the numbers fit together','No: recheck before interpreting'];

function gapWhy(c,o){const ar=S.agref||12;return 'AG = '+c.na+' − ('+c.cl+' + '+r1(o.est.hco3)+') = '+r1(o.ag)+(c.alb!=null&&c.alb!==40?'. Albumin '+c.alb+' g/L: '+(0.25*(40-c.alb)>=0?'+ ':'− ')+Math.abs(r1(0.25*(40-c.alb)))+' → corrected '+r1(o.agc):'')+'. Reference ≈ '+ar+', so '+(o.agHigh?'high (above '+(ar+2)+').':'normal.')+(o.ven?' (Estimated arterial HCO₃⁻ used; venous runs ≈ 1 higher.)':'');}
function hintFor(cat,c){const o=c.o,ar=S.agref||12;switch(cat){
 case 'real':return '[H⁺] = 24 × PCO₂ ÷ HCO₃⁻ should be close to 80 − the pH decimals (for pH 7.20–7.50).';
 case 'ph':return 'Acidaemia below 7.35, alkalaemia above 7.45.'+(o.ven?' Venous pH runs ≈ 0.03 below arterial.':'');
 case 'prim':return 'Normal PCO₂ 35–45 mmHg, HCO₃⁻ 22–26. The value that moved in the direction of the pH is the primary process; if both did, there are two.';
 case 'comp':return o.primKey==='mac'?'Winter\'s: expected PCO₂ = 1.5 × HCO₃⁻ + 8 ± 2.':o.primKey==='malk'?'Expected PCO₂ = 0.7 × HCO₃⁻ + 20 ± 5.':o.primKey==='rac'?'For every 10 mmHg above 40: HCO₃⁻ +1 acute, +4 chronic (± 2).':'For every 10 mmHg below 40: HCO₃⁻ −2 acute, −5 chronic (± 2).';
 case 'gap':return 'AG = Na⁺ − (Cl⁻ + HCO₃⁻). Add 2.5 for every 10 g/L of albumin below 40. High if above '+(ar+2)+'.';
 case 'delta':return '(AG − '+ar+') ÷ (24 − HCO₃⁻). Under 0.8: an extra normal-gap acidosis. Over 2: an extra metabolic alkalosis.';
 case 'read':return 'Put together every process you found: primary, any failed compensation, the gap type and the Δ ratio.';
 case 'cause':return 'Which history produces exactly this combination?';
 case 'ox':return o.ven?'Look at the sample type before the number.':'Room air: PAO₂ = 0.21 × ('+(S.patm||760)+' − 47) − PaCO₂ ÷ 0.8, and the A–a gradient is normal up to about age ÷ 4 + 4. On oxygen: P/F = PaO₂ ÷ FiO₂.';
 case 'whatif':return 'Acutely, HCO₃⁻ moves only ≈ 1 per 10 mmHg of PCO₂. Then pH = 6.1 + log(HCO₃⁻ ÷ (0.03 × PCO₂)).';}
 return '';}
function realQ(c,consistent){return {cat:'real',t:'Is this gas internally consistent?',opts:REALOPT,a:REALOPT[consistent?0:1],why:c.o.steps.find(s=>s.k==='real').d};}
function buildQs(c,lvl,mode){const o=c.o,qs=[];const est=o.est;
 if(mode==='steps'){
  const ps=phState(est.pH);qs.push({cat:'ph',t:'pH: acidaemia, alkalaemia or normal?',opts:['Acidaemia','Alkalaemia','Normal pH'],a:ps==='acid'?'Acidaemia':ps==='alk'?'Alkalaemia':'Normal pH',why:o.steps.find(s=>s.k==='ph').d});
  qs.push({cat:'prim',t:'Primary process?',opts:['mac','malk','rac','ralk','two','none'].map(k=>PRIMOPT[k]),a:PRIMOPT[o.primKey],why:o.steps.find(s=>s.k==='sys').d});
  if(['mac','malk','rac','ralk'].includes(o.primKey)){const set=o.primKey==='mac'||o.primKey==='malk'?COMPOPT.met:COMPOPT[o.primKey];qs.push({cat:'comp',t:'Compensation?',opts:Object.values(set),a:set[o.compKey],why:o.steps.find(s=>s.k==='comp').d});}
  if(lvl>=3&&o.agc!=null){qs.push({cat:'gap',t:'Anion gap (corrected for albumin)?',opts:['Normal','High'],a:o.agHigh?'High':'Normal',why:gapWhy(c,o)});
   if(o.delta!=null)qs.push({cat:'delta',t:'Δ ratio?',opts:DELTAOPT,a:DELTAOPT[deltaBand(o.delta)],why:'Δ ratio = (AG − '+(S.agref||12)+') ÷ (24 − HCO₃⁻) = ('+r1(o.agc)+' − '+(S.agref||12)+') ÷ (24 − '+r1(est.hco3)+') = '+o.delta.toFixed(2)+'.'});}}
 const lab=c.label;qs.push({cat:'read',t:mode==='steps'?'So the full read is…':'What is the acid–base read?',opts:shuffle([lab].concat(distract(lab,lvl,4))),a:lab,conf:true,why:'Every process found along the way: '+lab+'.'});
 const same=KINDS[c.kind].v.map(v=>v[0]).filter(x=>x!==c.cause);const others=shuffle(Object.keys(CAUSES).filter(x=>x!==c.cause&&x!=='normal'&&!same.includes(x)));
 const cd=shuffle(same).slice(0,1).concat(others.slice(0,3-Math.min(1,same.length)));
 qs.push({cat:'cause',t:'Most likely cause in this patient?',opts:shuffle([c.cause].concat(cd)).map(x=>CAUSES[x]),a:CAUSES[c.cause],why:'Match the gas to the story: '+CAUSES[c.cause]+'.'});
 if(lvl>=4){const opts=Object.values(OXLAB).concat([VENOX]);
  if(o.ven)qs.push({cat:'ox',t:'And the oxygenation?',opts,a:VENOX,why:'This is a venous sample. A PvO₂ of '+P(c.po2)+' '+PU()+' is normal for venous blood and tells you nothing about gas exchange. Use the SpO₂, or take an ABG if oxygenation matters.'});
  else if(o.ox)qs.push({cat:'ox',t:'And the oxygenation?',opts,a:OXLAB[o.ox.cat],why:o.steps.find(s=>s.k==='ox').d});}

function whatIf(c){const o=c.o,e=o.est;
 if(o.primKey==='mac'&&e.pco2<34&&Math.random()<0.45){const nh=e.hco3+(40-e.pco2)/10,np=phFrom(nh,40);
  const opts=[np,e.pH,7.40,np-0.12].map(x=>x.toFixed(2));if(new Set(opts).size<4||Math.abs(np-e.pH)<0.06)return null;
  const a=np.toFixed(2);return {cat:'whatif',t:'This patient is sedated for intubation and ventilated at "normal" settings. PCO₂ rises to '+P(40)+' '+PU()+' within minutes. The pH becomes about…',opts:shuffle(opts),a,
   why:'The low PCO₂ was the compensation. Acutely, HCO₃⁻ rises only ≈ 1 per 10 mmHg of CO₂, so HCO₃⁻ ≈ '+r1(nh)+'. pH = 6.1 + log('+r1(nh)+' ÷ (0.03 × 40)) = '+a+'. Ventilate a severely acidotic patient to match the minute ventilation they achieved on their own; a "normal" PCO₂ in metabolic acidosis is a danger sign.'};}
 if(o.primKey==='rac'&&(o.compKey==='c'||o.compKey==='ac')&&Math.random()<0.5){const opts=['A normal gas','Alkalaemia from retained bicarbonate (post-hypercapnic metabolic alkalosis)','Worsening respiratory acidosis','Metabolic acidosis'];
  const nh=e.hco3-(e.pco2-40)/10,np=phFrom(nh,40);
  return {cat:'whatif',t:'This patient is intubated and ventilated down to PCO₂ '+P(40)+' '+PU()+' within an hour. What does the next gas show?',opts:shuffle(opts),a:opts[1],
   why:'The kidneys took days to build HCO₃⁻ '+r1(e.hco3)+' and need days to excrete it. Removing the CO₂ quickly leaves the bicarbonate behind: pH ≈ '+np.toFixed(2)+'. Ventilate known retainers to their usual PCO₂ (or a pH of about 7.35–7.40), not to 40.'};}
 return null;}
function inconsistentCase(lvl){const c=safeCase(pick(kindsFor(lvl)),lvl,{strict:true});const b=Object.assign({},c);delete b.o;
 for(const f of shuffle([1.45,0.65,1.6,0.6])){b.hco3=r1(c.hco3*f);const o=interp(b);if(!o.err&&o.flags.includes('inconsistent')){b.o=o;b.label=c.label;b.bad=true;return b;}}return null;}

  if(m==='mist'){const snap=SS.mq[SS.res.length];c=Object.assign({},snap.c);c.o=interp(c);c.label=snap.label;c._mid=snap.id;q=buildQs(c,snap.lvl,'steps');}

 recordStep(q.cat,ok);SS.tally[q.cat]=SS.tally[q.cat]||{n:0,c:0};SS.tally[q.cat].n++;if(ok){SS.tally[q.cat].c++;S.xp=(S.xp||0)+2;}
 if(q.cat==='read'&&!C.c.bad){const allAB=C.q.every((x,j)=>!ABCATS.includes(x.cat)||j>i||(C.ans[j]===x.a&&!C.assist[j]));const st=kindStat(C.c.kind);const now=Date.now();

const COMPS={hagma:['hag'],hag_rac:['hag','rac'],hag_ralk:['hag','ralk'],hag_malk:['hag','malk'],hag_nag:['hag','nag'],hag_malk_ralk:['hag','malk','ralk'],nagma:['nag'],malk:['malk'],rac_a:['rac'],rac_c:['rac'],rac_ac:['rac'],rac_malk:['rac','malk'],ralk_a:['ralk'],ralk_c:['ralk'],ralk_malk:['ralk','malk']};

 const mine=COMPS[k];const pool=shuffle(ks.filter(x=>!COMPS[x].some(y=>mine.includes(y))));
 const picked=[];const seen=new Set();pool.forEach(x=>{const f=COMPS[x].join('+');if(picked.length<3&&!seen.has(f)){seen.add(f);picked.push(x);}});
 pool.forEach(x=>{if(picked.length<3&&!picked.includes(x))picked.push(x);});
 const gases=[c];picked.forEach(x=>{let g=null;for(let i=0;i<6&&!g;i++)g=genCase(x,3,{strict:true});if(g)gases.push(g);});

function gymItem(){const U=PU();const t=pick(['mac','mac','malk','raca','racc','ralka','ralkc','judge','judge']);const R=x=>Math.round(x);

let ROUND=null;
function roundPlan(){const legs=[];const due=dueKinds().length;

function roundCatalog(){const L0=roundPlan(),wl=weakLeg(),o=[];if(wl)o.push(wl);L0.forEach(g=>o.push(g));return o;}

function roundCap(){let m=15;try{if(typeof G!=='undefined'&&G.plan&&+G.plan.minutes)m=+G.plan.minutes;if(typeof slotFor==='function'){const c=SLOT_MIN[slotFor(today())];if(c!=null&&c<m)m=c;}}catch(e){}return m;}
function presetLegs(cat,cap){const out=[];let t=0;[...cat].sort((a,b)=>LEG_PRI.indexOf(a.t)-LEG_PRI.indexOf(b.t)).forEach(g=>{if(t+g.min<=cap||!out.length){out.push(g);t+=g.min;}});return cat.filter(g=>out.includes(g));}
function startRound(){openRoundBuilder();}

  sc.innerHTML='<div class="sheet" role="dialog" aria-label="Build today\'s Round"><div class="sheet-grab"></div><b>Build today\'s Round</b><p class="note" style="margin:6px 0 10px">Tick the legs you want. Your weakest step comes first. '+(typeof G!=='undefined'&&G.plan?'Citrus planned '+esc(String(G.plan.minutes||''))+' min.':'')+'</p>'+

  cat.map((g,i)=>'<label class="srow"><div><b>'+esc(g.label)+'</b><span>about '+g.min+' min</span></div><input type="checkbox" data-i="'+i+'"'+(sel.has(g.t+(g.id||''))?' checked':'')+' aria-label="'+esc(g.label)+'"></label>').join('')+
  '<div class="btnrow" style="margin-top:12px"><button class="btn primary" id="rbBuild"'+(tot?'':' disabled')+'>Start · '+tot+' min</button><button class="btn" id="rbCancel">Cancel</button></div></div>';
  sc.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{const g=cat[+c.dataset.i],k=g.t+(g.id||'');c.checked?sel.add(k):sel.delete(k);draw();});

  $('rbCancel').onclick=()=>sc.remove();
  $('rbBuild').onclick=()=>{const legs=cat.filter(g=>sel.has(g.t+(g.id||'')));sc.remove();if(!legs.length)return;ROUND={legs,i:0,t0:Date.now(),xp0:S.xp||0,day:today()};S.round=ROUND;save();roundGo();};}

function webLayout(){return withSeed(4242,()=>{const W=1200,H=860,P={};const tops=Object.keys(WEB_TOPIC);
 WEB_NODES.forEach(n=>{const ti=tops.indexOf(n[2]);const a=ti/tops.length*Math.PI*2;P[n[0]]={x:W/2+Math.cos(a)*330+(Math.random()-.5)*160,y:H/2+Math.sin(a)*280+(Math.random()-.5)*140,vx:0,vy:0,w:Math.max(70,n[1].length*7.6+24)};});
 const ids=WEB_NODES.map(n=>n[0]);
 for(let it=0;it<420;it++){const cool=1-it/420;
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const A=P[ids[i]],B=P[ids[j]];let dx=A.x-B.x,dy=A.y-B.y;const d2=dx*dx+dy*dy+0.01;const d=Math.sqrt(d2);const f=Math.min(9000/d2,6);dx/=d;dy/=d;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f;}
  WEB_EDGES.forEach(([a,b])=>{const A=P[a],B=P[b];const dx=B.x-A.x,dy=B.y-A.y;const d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-180)*0.012;A.vx+=dx/d*f;A.vy+=dy/d*f;B.vx-=dx/d*f;B.vy-=dy/d*f;});
  ids.forEach(id=>{const p=P[id];p.vx+=(W/2-p.x)*0.002;p.vy+=(H/2-p.y)*0.002;p.x+=p.vx*cool;p.y+=p.vy*cool;p.vx*=0.6;p.vy*=0.6;});}
 /* remove label overlaps: push boxes apart */
 for(let it=0;it<300;it++){let moved=false;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const A=P[ids[i]],B=P[ids[j]];const ox=(A.w+B.w)/2+12-Math.abs(A.x-B.x),oy=44-Math.abs(A.y-B.y);if(ox>0&&oy>0){moved=true;if(ox/(A.w+B.w)<oy/44){const s=Math.sign(A.x-B.x||1)*ox/2;A.x+=s;B.x-=s;}else{const s=Math.sign(A.y-B.y||1)*oy/2;A.y+=s;B.y-=s;}}}if(!moved)break;}
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;ids.forEach(id=>{const p=P[id];x0=Math.min(x0,p.x-p.w/2);x1=Math.max(x1,p.x+p.w/2);y0=Math.min(y0,p.y-15);y1=Math.max(y1,p.y+15);});
 ids.forEach(id=>{P[id].x-=x0-16;P[id].y-=y0-16;});P._w=Math.ceil(x1-x0+32);P._h=Math.ceil(y1-y0+32);
 return P;});}

 const pats=[['pH','\\bpH\\b(?:\\s*\\(?T\\)?)?[^0-9\\n]{0,14}([67]\\.\\d{1,3})'],['pco2','\\bp\\s?[av]?\\s?co2\\b[^0-9\\n]{0,16}'+num],['po2','\\bp\\s?[av]?\\s?o2\\b[^0-9\\n]{0,16}'+num],['hco3','\\b(?:c?hco3|bicarb\\w*|hco3-?\\s*(?:std|act)?)[^0-9\\n]{0,18}'+num],['be','\\b(?:be|abe|sbe|base\\s*excess)\\b[^0-9\\n-]{0,14}'+num],['na','\\bc?na\\+?(?![a-z])[^0-9\\n]{0,12}(\\d{3}(?:\\.\\d)?)'],['k','\\bc?k\\+?(?![a-z])[^0-9\\n]{0,12}(\\d{1,2}(?:\\.\\d+)?)'],['cl','\\bc?cl-?(?![a-z])[^0-9\\n]{0,12}(\\d{2,3}(?:\\.\\d)?)'],['lac','\\bc?lac\\w*[^0-9\\n]{0,12}'+num],['glu','\\bc?glu\\w*[^0-9\\n]{0,12}'+num],['alb','\\balb\\w*[^0-9\\n]{0,12}'+num],['fio2','\\bfio2[^0-9\\n]{0,12}'+num],['cohb','\\b(?:f)?cohb[^0-9\\n]{0,12}'+num],['methb','\\b(?:f)?methb[^0-9\\n]{0,12}'+num],['urea','\\b(?:urea|bun)[^0-9\\n]{0,12}'+num],['osm','\\bosm\\w*[^0-9\\n]{0,12}'+num],['spo2','\\bspo2[^0-9\\n]{0,12}'+num]];
 for(const [k,p] of pats){const m=t.match(new RegExp(p,'i'));if(m){const v=parseFloat(m[1]);if(!isNaN(v)){out[k]=v;got.push(k);}}}
 let kpa=/kpa/i.test(t)&&!/mmhg/i.test(t);
 if(!kpa&&!/mmhg/i.test(t)&&out.pco2!=null&&out.pco2<15){/* no unit given: pick the unit that makes pH, PCO2 and HCO3 agree */
  if(out.pH!=null&&out.hco3!=null){const fit=p=>Math.abs(24*p/out.hco3-Math.pow(10,9-out.pH));kpa=fit(out.pco2*KPA)<fit(out.pco2);}else kpa=out.pco2<9;}
 if(kpa){if(out.pco2!=null)out.pco2=r1(out.pco2*KPA);if(out.po2!=null)out.po2=r1(out.po2*KPA);}
 if(out.fio2!=null&&out.fio2>1)out.fio2=out.fio2/100;
 if(out.alb!=null&&out.alb<10)out.alb=out.alb*10;
 if(out.glu!=null&&out.glu>60)out.glu=r1(out.glu/18);
 if(/\bmg\/dl\b/i.test(t)&&out.urea!=null&&/\bbun\b/i.test(t))out.urea=r1(out.urea/2.8);

function FORMULAS(){return '<details class="card formulas"><summary><span class="eyebrow">Formulas, assumptions and limits</span></summary><div class="tw" style="margin-top:12px"><table class="tbl"><tr><th>Quantity</th><th>Formula</th><th>Assumptions and limits</th></tr>'+[
 ['Consistency check','[H⁺] (nmol/L) = 24 × PCO₂ ÷ HCO₃⁻; compare with 10^(9 − pH)','Flag above 10% difference. Analysers calculate HCO₃⁻, so a mismatch means transcription or mixed samples.'],

 urine:b=>{const u=uid();b.innerHTML='<div class="card wbox"><div class="ctrls">'+num(u+'na','Urine Na⁺',40,1,'mmol/L')+num(u+'k','Urine K⁺',30,1,'mmol/L')+num(u+'cl','Urine Cl⁻',90,1,'mmol/L')+num(u+'ur','Urine urea',150,1,'mmol/L')+num(u+'gl','Urine glucose',0,0.1,'mmol/L')+num(u+'os','Measured urine osm',480,1,'mOsm/kg')+'</div><div class="readout">'+ro(u,'ag','Urine AG')+ro(u,'co','Calc. U-osm')+ro(u,'og','U-osmolal gap')+ro(u,'nh','NH₄⁺ ≈')+'</div><p class="verdict-line" id="'+u+'v"></p></div><div class="card"><span class="eyebrow">How to use it</span><ul class="tight"><li>Only for a normal-gap (hyperchloraemic) metabolic acidosis.</li><li>Urine AG = Na + K − Cl. Negative ("neGUTive"): the kidney is excreting ammonium, so the loss is from the gut or a drip. Positive: the kidney cannot (distal RTA, type 4).</li><li>The urine AG fails with ketones, hippurate (toluene), D-lactate, penicillins, or urine Na⁺ under ≈ 20. Then use the urine osmolal gap: NH₄⁺ ≈ gap ÷ 2; under ≈ 150 mOsm/kg in an acidosis points to the kidney failing to excrete acid.</li></ul></div>';

function POCKET(){const U=PU(),pp=v=>P(v)+' '+U;return '<div class="pocket">'+

 '<div class="card"><span class="eyebrow">Gaps</span><table class="tbl"><tr><td>Anion gap</td><td class="mono">Na − (Cl + HCO₃⁻); ref '+(S.agref||12)+'</td></tr><tr><td>Albumin</td><td class="mono">+ 0.25 × (40 − alb g/L)</td></tr><tr><td>Δ ratio</td><td class="mono">(AG − '+(S.agref||12)+') ÷ (24 − HCO₃⁻): &lt; 0.8 + NAGMA, &gt; 2 + alkalosis</td></tr><tr><td>Osmolar gap</td><td class="mono">measured − (2Na + glu + urea) &gt; 10</td></tr><tr><td>Urine AG</td><td class="mono">Na + K − Cl: negative = gut</td></tr></table></div>'+

  const first=pts[0][1],last=pts[pts.length-1][1],dl=last-first,f=k==='pH'?2:1,show=v=>k==='pco2'||k==='po2'?P(v):(+v).toFixed(f);
  return '<div class="trow"><div><b>'+lab+'</b><small>'+show(first)+' → '+show(last)+' ('+(dl>=0?'+':'')+(k==='pco2'||k==='po2'?P(dl):dl.toFixed(f))+')</small></div>'+sparkSVG(pts,lo,hi)+'</div>';}).join('');
 return '<div class="trend">'+rows+'</div><ol class="tlist">'+d.map(x=>'<li><span class="mono">'+fmtT(x.t)+'</span> '+esc(x.label||'')+'</li>').join('')+'</ol>'+
  '<p class="note">'+trendSay(d)+'</p>';}
function trendSay(d){const a=d[0],b=d[d.length-1],s=[];if(a.v.pH!=null&&b.v.pH!=null){const dp=b.v.pH-a.v.pH;s.push(Math.abs(dp)<0.03?'pH is about the same':dp>0?'pH is rising':'pH is falling');}

 if(a.v.lac!=null&&b.v.lac!=null&&a.v.lac>0){const pc=(a.v.lac-b.v.lac)/a.v.lac*100;s.push('lactate '+(pc>=10?'cleared '+Math.round(pc)+'%':pc<=-10?'rose '+Math.round(-pc)+'%':'is flat'));}
 if(a.v.cl!=null&&b.v.cl!=null&&b.v.cl-a.v.cl>=4&&a.ag!=null&&b.ag!=null&&b.ag<a.ag)s.push('chloride rose as the gap closed, the usual hyperchloraemic phase of recovery');

function weekStart(d){d=new Date(d||Date.now());const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);d.setHours(0,0,0,0);return d;}
function weeklyReview(){const st=weekStart(),k0=isoD(st),end=new Date(st);end.setDate(st.getDate()+6);const k1=isoD(end);
 const inWk=k=>k>=k0&&k<=k1;const sess=(S.sess||[]).filter(s=>inWk(s.d));const n=sess.reduce((a,s)=>a+(+s.n||0),0),ok=sess.reduce((a,s)=>a+(+s.ok||0),0);
 const days=(S.days||[]).filter(inWk).length;const mins=Math.round(n*1.2);
 const steps=Object.keys(STEPNAME).map(k=>[k,stepAcc(k)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]).slice(0,2);
 const pats=Object.keys(S.kinds||{}).map(k=>{const r=S.kinds[k];return [k,r&&r.n?r.c/r.n:null,r&&r.n];}).filter(x=>x[1]!=null&&x[2]>=3).sort((a,b)=>a[1]-b[1]).slice(0,2);
 const live=logList().filter(e=>inWk(isoD(new Date(e.t))));
 const liveK={};live.forEach(e=>{const v=Object.assign({sample:e.sample},e.v);if(v.hco3==null&&v.pH!=null&&v.pco2!=null)v.hco3=r1(hFrom(v.pH,v.pco2));try{const o=interp(v);const k=o.primKey==='mac'?(o.r.mac==='NAGMA'?'NAGMA':o.r.mac==='HN'?'HAGMA + NAGMA':'HAGMA'):({malk:'metabolic alkalosis',rac:'respiratory acidosis',ralk:'respiratory alkalosis',two:'mixed',none:'normal'})[o.primKey]||o.primKey;liveK[k]=(liveK[k]||0)+1;}catch(err){}});
 const line='Buffer week '+ddmmyyyy(st)+': '+days+' day'+(days===1?'':'s')+', '+n+' gases ('+(n?Math.round(ok/n*100):0)+'%), about '+mins+' min'+(steps[0]?'; weakest step '+STEPNAME[steps[0][0]]+' '+Math.round(steps[0][1]*100)+'%':'')+(live.length?'; '+live.length+' real gas'+(live.length>1?'es':'')+' logged':'')+'.';
 return {start:k0,end:k1,days,n,ok,mins,streak:streak(),steps,pats,live:live.length,liveK,line};}
function weeklyCard(){const w=weeklyReview();const kn=k=>(KSHORT&&KSHORT[k])||k;
 return '<div class="card weekc"><div class="btnrow" style="justify-content:space-between"><span class="eyebrow">This week · from '+ddmmyyyy(new Date(w.start+'T00:00'))+'</span><button class="btn small" id="wkCopy">Copy line</button></div>'+
  '<div class="stats"><div><b>'+w.days+'/7</b><small>days studied</small></div><div><b>'+w.n+'</b><small>gases · '+(w.n?Math.round(w.ok/w.n*100):0)+'%</small></div><div><b>~'+w.mins+'</b><small>minutes</small></div><div><b>'+w.streak+'</b><small>day streak</small></div></div>'+
  '<div class="grid2" style="margin-top:12px"><div><h4>Weakest steps</h4>'+(w.steps.length?'<ul class="nx">'+w.steps.map(s=>'<li>'+esc(STEPNAME[s[0]])+' · '+Math.round(s[1]*100)+'%</li>').join('')+'</ul>':'<p class="note">Not enough attempts yet.</p>')+

function spShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gasBlock(c,more){const U=PU();const rows=[['pH',c.pH.toFixed(2)],['PCO₂ <i>'+U+'</i>',P(c.pco2)],['HCO₃⁻',r1(c.hco3)]];

const NOISE=[['Hb','g/dL',()=>r1(9+Math.random()*7),12,16],['Hct','%',()=>Math.round(28+Math.random()*20),36,48],['K⁺','mmol/L',null,3.5,5.1],['iCa²⁺','mmol/L',()=>(1+Math.random()*0.35).toFixed(2),1.15,1.33],['Glu','mmol/L',null,3.9,7.8],['Lac','mmol/L',null,0.5,2.2],['Crea','µmol/L',()=>Math.round(55+Math.random()*180),60,110],['tHb O₂Hb','%',()=>r1(90+Math.random()*7),94,98],['COHb','%',()=>r1(0.4+Math.random()*2.6),0,1.5],['MetHb','%',()=>r1(0.2+Math.random()*1.1),0,1.5],['Temp','°C',()=>r1(36.2+Math.random()*2.6),null,null],['Baro','mmHg',()=>Math.round(740+Math.random()*25),null,null]];
function spFlag(v,lo,hi){if(lo==null||v==null)return '';const x=+v;return x<lo?'L':x>hi?'H':'';}
function printout(c,bad){const U=PU();const ph=bad?r2(c.pH+(Math.random()<0.5?-1:1)*(0.09+Math.random()*0.06)):c.pH;
 const be=0.93*(c.hco3-24.4+14.8*(c.pH-7.4));const ag=c.na-(c.cl+c.hco3);
 const main=[['pH','',ph.toFixed(3),7.35,7.45],['pCO₂',U,P(c.pco2),S.units==='kPa'?4.7:35,S.units==='kPa'?6:45],['pO₂',U,P(c.po2||90),S.units==='kPa'?10.7:80,S.units==='kPa'?13.3:100],['cHCO₃⁻(P)c','mmol/L',r1(c.hco3),22,26],['cBase(Ecf)c','mmol/L',(be>=0?'+':'')+r1(be),-2,2],['Na⁺','mmol/L',c.na,136,145],['Cl⁻','mmol/L',c.cl,98,107],['Anion gap c','mmol/L',r1(ag),8,16]];
 const extra=NOISE.map(n=>{let v=n[2]?n[2]():n[0]==='K⁺'?c.k:n[0]==='Glu'?c.glu:n[0]==='Lac'?c.lac:null;if(v==null)return null;return [n[0],n[1],v,n[3],n[4]];}).filter(Boolean);

const NEXTACT={hagma:'lactate, ketones, renal function and an osmolar gap',nagma:'potassium and a urine anion gap',malk:'urine chloride and potassium',rac:'look for the cause of hypoventilation; NIV or airway support if failing',ralk:'look for hypoxaemia, sepsis or salicylate before calling it anxiety',mixed:'treat the dangerous process first and repeat the gas'};
function actFor(c){const o=c.o||interp(c);const r=o.r||{};if(r.mac&&r.mac!=='NAGMA'&&(o.prim||[]).length)return NEXTACT.hagma;if(r.mac==='NAGMA')return NEXTACT.nagma;if(r.rac)return NEXTACT.rac;if(r.ralk)return NEXTACT.ralk;if(r.malk)return NEXTACT.malk;return NEXTACT.mixed;}
function handoverLine(c,label,act){return 'ABG: '+label.charAt(0).toLowerCase()+label.slice(1)+'. Next: '+act+'.';}
function handoverOpts(c,lvl){const right=handoverLine(c,c.label,actFor(c));const ds=distract(c.label,lvl,2);
 const w1=handoverLine(c,ds[0]||'Normal gas',actFor(c)),w2=handoverLine(c,c.label,pick(Object.values(NEXTACT).filter(a=>a!==actFor(c)))),w3=handoverLine(c,ds[1]||ds[0]||'Normal gas',actFor(c));

const satP=p=>p<=0?0:1/(1+23400/(p*p*p+150*p));
const cO2=p=>1.34*VQM.Hb*satP(p)+0.003*p;
const cCO2=p=>0.5*p+28;
function pFromCO2content(c,hi){let lo=0;hi=hi||700;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(cO2(m)<c)lo=m;else hi=m;}return (lo+hi)/2;}

 const k=0.005*Q;const paco2=k*VQM.PvCO2/(VA/(pb-47)+k);const fac=paco2/(pb-47);const cv=cO2(VQM.PvO2);
 const g=pa=>{const fa=pa/(pb-47);const gas=VA*((1-fa-fac)*fio2/(1-fio2)-fa);const blood=Q*0.01*(cO2(pa)-cv);return gas-blood;};
 let lo=VQM.PvO2,hi=PI;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(g(m)>0)lo=m;else hi=m;}const pao2=(lo+hi)/2;return {pao2,paco2,cc:cO2(pao2),ccc:cCO2(paco2)};}

 const ccv=cO2(VQM.PvO2),cvc=cCO2(VQM.PvCO2);const ca=((A.cc!=null?qa*A.cc:0)+(B.cc!=null?qb*B.cc:0)+qs*ccv)/Q,cac=((A.ccc!=null?qa*A.ccc:0)+(B.ccc!=null?qb*B.ccc:0)+qs*cvc)/Q;
