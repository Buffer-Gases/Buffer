*{box-sizing:border-box;border-radius:0!important}
.round,.web-n circle,input[type=radio]{border-radius:50%!important}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--px);font-weight:400;line-height:1.25;margin:0;letter-spacing:0;font-synthesis:none;-webkit-font-smoothing:none;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}h3{font-size:14px}
p{margin:0}a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.px{font-family:var(--px);font-variant-numeric:tabular-nums;font-weight:400;-webkit-font-smoothing:none}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--px);font-size:10px;letter-spacing:0;text-transform:uppercase;color:var(--accent-ink);font-weight:400;-webkit-font-smoothing:none}
.muted{color:var(--muted)}
.note{font-size:.86rem;color:var(--muted);max-width:75ch;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* notched bevelled card */
.card{background:var(--surface);border:2px solid var(--line);box-shadow:inset 2px 2px 0 var(--bev),inset -2px -2px 0 var(--bevd);padding:16px;min-width:0;--n:3px;clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.card.tint{background:var(--accent-tint)}
.card.raised{border-color:var(--accent);box-shadow:5px 5px 0 var(--deep);clip-path:none}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--px);font-size:18px;color:var(--ink);-webkit-font-smoothing:none}
.brand .bub{position:relative;width:22px;height:22px;background:var(--accent);box-shadow:3px 3px 0 var(--deep)}
.brand .bub::before{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;background:var(--hi)}
.brand .bub::after{content:"";position:absolute;right:-7px;top:-7px;width:7px;height:7px;background:var(--accent);box-shadow:1px 1px 0 var(--deep)}
nav.tabs{display:flex;gap:2px;margin-left:10px}
nav.tabs button{border:0;background:none;font-family:var(--px);font-size:10px;padding:8px 10px;color:var(--muted);display:flex;align-items:center;gap:6px;-webkit-font-smoothing:none}
nav.tabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;shape-rendering:crispEdges}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs button:hover:not([aria-current="page"]){color:var(--ink)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-family:var(--px);font-size:10px;background:var(--surface-2);border:2px solid var(--line);white-space:nowrap;color:var(--ink);-webkit-font-smoothing:none}
.chip.hot,.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--line);background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--bevd),inset 0 1px 0 var(--bev)}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;background:var(--bg);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:3px;text-align:center;padding:7px 2px;font-size:9px;justify-content:center}
  nav.tabs button svg{width:22px;height:22px}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
  body.insession nav.tabs{display:none}
  body.insession main{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))!important}
  #roundbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  body.insession #roundbar{bottom:0}
  .hrow .chip.xp{display:none}
}
main{padding-block:18px 90px}
section.view{display:flex;flex-direction:column;gap:16px;animation:fadein .18s steps(3)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* buttons */

lesson({id:'learn',m:'start',t:'How you will learn blood gases',
sum:'Understand the mechanism once, drill one fixed read until it is reliable, then make it fast. Every part of the app maps to a method with evidence behind it.',
body:`<p>Experts read a gas in seconds because two things run together: pattern recognition ("compensated metabolic acidosis") and a quick analytic check ("Winter's agrees"). Learners taught to combine both diagnose more accurately than those taught either alone. Buffer trains both.</p>
<h3>Where people actually go wrong</h3>
<p>An audit of junior doctors' blood gas reads (Aswan University Hospital, 2024) found most got the pH (83%) and the respiratory-versus-metabolic call (82%) right. They fell down on the <b>compensation</b> step (47% correct), linking the gap to the bicarbonate fall (64%), the anion gap (69%) and checking the gas is internally consistent (72%). A short structured teaching programme lifted compensation to 78%. So Buffer spends extra practice exactly there: the compensation gym, the Δ ratio step and the consistency check.</p>
<h3>The methods, and where they live in the app</h3>
${tw('<tr><th>Method</th><th>Why</th><th>In Buffer</th></tr><tr><td>One fixed sequence</td><td>Structured reads cut omissions; the audit improvements came from teaching a stepwise approach</td><td>Six-step read in every lesson, interpreter and step-by-step session</td></tr><tr><td>Worked examples that fade</td><td>Novices learn more from solved examples; as skill grows the same help slows experts down (expertise reversal)</td><td>Hints open automatically on steps you get wrong and stay closed on steps you have mastered</td></tr><tr><td>Retrieval practice</td><td>Recalling beats rereading for long-term memory</td><td>Every lesson ends in questions; practice always asks before it tells</td></tr><tr><td>Spacing</td><td>Reviews spread over days outlast cramming</td><td>Each pattern returns at 1, 3, 7, 16 and 35 days; today\'s session pulls in what is due</td></tr><tr><td>Interleaving and contrast</td><td>Mixing look-alike categories builds discrimination (Hatala 2003, ECG)</td><td>Sessions shuffle disorders; answer options are deliberately similar</td></tr><tr><td>Deliberate practice with immediate feedback</td><td>Accuracy climbs steadily with volume when each attempt is corrected at once</td><td>Every step is marked with its arithmetic before you move on</td></tr><tr><td>Prediction</td><td>Generating an answer before seeing it improves later learning</td><td>"Which gas fits?": read the patient, predict, then choose</td></tr><tr><td>Calibration</td><td>Clinicians are often more confident than accurate; low confidence also tracks errors</td><td>Rate your confidence; Today shows how often "sure" is right</td></tr><tr><td>Automaticity</td><td>Fluency frees attention for the patient</td><td>Reflex sessions: 90% correct, median under 8 s</td></tr><tr><td>Elaboration and connection</td><td>Linking each idea to its neighbours makes it retrievable from more cues</td><td>Concept web: tap any idea to see what it depends on and what it changes</td></tr><tr><td>Explaining (teach-back)</td><td>Generating an explanation exposes gaps that recognition hides</td><td>Teach it back: write it, then grade yourself against key points</td></tr><tr><td>Error reflection</td><td>Naming why you erred (misread, slip, rule, mix-up) targets the fix</td><td>One tap after a miss; Progress shows the pattern</td></tr>')}
<p>Self-explanation of mechanism helps mainly when cases share mechanisms, so each answer explains the physiology rather than asking you to write it out.</p>
<h3>A good week</h3>
<ul><li>Most days: the Round on Today (about 25 minutes: due gases, the concept of the day, compensation sums, estimates, step-by-step cases, one shift scenario and a teach-back).</li>
<li>Two or three times a week: a lesson, then a compensation gym or a reflex round.</li>
<li>Every real gas at work: read it yourself first, then check it in Interpret.</li></ul>`,
keys:[['Weakest step in audits','Compensation (≈ 47% correct)'],['Reflex target','90% correct, < 8 s'],['Review spacing','1 · 3 · 7 · 16 · 35 days']],
hook:'Understand it slowly once, check every step for a while, then read it fast forever.',
q:[['Which practice schedule best builds the ability to tell two similar acid–base disorders apart?',['Blocked practice: all metabolic acidosis cases, then all alkalosis cases','Interleaved practice: disorders shuffled together','Rereading the summary tables','Only practising the disorders you find easy'],1,'Interleaving forces a choice between categories every time, which is the skill a real gas demands.'],
['In audits of junior doctors, which step of ABG interpretation was most often wrong?',['Acidaemia versus alkalaemia','Respiratory versus metabolic','Assessing compensation','Reading the pH'],2,'Only about half assessed compensation correctly; it is also where hidden second disorders are found.'],
['Why do Buffer\'s hints disappear on steps you have mastered?',['To save screen space','Worked help that aids novices slows experts down (expertise reversal)','Hints are only for lessons','To make the app harder for everyone'],1,'Support should fade as competence grows.']]});

/* ---------- CHEMISTRY ---------- */
lesson({id:'ph',m:'chem',t:'Acids, bases and pH',w:['phh'],
sum:'pH is a logarithmic way of writing a tiny hydrogen ion concentration: 40 nanomoles per litre at pH 7.40.',
body:`<p>An <b>acid</b> donates a proton (H⁺); a <b>base</b> accepts one (Brønsted–Lowry). A <b>strong</b> acid dissociates completely in water; a <b>weak</b> acid only partly, which is what makes weak acids useful buffers.</p>
<p>pH = −log₁₀[H⁺], with [H⁺] in mol/L. Normal plasma [H⁺] is about <b>40 nmol/L</b> (0.00000004 mol/L), which is pH 7.40. That is roughly a million times lower than plasma sodium, yet small changes in it alter protein charge, enzyme activity, ion channels and oxygen binding.</p>
<h3>Living with the log scale</h3>
<ul><li>A fall of 0.3 pH units doubles [H⁺]: 7.40 → 40, 7.10 → 80 nmol/L.</li>
<li>Because the scale is logarithmic, a drop from 7.10 to 7.00 adds 20 nmol/L of H⁺, while a drop from 7.40 to 7.30 adds only 10. The same 0.1 means more acid the sicker the patient.</li>
<li><b>The 80 rule:</b> between pH 7.20 and 7.50, [H⁺] ≈ 80 − the two digits after "7." So pH 7.25 → about 55 nmol/L (true value 56).</li></ul>
<p>The range compatible with life is roughly pH 6.8–7.8, that is 160 to 16 nmol/L.</p>`,
keys:[['pH 7.40','[H⁺] 40 nmol/L'],['Normal pH','7.35–7.45'],['−0.3 pH','[H⁺] doubles']],
hook:'"Eighty minus the decimals" gives [H⁺] in nmol/L between 7.20 and 7.50.',
q:[['Using the 80 rule, what is [H⁺] at pH 7.32?',['32 nmol/L','48 nmol/L','68 nmol/L','40 nmol/L'],1,'80 − 32 = 48 nmol/L (true value 47.9).'],
['pH falls from 7.40 to 7.10. What happens to [H⁺]?',['Rises by 30%','Doubles','Rises tenfold','Halves'],1,'0.3 pH units ≈ log₁₀2, so [H⁺] doubles from 40 to about 80 nmol/L.']]});

lesson({id:'buffer',m:'chem',t:'Buffers',
sum:'A buffer is a weak acid with its conjugate base. It soaks up added H⁺ or OH⁻ so pH changes far less than it otherwise would.',
body:`<p>For a weak acid HA ⇌ H⁺ + A⁻, added H⁺ combines with A⁻ to form HA, and added base removes H⁺ which HA then replaces. The pH moves, but much less than it would in water.</p>
<p>A buffer works best within about <b>±1 pH unit of its pKa</b>, the pH at which HA and A⁻ are equal. Buffer capacity also scales with concentration: more buffer, more acid absorbed.</p>
<h3>The puzzle of bicarbonate</h3>
<p>The bicarbonate system has a pKa of 6.1, more than a full unit below blood pH. In a closed beaker it would be a poor buffer at 7.4. In the body it is the most important extracellular buffer because the system is <b>open</b>: the CO₂ formed when bicarbonate absorbs acid is breathed out, and the kidneys can make new bicarbonate. Both ends of the equation are under physiological control.</p>
<p>Without that open system, a load of 10 mmol/L of strong acid would produce a severe acidosis. With it, the lungs remove the extra CO₂ within minutes.</p>`,
keys:[['Bicarbonate pKa','6.1'],['Best buffer range','pKa ± 1'],['Main extracellular buffer','HCO₃⁻ / CO₂']],
hook:'Bicarbonate is a mediocre buffer with two excellent managers: the lungs and the kidneys.',
q:[['Why is HCO₃⁻/CO₂ effective at pH 7.4 despite a pKa of 6.1?',['Its concentration is tiny','The system is open: lungs remove CO₂ and kidneys regenerate HCO₃⁻','Carbonic anhydrase changes the pKa','It works inside cells only'],1,'An open system lets both components be adjusted independently.'],
['Within what range of its pKa does a buffer work best?',['±0.1 pH units','±1 pH unit','±3 pH units','Only exactly at the pKa'],1,'Within about one unit either side, the acid and base forms are both present in useful amounts.']]});

lesson({id:'ca',m:'chem',t:'CO₂, carbonic acid and carbonic anhydrase',w:['rbc'],
sum:'CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻. Carbonic anhydrase makes the first step thousands of times faster.',
body:`<p>Dissolved CO₂ reacts with water to form carbonic acid, which dissociates at once into H⁺ and HCO₃⁻. Uncatalysed, the hydration step takes seconds, too slow for blood that crosses a lung capillary in under a second. <b>Carbonic anhydrase (CA)</b>, a zinc enzyme and one of the fastest known, speeds it up enormously.</p>
<h3>Where CA works</h3>
<ul><li><b>Red cells:</b> CO₂ from tissues becomes HCO₃⁻ inside the cell; the H⁺ binds to haemoglobin.</li>
<li><b>Proximal tubule:</b> luminal CA allows filtered bicarbonate to be reclaimed (see the kidney module).</li>
<li><b>Gastric parietal cells and pancreas:</b> acid and bicarbonate secretion.</li>
<li><b>Lung capillary endothelium</b>, and many other sites.</li></ul>
<h3>Clinical link</h3>
<p><b>Acetazolamide</b> inhibits CA. Proximal bicarbonate reclaim fails, bicarbonate is lost in urine, and a <b>normal anion gap metabolic acidosis</b> results. That acidosis drives ventilation, which is why acetazolamide is used for altitude sickness and sometimes for metabolic alkalosis in ventilated patients.</p>
<p>Because CO₂ equilibrates so fast, PCO₂ behaves as the "acid" term in Henderson–Hasselbalch, even though carbonic acid itself exists only fleetingly.</p>`,
keys:[['Reaction','CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻'],['Enzyme','Carbonic anhydrase (zinc)'],['Inhibitor','Acetazolamide → NAGMA']],
hook:'CA = "CO₂ Accelerator".',
q:[['A trekker takes acetazolamide. Which gas pattern do you expect?',['High anion gap metabolic acidosis','Normal anion gap metabolic acidosis','Metabolic alkalosis','Acute respiratory acidosis'],1,'Blocked proximal bicarbonate reclaim → urinary HCO₃⁻ loss with chloride retained → hyperchloraemic (normal AG) acidosis.'],
['Inside the red cell, where does most of the H⁺ from CO₂ hydration go?',['Excreted across the membrane','Bound to haemoglobin','Bound to chloride','Converted back to water'],1,'Deoxygenated haemoglobin is a good buffer; its histidine groups take up the H⁺.']]});

lesson({id:'hh',m:'chem',t:'Henderson–Hasselbalch',w:['hh'],
sum:'pH = 6.1 + log(HCO₃⁻ / 0.03 × PCO₂). Normal ratio 20:1. pH depends on the ratio, not either value alone.',
body:`<p>From the dissociation of carbonic acid, and replacing carbonic acid with dissolved CO₂ (solubility 0.03 mmol/L per mmHg, or 0.23 per kPa):</p>
<div class="eq">pH = 6.1 + log₁₀ ( [HCO₃⁻] ÷ (0.03 × PCO₂) )</div>
<p>Normal: 24 ÷ (0.03 × 40) = 24 ÷ 1.2 = <b>20</b>. log 20 = 1.3, and 6.1 + 1.3 = 7.4.</p>
<h3>What this means at the bedside</h3>
<ul><li>pH is set by the <b>ratio</b> of the metabolic term (HCO₃⁻, kidney) to the respiratory term (PCO₂, lungs).</li>
<li>Compensation is the other organ moving its term in the <b>same direction</b> to restore the ratio. Low HCO₃⁻ → PCO₂ falls. High PCO₂ → HCO₃⁻ rises.</li>
<li>If the two move in opposite directions, compensation cannot explain it: there are two disorders.</li></ul>
<h3>The Henderson form, for checking a gas</h3>
<div class="eq">[H⁺] (nmol/L) = 24 × PCO₂ (mmHg) ÷ [HCO₃⁻]</div>
<p>Most analysers calculate HCO₃⁻ from pH and PCO₂, so a printed gas almost always "fits". If values were transcribed from different samples, or HCO₃⁻ came from a separate lab total CO₂, this equation exposes the mismatch. Compare the result with [H⁺] from the 80 rule.</p>`,
keys:[['Normal ratio','HCO₃⁻ : 0.03·PCO₂ = 20 : 1'],['CO₂ solubility','0.03 mmol/L/mmHg (0.23/kPa)'],['Henderson','[H⁺] = 24 × PCO₂ / HCO₃⁻']],
hook:'Kidneys on top, lungs on the bottom: pH is the fraction.',
q:[['PCO₂ 20 mmHg, HCO₃⁻ 12 mmol/L. What is the pH?',['7.10','7.40','7.25','7.55'],1,'12 ÷ (0.03 × 20) = 20, the normal ratio, so pH 7.40 (a heavily compensated metabolic acidosis, or a mixed disorder).'],
['A gas reads pH 7.40, PCO₂ 60, HCO₃⁻ 24. What do you conclude?',['Chronic respiratory acidosis','The values cannot all be from one sample','Mixed disorder','Normal'],1,'Henderson: 24 × 60 ÷ 24 = 60 nmol/L, i.e. pH ≈ 7.22, not 7.40. The numbers are internally inconsistent.']]});

lesson({id:'otherbuf',m:'chem',t:'The other buffers',
sum:'Haemoglobin, plasma proteins, phosphate, bone and intracellular buffers share the load. All buffer pairs move together.',
body:`<p>Every buffer in a compartment is in equilibrium with the same [H⁺] (the <b>isohydric principle</b>), so measuring one pair, bicarbonate/CO₂, tells you the state of all of them.</p>
${tw('<tr><th>Buffer</th><th>Where</th><th>Notes</th></tr><tr><td>Bicarbonate/CO₂</td><td>ECF</td><td>Largest; open system</td></tr><tr><td>Haemoglobin</td><td>Red cells</td><td>Histidine imidazole groups, pKa near 7; deoxy-Hb buffers better</td></tr><tr><td>Plasma proteins (albumin)</td><td>Plasma</td><td>Weak acids; low albumin removes buffer and lowers the anion gap</td></tr><tr><td>Phosphate</td><td>Cells, urine</td><td>pKa 6.8; titratable acid in urine</td></tr><tr><td>Ammonia/ammonium</td><td>Urine</td><td>Main route for excreting fixed acid</td></tr><tr><td>Bone carbonate</td><td>Skeleton</td><td>Chronic acidosis dissolves bone (CKD, RTA)</td></tr>')}
<h3>Intracellular buffering and potassium</h3>
<p>About half of an acute acid load is buffered inside cells. As H⁺ enters cells in exchange, potassium can leave, raising plasma K⁺. This is marked in mineral (hyperchloraemic) acidosis and much smaller in lactic or ketoacidosis, where the organic anion enters cells with H⁺. The old rule of "K⁺ rises 0.6 per 0.1 fall in pH" is unreliable; treat it as a direction, not a number.</p>`,
keys:[['Isohydric principle','All buffer pairs share one [H⁺]'],['Hb buffer group','Histidine imidazole'],['Phosphate pKa','6.8']],
hook:'One [H⁺] for all buffers: read one, know all.',
q:[['Why does deoxygenated blood carry more CO₂?',['It is colder','Deoxy-Hb is a better H⁺ buffer and forms more carbamino compounds','Venous blood has more carbonic anhydrase','Plasma bicarbonate is lower'],1,'This is the Haldane effect, a property of haemoglobin chemistry.'],
['Which acidosis raises plasma potassium most through shifts?',['Lactic acidosis','Ketoacidosis','Hyperchloraemic (mineral) acidosis','Respiratory acidosis'],2,'With an inorganic anion like chloride that stays outside cells, H⁺ entry is balanced by K⁺ exit.']]});

lesson({id:'stewart',m:'chem',t:'The Stewart (physicochemical) view',
sum:'pH is set by three independent variables: PCO₂, the strong ion difference and total weak acid (mostly albumin). HCO₃⁻ is a result, not a cause.',
body:`<p>Peter Stewart argued that HCO₃⁻ and H⁺ are dependent variables. Three things are independent:</p>
<ul><li><b>PCO₂</b>, set by ventilation.</li>
<li><b>Strong ion difference (SID)</b>: fully dissociated cations minus anions, roughly Na⁺ + K⁺ + Ca²⁺ + Mg²⁺ − Cl⁻ − lactate. Normal apparent SID is about 40 mmol/L. A lower SID means acidosis.</li>
<li><b>A<sub>tot</sub></b>: total weak acid, mostly albumin and phosphate. Less albumin means alkalosis.</li></ul>
<h3>Where it helps at the bedside</h3>
<ul><li><b>Saline acidosis:</b> 0.9% saline has an SID of zero (154 Na, 154 Cl). Large volumes lower plasma SID and cause hyperchloraemic acidosis. Balanced crystalloids have an SID closer to plasma.</li>
<li><b>Hypoalbuminaemia</b> in critical illness causes a hidden metabolic alkalosis and lowers the anion gap, which can mask a lactic acidosis. Correct the anion gap for albumin.</li>
<li><b>Na⁺ and Cl⁻ separately:</b> a falling Na:Cl ratio points to chloride-driven acidosis.</li></ul>
<p>The traditional (Boston) approach with albumin-corrected anion gap and base excess gives the same answers in almost every patient. Use it for speed; use Stewart to understand fluids and albumin.</p>`,
keys:[['Independent variables','PCO₂ · SID · A_tot'],['Normal apparent SID','≈ 40 mmol/L'],['SID of 0.9% saline','0']],
hook:'Chloride up or albumin down: Stewart explains what the bicarbonate alone hides.',
q:[['A patient receives 6 L of 0.9% saline. What is the most likely new acid–base problem?',['High AG metabolic acidosis','Hyperchloraemic (normal AG) metabolic acidosis','Metabolic alkalosis','Respiratory acidosis'],1,'Saline has an SID of zero; it dilutes plasma SID down, causing hyperchloraemic acidosis.'],
['Albumin falls from 40 to 20 g/L. In the Stewart model this causes…',['Metabolic acidosis','Metabolic alkalosis','Respiratory alkalosis','No change'],1,'Albumin is a weak acid; losing it is alkalinising, and it lowers the anion gap by about 5 mmol/L.']]});

/* ---------- PHYSICS ---------- */
lesson({id:'dalton',m:'phys',t:'Partial pressure and Dalton\'s law',
sum:'Each gas in a mixture exerts its share of the total pressure. Inspired PO₂ = FiO₂ × (barometric pressure − 47).',
body:`<p>Dalton's law: total pressure equals the sum of the partial pressures. Air is 20.9% oxygen, so at sea level (760 mmHg) dry air has a PO₂ of about 159 mmHg.</p>
<p>In the airways, inspired gas is fully humidified at 37 °C. Water vapour takes 47 mmHg (6.3 kPa) regardless of altitude, so:</p>
<div class="eq">PiO₂ = FiO₂ × (P<sub>atm</sub> − 47)</div>
<ul><li>Sea level: 0.21 × 713 ≈ <b>150 mmHg</b>.</li>
<li><b>Riyadh</b> (about 610 m): P<sub>atm</sub> ≈ 707 mmHg, so PiO₂ ≈ 139 mmHg. Normal PaO₂ in a healthy adult in Riyadh is several mmHg lower than textbook sea-level values.</li>
<li><b>Abha</b> (about 2,270 m): P<sub>atm</sub> ≈ 580 mmHg, PiO₂ ≈ 112 mmHg.</li>
<li>Aircraft cabin (pressurised to about 2,400 m): similar to Abha. Patients with borderline PaO₂ desaturate in flight.</li></ul>
<h3>Units</h3>
<p>1 kPa = 7.5 mmHg. Normal PaCO₂ 35–45 mmHg = 4.7–6.0 kPa. Normal PaO₂ 80–100 mmHg = 10.7–13.3 kPa.</p>`,
keys:[['Water vapour at 37 °C','47 mmHg (6.3 kPa)'],['PiO₂ sea level','≈ 150 mmHg'],['PiO₂ Riyadh','≈ 139 mmHg'],['1 kPa','7.5 mmHg']],
hook:'Subtract the water first, then take the oxygen share.',
q:[['What is the inspired PO₂ on 40% oxygen at sea level?',['304 mmHg','285 mmHg','150 mmHg','400 mmHg'],1,'0.40 × (760 − 47) = 285 mmHg.'],
['Why does PiO₂ fall at altitude when FiO₂ is still 0.21?',['Oxygen fraction falls','Barometric pressure falls','Water vapour pressure rises','CO₂ rises'],1,'The fraction is constant; total pressure drops, so each partial pressure drops.']]});

lesson({id:'henry',m:'phys',t:'Solubility and Henry\'s law',
sum:'Dissolved gas is proportional to partial pressure. Oxygen is poorly soluble, so almost all of it rides on haemoglobin. CO₂ is about 20 times more soluble.',
body:`<p>Henry's law: the amount of gas dissolved in a liquid is proportional to its partial pressure above it. The constant depends on the gas.</p>
${tw('<tr><th>Gas</th><th>Dissolved per mmHg</th><th>At normal arterial pressure</th></tr><tr><td>O₂</td><td>0.003 mL/dL</td><td>PaO₂ 100 → 0.3 mL/dL (of about 20 mL/dL total)</td></tr><tr><td>CO₂</td><td>0.03 mmol/L (≈ 0.07 mL/dL)</td><td>PaCO₂ 40 → 1.2 mmol/L dissolved</td></tr>')}
<h3>Why it matters</h3>
<ul><li><b>PaO₂ is not oxygen content.</b> PaO₂ measures only the dissolved fraction, which sets how much haemoglobin loads, but anaemia or carbon monoxide can halve content with a normal PaO₂.</li>
<li><b>CO₂ diffuses easily</b> because of its high solubility, so diffusion problems cause hypoxaemia long before they cause hypercapnia.</li>
<li><b>Hyperbaric oxygen</b> works by Henry's law: at 3 atmospheres on 100% O₂, dissolved O₂ (about 6 mL/dL) can meet resting needs without haemoglobin.</li></ul>`,
keys:[['O₂ solubility','0.003 mL/dL/mmHg'],['CO₂ vs O₂ solubility','≈ 20×'],['Dissolved O₂ at PaO₂ 100','0.3 mL/dL']],
hook:'PaO₂ is the pressure driving the loading; content is what the truck carries.',
q:[['Why does a diffusion barrier cause hypoxaemia without hypercapnia?',['CO₂ is produced in smaller amounts','CO₂ is far more soluble and diffuses about 20 times faster','CO₂ is carried by haemoglobin','Hypoxaemia drives ventilation which raises CO₂'],1,'High solubility makes CO₂ transfer robust; and the hypoxic drive often lowers CO₂.'],
['A patient has PaO₂ 98 mmHg and Hb 6 g/dL. Their oxygen content is…',['Normal, because PaO₂ is normal','About half of normal','Raised','Unknown without PaCO₂'],1,'Content depends mainly on haemoglobin: 1.34 × 6 × 0.98 ≈ 7.9 + 0.3 ≈ 8.2 mL/dL, versus ≈ 20 normally.']]});

lesson({id:'alv',m:'phys',t:'Diffusion and the alveolar gas equation',w:['alv'],
sum:'PAO₂ = FiO₂ × (P_atm − 47) − PaCO₂ / 0.8. The gap between alveolar and arterial O₂ (A–a gradient) tells you whether the lung itself is at fault.',
body:`<p>Gas crosses the alveolar membrane by diffusion (Fick's law): rate ∝ area × pressure difference × solubility ÷ thickness. Normally blood equilibrates within the first third of its 0.75-second capillary transit, which leaves reserve for exercise.</p>
<h3>Alveolar gas equation</h3>
<div class="eq">PAO₂ = FiO₂ × (P<sub>atm</sub> − 47) − PaCO₂ ÷ RQ</div>
<p>RQ (respiratory quotient) is about 0.8. Each mmHg of CO₂ in the alveolus displaces oxygen, so a rise in PaCO₂ must lower PAO₂: this is how hypoventilation causes hypoxaemia.</p>
<p>Room air at sea level, PaCO₂ 40: PAO₂ = 150 − 50 = <b>100 mmHg</b>.</p>
<h3>A–a gradient</h3>
<p>A–a = PAO₂ − PaO₂. Normal on room air ≈ <b>age/4 + 4</b> mmHg (under 10 in the young, up to about 20 in the elderly). It widens on higher FiO₂, so interpret it on room air where possible.</p>
<ul><li><b>Normal A–a + hypoxaemia</b> → hypoventilation or low inspired O₂ (the lung is fine).</li>
<li><b>Raised A–a</b> → V/Q mismatch, shunt or diffusion limitation (the lung is the problem).</li></ul>`,
keys:[['PAO₂','FiO₂(P_atm − 47) − PaCO₂/0.8'],['Normal A–a (room air)','≈ age/4 + 4 mmHg'],['RQ','0.8']],
hook:'Hypoxic with a normal A–a? Look at the brain, the muscles or the altitude, not the lungs.',
q:[['Room air, sea level. PaCO₂ 80, PaO₂ 48, age 30. What is the A–a gradient and what does it mean?',['52; lung disease','2; pure hypoventilation','12; mild V/Q mismatch','Cannot be calculated'],1,'PAO₂ = 150 − 80/0.8 = 50. A–a = 50 − 48 = 2. Hypoxaemia is fully explained by hypoventilation (e.g. opioid overdose).'],
['A 60-year-old on room air: PaCO₂ 30, PaO₂ 60. A–a?',['≈ 52, raised','≈ 22, normal','≈ 90','≈ 0'],0,'PAO₂ = 150 − 37.5 = 112.5. A–a = 52, well above the expected ≈ 19. Think PE, pneumonia, edema.']]});

lesson({id:'temp',m:'phys',t:'Temperature and the analyser',
sum:'Analysers measure at 37 °C. In fever or hypothermia the patient\'s true gases differ; most clinicians interpret the 37 °C values (alpha-stat).',
body:`<p>Gas solubility rises as blood cools, so at lower temperature the same blood has lower PO₂ and PCO₂, and a higher pH. The analyser warms the sample to 37 °C and reports values at that temperature unless you enter the patient's temperature.</p>
<ul><li>Per °C, PO₂ changes about 5–7%, PCO₂ about 4.5%, and pH about 0.015 (in the opposite direction).</li>
<li><b>Alpha-stat</b>: interpret values uncorrected, at 37 °C. This keeps intracellular protein charge (the "alpha" of histidine) constant and is the usual approach in adults, including after cardiac arrest and in hypothermia.</li>
<li><b>pH-stat</b>: correct to the patient's temperature and aim for normal corrected values, which means adding CO₂ during hypothermia. Used in some paediatric cardiac surgery.</li></ul>
<h3>Practical points</h3>
<ul><li>In <b>hypothermia</b>, the uncorrected PaO₂ overestimates the patient's true PaO₂. Do not be falsely reassured in a cold patient on low oxygen.</li>
<li>In <b>heat stroke</b> at 41–42 °C, the true PaO₂ and PaCO₂ are higher than printed. Interpret the 37 °C values and treat the patient; cooling comes first.</li></ul>`,
keys:[['Analyser temperature','37 °C'],['Usual interpretation','Alpha-stat (uncorrected)'],['pH change per °C','≈ 0.015']],
hook:'Cold blood holds more gas: pressures fall and pH rises as the patient cools.',
q:[['A hypothermic patient at 32 °C. Compared with the analyser\'s 37 °C report, the true in-body PaCO₂ is…',['Higher','Lower','The same','Unpredictable'],1,'Cold blood dissolves more CO₂, so its partial pressure is lower.'],
['Which strategy do most adult intensive care units use for blood gas interpretation?',['pH-stat','Alpha-stat','Temperature-corrected for all values','Whichever value is more normal'],1,'Alpha-stat: interpret the analyser\'s 37 °C values.']]});

/* ---------- MICRO ---------- */
lesson({id:'acidsrc',m:'micro',t:'Where the acid comes from',
sum:'Metabolism makes about 15,000 mmol of CO₂ a day (volatile acid, removed by the lungs) and about 1 mmol/kg of fixed acid (removed by the kidneys).',
body:`<p>Every cell's mitochondria burn fuel through the citric acid cycle and release CO₂. Dissolved in water, that CO₂ is an acid. Because it leaves through the lungs, it is called <b>volatile acid</b>: roughly 15,000 mmol per day, which ventilation clears minute by minute.</p>
<p><b>Fixed (non-volatile) acid</b> cannot be breathed out:</p>
<ul><li>Sulfuric acid from sulfur-containing amino acids (methionine, cysteine) in dietary protein.</li>
<li>Phosphoric acid from phospholipids and phosphoproteins.</li>
<li>Incompletely oxidised organic acids: small amounts of lactate and ketoacids even in health.</li></ul>
<p>Adults produce about <b>50–100 mmol of fixed acid per day</b>. Each mmol consumes one HCO₃⁻, which the kidneys must regenerate. That is the whole job of renal acid excretion.</p>
<h3>The two clocks</h3>
<p>Lungs adjust volatile acid in <b>minutes</b>. Kidneys adjust fixed acid over <b>3–5 days</b>. This difference is the basis for "acute" and "chronic" respiratory disorders.</p>`,
keys:[['Volatile acid (CO₂)','≈ 15,000 mmol/day'],['Fixed acid','≈ 1 mmol/kg/day'],['Lung response','minutes'],['Kidney response','3–5 days']],
hook:'Lungs breathe off the big daily acid load; kidneys handle the small one that matters for days.',
q:[['Which acid source does the kidney, not the lung, have to excrete?',['CO₂ from the citric acid cycle','Sulfuric acid from methionine','Carbonic acid','Dissolved CO₂ in venous blood'],1,'Sulfuric and phosphoric acids are fixed; each consumes bicarbonate that the kidney must regenerate.'],
['Why does renal compensation take days?',['Kidneys only filter at night','Generating new bicarbonate needs increased ammoniagenesis, which takes days to ramp up','Kidneys respond only to aldosterone','It does not; it takes minutes'],1,'Upregulation of glutamine metabolism and transporters takes about 3–5 days to peak.']]});

lesson({id:'lactate',m:'micro',t:'Lactate: the cellular story',
sum:'Pyruvate becomes lactate when it is made faster than mitochondria can use it. Lactate is a marker of stress and hypoperfusion, not always of oxygen lack.',
body:`<p>Glycolysis turns glucose into pyruvate and NADH. Normally pyruvate enters mitochondria. When mitochondria cannot keep up, LDH converts pyruvate to lactate to regenerate NAD⁺ so glycolysis can continue. The H⁺ comes mainly from ATP hydrolysis in the same circumstances, so lactate rises together with acidosis.</p>
<p>The liver (and kidney) clear lactate, about 1,500 mmol/day, mostly back to glucose (the Cori cycle). Liver failure slows clearance.</p>
<h3>Types</h3>
${tw('<tr><th>Type</th><th>Mechanism</th><th>Examples</th></tr><tr><td>A</td><td>Tissue hypoperfusion or hypoxia</td><td>Shock (septic, cardiogenic, haemorrhagic), cardiac arrest, severe hypoxaemia, CO, cyanide, mesenteric ischaemia, seizures</td></tr><tr><td>B1</td><td>Underlying disease</td><td>Liver failure, malignancy (Warburg effect), thiamine deficiency, DKA</td></tr><tr><td>B2</td><td>Drugs and toxins</td><td>Metformin, salbutamol and adrenaline (β₂), linezolid, propofol, toxic alcohols, cyanide, NRTIs</td></tr><tr><td>B3</td><td>Inborn errors</td><td>Mitochondrial disorders</td></tr>')}
<h3>Sepsis</h3>
<p>Much of the lactate in sepsis comes from adrenaline-driven aerobic glycolysis in muscle (β₂ stimulation), not only from hypoxia. Lactate still tracks risk: in septic shock definitions it is above 2 mmol/L despite fluids, with vasopressors needed. A falling lactate with treatment is reassuring.</p>
<p>D-lactate (bacterial) is not measured by the standard L-lactate assay. See the next lesson.</p>`,
keys:[['Normal lactate','< 2 mmol/L'],['High','> 4 mmol/L'],['Daily clearance','≈ 1,500 mmol (liver, kidney)']],
hook:'Lactate means "glycolysis is outrunning the mitochondria", for whatever reason.',
q:[['A patient with acute asthma on nebulised salbutamol has lactate 5.1 mmol/L and good perfusion. Most likely cause?',['Type A hypoperfusion','β₂-agonist (type B2) lactate','D-lactic acidosis','Lab error'],1,'β₂ stimulation drives aerobic glycolysis. Still look for hypoperfusion, but salbutamol is a common cause.'],
['Which lactate type is metformin toxicity?',['A','B1','B2','B3'],2,'Drug-induced, type B2. It is most likely when renal failure or another stressor coexists.']]});

lesson({id:'ketones',m:'micro',t:'Ketones and ketoacidosis',
sum:'Without insulin, fat becomes acetoacetate and β-hydroxybutyrate. Measure β-hydroxybutyrate in blood; urine strips miss it.',
body:`<p>Low insulin with high glucagon releases fatty acids from fat. The liver's mitochondria oxidise them to acetyl-CoA, which piles up as <b>acetoacetate</b> and <b>β-hydroxybutyrate (BHB)</b>, both strong enough acids to dissociate fully at body pH. Acetone, a breakdown product of acetoacetate, gives the fruity breath.</p>
<ul><li>In DKA, BHB:acetoacetate rises to about 3–10:1 because of the high NADH state.</li>
<li>Urine nitroprusside strips detect acetoacetate, not BHB. They can read falsely low early, and may seem to worsen during treatment as BHB converts back to acetoacetate. Use blood BHB.</li></ul>
<h3>Three ketoacidoses</h3>
<ul><li><b>Diabetic</b>: insulin deficiency; glucose usually high.</li>
<li><b>Euglycaemic DKA</b>: SGLT2 inhibitors, pregnancy, starvation or low-carbohydrate diets; glucose may be under 14 mmol/L (250 mg/dL). Check ketones in any unwell patient on an SGLT2 inhibitor.</li>
<li><b>Alcoholic</b>: binge drinking then vomiting and not eating; glucose low or normal; often mixed with metabolic alkalosis from vomiting.</li>
<li><b>Starvation</b>: mild, HCO₃⁻ rarely below 18.</li></ul>
<p>Ketoanions are filtered and lost in urine with sodium, so the anion gap can fall before the bicarbonate recovers, leaving a hyperchloraemic acidosis (more in the clinical module).</p>`,
keys:[['Blood BHB in DKA','≥ 3.0 mmol/L'],['Ketosis resolved','BHB < 0.6 mmol/L'],['Urine strip detects','Acetoacetate only']],
hook:'Strips smell acetoacetate; the patient is drowning in β-hydroxybutyrate.',
q:[['A patient on empagliflozin has vomiting, glucose 11 mmol/L, pH 7.18, HCO₃⁻ 9. Most likely?',['Lactic acidosis from dehydration','Euglycaemic DKA','Alcoholic ketoacidosis','Normal anion gap acidosis'],1,'SGLT2 inhibitors cause DKA with only modestly raised glucose. Check blood ketones.'],
['Why can urine ketones appear to rise during successful DKA treatment?',['Treatment is failing','BHB is converted to acetoacetate, which the strip detects','Insulin produces ketones','Renal function worsens'],1,'The strip only sees acetoacetate. Follow blood BHB and the gas instead.']]});

lesson({id:'microbes',m:'micro',t:'Microbes, the gut and the syringe',
sum:'Bacteria cause acid–base problems through sepsis, gut fermentation (D-lactate), diarrhoea, and even by living cells in a delayed sample.',
body:`<h3>Sepsis</h3>
<p>Early sepsis drives ventilation (cytokines, fever, endotoxin acting on the respiratory centre), so <b>respiratory alkalosis</b> is often the first gas sign. Later, hypoperfusion and adrenaline-driven glycolysis add a <b>lactic acidosis</b>. A low PaCO₂ with a falling bicarbonate in a febrile patient is sepsis until proven otherwise.</p>
<h3>D-lactic acidosis</h3>
<p>In <b>short bowel syndrome</b> or after jejunoileal bypass, unabsorbed carbohydrate reaches the colon, where bacteria such as <i>Lactobacillus</i> ferment it to D-lactate. Humans metabolise D-lactate slowly. Patients have episodes of confusion, slurred speech and ataxia after carbohydrate meals, with a <b>high anion gap acidosis and a normal routine lactate</b>, because the standard assay measures L-lactate only. Ask the lab for D-lactate. Treatment: reduce simple carbohydrate, give oral antibiotics, correct the acidosis.</p>
<h3>Infectious diarrhoea</h3>
<p>Stool is rich in bicarbonate. Cholera, rotavirus and other secretory diarrhoeas cause a <b>normal anion gap acidosis</b>; with severe dehydration, lactic acidosis and pre-renal AKI add a high anion gap component.</p>
<h3>Urease and urinary diversion</h3>
<p>Urease-producing organisms (<i>Proteus</i>, <i>Klebsiella</i>) split urea into ammonia: they alkalinise urine and cause struvite stones, and in patients with liver failure or urinary diversions they can raise blood ammonia. Ureterosigmoidostomy itself causes a NAGMA through chloride–bicarbonate exchange by colonic mucosa.</p>
<h3>Living cells in the syringe</h3>
<p>White cells and platelets keep consuming oxygen after the sample is drawn. With very high counts (leukaemia, WBC above about 100 × 10⁹/L, or extreme thrombocytosis) PaO₂ falls in minutes while SpO₂ stays normal: <b>pseudohypoxaemia</b> or "leukocyte larceny". Analyse immediately, on ice if needed, and trust the oximeter.</p>`,
keys:[['Early sepsis gas','Respiratory alkalosis'],['D-lactate','Missed by routine lactate assay'],['Leukocyte larceny','WBC > ~100 × 10⁹/L']],
hook:'Normal lactate, high gap, short bowel and confusion: think bacteria making D-lactate.',
q:[['A man with short bowel syndrome is confused after a sugary drink. pH 7.26, AG 24, routine lactate 1.1. Next test?',['Repeat routine lactate','D-lactate','Serum osmolality only','CT head first'],1,'Standard assays measure L-lactate. D-lactate from colonic bacterial fermentation explains the unexplained anion gap.'],
['A patient with CML (WBC 280) has PaO₂ 48 but SpO₂ 98% and looks well. Explanation?',['Venous sample','Leukocyte larceny','Methaemoglobinaemia','Shunt'],1,'White cells consume oxygen in the syringe. Analyse at once on ice and rely on pulse oximetry.']]});

lesson({id:'rbc',m:'micro',t:'Inside the red cell: Bohr, Haldane and the chloride shift',w:['rbc','odc'],
sum:'In tissues, CO₂ enters the red cell, becomes HCO₃⁻, swaps with Cl⁻, and its H⁺ helps unload O₂. In the lung, everything reverses.',
body:`<h3>In the tissues</h3>
<ol class="steps"><li>CO₂ diffuses into the red cell.</li>
<li>Carbonic anhydrase converts it to H⁺ and HCO₃⁻.</li>
<li>HCO₃⁻ leaves through band 3 in exchange for Cl⁻: the <b>chloride (Hamburger) shift</b>. This is why venous red cells contain more chloride and are slightly larger.</li>
<li>H⁺ binds haemoglobin, which lowers its oxygen affinity and releases O₂: the <b>Bohr effect</b>.</li>
<li>Some CO₂ binds directly to haemoglobin's amino groups as <b>carbamino-Hb</b>.</li></ol>
<h3>In the lung</h3>
<p>Oxygen binds haemoglobin, which releases H⁺ and carbamino CO₂: the <b>Haldane effect</b>. H⁺ recombines with HCO₃⁻ (re-entering in exchange for Cl⁻) to form CO₂, which is exhaled.</p>
<h3>CO₂ carriage</h3>
${tw('<tr><th>Form</th><th>Share of CO₂ in arterial blood</th></tr><tr><td>Bicarbonate</td><td>≈ 90%</td></tr><tr><td>Carbamino compounds</td><td>≈ 5%</td></tr><tr><td>Dissolved</td><td>≈ 5%</td></tr>')}
<p>Of the CO₂ actually exchanged between arterial and venous blood, carbamino and dissolved CO₂ contribute more than their share (about 30% and 10%).</p>
<h3>2,3-BPG</h3>
<p>Red cells make 2,3-bisphosphoglycerate through a glycolytic side path (Rapoport–Luebering shunt). It binds deoxy-Hb and shifts the curve right. It rises with chronic hypoxia, anaemia and altitude, and falls in stored blood.</p>`,
keys:[['Bohr effect','H⁺/CO₂ ↓ O₂ affinity'],['Haldane effect','O₂ ↓ CO₂ carriage'],['Chloride shift','HCO₃⁻ out, Cl⁻ in (band 3)']],
hook:'Bohr: acid kicks oxygen off. Haldane: oxygen kicks CO₂ off.',
q:[['Which effect explains part of the rise in PaCO₂ when a COPD patient is given high-flow oxygen?',['Bohr effect','Haldane effect','Chloride shift','Hamburger effect'],1,'Oxygen binding releases CO₂ from haemoglobin. Worsened V/Q matching (loss of hypoxic vasoconstriction) contributes more.'],
['Massively transfused blood (low 2,3-BPG) shifts the dissociation curve…',['Right, releasing O₂ more easily','Left, holding O₂ more tightly','Not at all','Downward'],1,'Low 2,3-BPG raises affinity: oxygen loads but unloads poorly in tissues.']]});

lesson({id:'toxalc',m:'micro',t:'Enzymes and poisons: toxic alcohols and 5-oxoproline',
sum:'Alcohol dehydrogenase turns methanol and ethylene glycol into toxic acids. Early there is an osmolar gap; later an anion gap.',
body:`<p>Methanol and ethylene glycol are themselves fairly harmless osmoles. The damage comes after <b>alcohol dehydrogenase (ADH)</b> and aldehyde dehydrogenase metabolise them:</p>
${tw('<tr><th>Parent</th><th>Toxic metabolites</th><th>Target</th></tr><tr><td>Methanol</td><td>Formaldehyde → <b>formic acid</b></td><td>Retina and optic nerve (blindness), basal ganglia</td></tr><tr><td>Ethylene glycol</td><td>Glycolaldehyde → <b>glycolic acid</b> → oxalic acid</td><td>Kidneys (calcium oxalate crystals), hypocalcaemia, CNS</td></tr><tr><td>Isopropanol</td><td>Acetone (not an acid)</td><td>CNS depression; ketosis <i>without</i> acidosis</td></tr>')}
<h3>The gaps over time</h3>
<ul><li><b>Early</b>: high osmolar gap, normal anion gap (parent alcohol present, not yet metabolised).</li>
<li><b>Late</b>: osmolar gap falls while the anion gap rises (acid metabolites). A normal osmolar gap does not exclude a late presentation.</li></ul>
<p><b>Fomepizole</b> (or ethanol) blocks ADH. Haemodialysis removes both the alcohol and its acids.</p>
<h3>Lactate gap</h3>
<p>Some blood gas analysers read glycolate as lactate. A high lactate on the gas but a normal laboratory lactate (a "lactate gap") points to ethylene glycol.</p>
<h3>5-oxoproline (pyroglutamic acid)</h3>
<p>Chronic paracetamol use depletes glutathione, especially in malnourished patients, women, sepsis and renal failure, or with flucloxacillin. 5-oxoproline accumulates and causes an unexplained high anion gap acidosis. It is the "O" in GOLDMARK.</p>`,
keys:[['Blocks ADH','Fomepizole, ethanol'],['Osmolar gap normal','< 10 mOsm/kg'],['Methanol target','Optic nerve'],['Ethylene glycol target','Kidney (oxalate)']],
hook:'Osmolar gap first, anion gap later: the alcohol turns into acid.',
q:[['Ethanol-free patient, osmolar gap 32, anion gap 13, presented 1 hour after ingestion. Likely?',['Late ethylene glycol','Early toxic alcohol ingestion','DKA','Lactic acidosis'],1,'The parent alcohol raises osmolality before it is metabolised to acids.'],
['Isopropanol poisoning typically causes…',['Severe HAGMA','Ketosis without acidosis and an osmolar gap','Oxalate crystals','Blindness'],1,'It is metabolised to acetone, which is not an acid.']]});

/* ---------- OXYGEN / CO2 / LUNGS ---------- */
lesson({id:'o2content',m:'gas',t:'Oxygen content and delivery',w:['o2c'],
sum:'CaO₂ = 1.34 × Hb × SaO₂ + 0.003 × PaO₂. Delivery = cardiac output × content. Haemoglobin and saturation matter far more than PaO₂.',
body:`<div class="eq">CaO₂ (mL/dL) = 1.34 × Hb (g/dL) × SaO₂ + 0.003 × PaO₂ (mmHg)</div>
<p>Normal: 1.34 × 15 × 0.98 + 0.3 ≈ <b>20 mL O₂ per dL</b>.</p>
<div class="eq">DO₂ (mL/min) = cardiac output (L/min) × CaO₂ × 10</div>
<p>Normal: 5 × 20 × 10 ≈ <b>1,000 mL/min</b>. Resting consumption (VO₂) is about 250 mL/min, so tissues extract about 25% and mixed venous saturation is about 75%.</p>
<h3>Which lever matters?</h3>
<ul><li>Raising PaO₂ from 60 to 100 mmHg adds about 2 mL/dL (saturation 90% → 98%).</li>
<li>Raising Hb from 7 to 10 g/dL adds about 4 mL/dL.</li>
<li>Doubling cardiac output doubles delivery.</li></ul>
<p>When delivery falls, extraction rises and venous saturation drops. A central venous saturation (ScvO₂) below 70% in shock means delivery is not meeting demand. A <i>high</i> venous saturation with a high lactate suggests cells cannot use oxygen: cyanide, late sepsis, or shunting.</p>`,
keys:[['Normal CaO₂','≈ 20 mL/dL'],['Normal DO₂','≈ 1,000 mL/min'],['Normal ScvO₂','> 70%']],
hook:'Content is mostly haemoglobin times saturation; delivery is that times the pump.',
q:[['Which change raises oxygen delivery most in a patient with Hb 7, SaO₂ 92%, CO 4 L/min?',['Raise PaO₂ from 65 to 100','Transfuse to Hb 10','Raise SaO₂ to 98%','None; all are equal'],1,'Hb 7 → 10 raises content from ≈ 8.8 to ≈ 12.6 mL/dL; raising saturation adds only ≈ 0.6.'],
['Smoke inhalation victim: lactate 11, ScvO₂ 88%. Most likely?',['Hypovolaemia','Cyanide poisoning','Anaemia','Hypoventilation'],1,'Cells cannot extract oxygen, so venous blood stays saturated while lactate soars.']]});

lesson({id:'odc',m:'gas',t:'The oxyhaemoglobin dissociation curve',w:['odc'],
sum:'Sigmoid because haemoglobin binds cooperatively. Remember 27 → 50%, 40 → 75%, 60 → 90%. Shifts change unloading, not just loading.',
body:`<p>Binding one O₂ makes the next easier (cooperativity), giving the S shape. The flat top protects loading: PaO₂ can fall from 100 to 60 mmHg with saturation still 90%. The steep middle aids unloading: small falls in tissue PO₂ release a lot of oxygen.</p>
${tw('<tr><th>PO₂ (mmHg)</th><th>kPa</th><th>Saturation</th><th>Meaning</th></tr><tr><td>27</td><td>3.6</td><td>50%</td><td>P50</td></tr><tr><td>40</td><td>5.3</td><td>75%</td><td>Mixed venous</td></tr><tr><td>60</td><td>8.0</td><td>90%</td><td>Edge of the cliff</td></tr><tr><td>100</td><td>13.3</td><td>97–98%</td><td>Arterial</td></tr>')}
<h3>Shifts</h3>
<ul><li><b>Right</b> (lower affinity, easier unloading): ↑ H⁺, ↑ CO₂, ↑ temperature, ↑ 2,3-BPG, exercise. Mnemonic "CADET face Right": CO₂, Acid, 2,3-DPG, Exercise, Temperature.</li>
<li><b>Left</b> (higher affinity, poorer unloading): alkalosis, hypothermia, low 2,3-BPG, <b>carbon monoxide</b>, <b>methaemoglobin</b>, fetal haemoglobin.</li></ul>
<p>Rapidly correcting an acidosis with bicarbonate shifts the curve left before 2,3-BPG readjusts, which can worsen tissue oxygen release.</p>
<p>The <b>90/60 rule</b> is why SpO₂ targets sit at 92–96% for most patients (88–92% in hypercapnic COPD): below 90% you are on the steep part, where small changes in PaO₂ cause big drops in saturation.</p>`,
keys:[['P50','≈ 27 mmHg (3.6 kPa)'],['60 mmHg','≈ 90% saturation'],['40 mmHg','≈ 75% saturation']],
hook:'"40-50-60 → 75-?-90", and P50 is 27. Right shift releases; left shift hoards.',
q:[['Which shifts the curve to the left?',['Fever','Carbon monoxide','Acidosis','High 2,3-BPG'],1,'CO increases the affinity of the remaining haem sites, so oxygen unloads poorly.'],
['SpO₂ 90% corresponds to a PaO₂ of roughly…',['40 mmHg','60 mmHg','80 mmHg','100 mmHg'],1,'The 90/60 point on a normal curve.']]});

lesson({id:'hypox',m:'gas',t:'The five causes of hypoxaemia',
sum:'Low inspired O₂, hypoventilation, diffusion limitation, V/Q mismatch, shunt. The A–a gradient and the response to oxygen separate them.',
body:`${tw('<tr><th>Mechanism</th><th>A–a gradient</th><th>Better on O₂?</th><th>Examples</th></tr><tr><td>Low PiO₂</td><td>Normal</td><td>Yes</td><td>Altitude, aircraft, fire in enclosed space</td></tr><tr><td>Hypoventilation</td><td>Normal</td><td>Yes (but CO₂ stays high)</td><td>Opioids, sedation, neuromuscular disease, obesity hypoventilation</td></tr><tr><td>Diffusion limitation</td><td>Raised</td><td>Yes</td><td>Interstitial lung disease, especially on exercise</td></tr><tr><td>V/Q mismatch</td><td>Raised</td><td>Yes</td><td>COPD, asthma, pneumonia, PE (the commonest cause)</td></tr><tr><td>Shunt</td><td>Raised</td><td><b>Poorly</b></td><td>ARDS, lobar collapse, consolidation, intracardiac or pulmonary AV shunts</td></tr>')}
<h3>Reading it</h3>
<ol class="steps"><li>Calculate the A–a gradient. Normal → hypoventilation or low PiO₂. Check the PaCO₂.</li>
<li>Raised → lung problem. Does PaO₂ rise properly with oxygen?</li>
<li>Minimal rise on high FiO₂ → significant shunt (above about 30% shunt fraction, extra oxygen barely helps). Think consolidation, collapse, ARDS, and recruit with PEEP.</li></ol>
<p>Dead space (ventilated but not perfused, e.g. PE) mostly raises the PaCO₂ for a given ventilation; patients compensate by breathing more, so PaCO₂ is often low.</p>`,
keys:[['Normal A–a causes','Low PiO₂, hypoventilation'],['O₂-refractory','Shunt'],['Commonest','V/Q mismatch']],
hook:'Normal gradient: the lung is innocent. Refractory to oxygen: think shunt.',
q:[['PaO₂ 55 on FiO₂ 0.21, then 62 on FiO₂ 1.0. Mechanism?',['V/Q mismatch','Shunt','Hypoventilation','Diffusion limitation'],1,'Almost no response to 100% O₂ is the hallmark of large shunt.'],
['Which causes hypoxaemia with a normal A–a gradient?',['Pneumonia','Opioid overdose','Pulmonary embolism','ARDS'],1,'Pure hypoventilation lowers PAO₂ through raised PaCO₂; the lung itself transfers normally.']]});

lesson({id:'ratios',m:'gas',t:'P/F ratio and other oxygenation indices',
sum:'P/F = PaO₂ ÷ FiO₂. Normal above 400 (mmHg). ARDS: ≤ 300 mild, ≤ 200 moderate, ≤ 100 severe.',
body:`<p>The PaO₂/FiO₂ ratio lets you compare oxygenation across different oxygen levels. Use FiO₂ as a fraction (0.21 → 0.21).</p>
<ul><li>Room air, PaO₂ 95 → P/F = 452.</li>
<li>On FiO₂ 0.5, PaO₂ 75 → P/F = 150: severely impaired despite a "normal-looking" PaO₂.</li></ul>
${tw('<tr><th>P/F (mmHg)</th><th>kPa</th><th>ARDS severity (Berlin 2012)</th></tr><tr><td>201–300</td><td>26.7–40</td><td>Mild</td></tr><tr><td>101–200</td><td>13.3–26.7</td><td>Moderate</td></tr><tr><td>≤ 100</td><td>≤ 13.3</td><td>Severe</td></tr>')}
<p>Berlin requires PEEP or CPAP of at least 5 cmH₂O. The 2023 global definition also accepts an <b>SpO₂/FiO₂ ratio ≤ 315</b> (with SpO₂ ≤ 97%) when no arterial gas is available, and includes patients on high-flow nasal oxygen.</p>
<h3>Other indices</h3>
<ul><li><b>Oxygenation index</b> = FiO₂ × mean airway pressure × 100 ÷ PaO₂. Accounts for ventilator support; used in children and ECMO decisions.</li>
<li><b>Expected PaO₂</b> on supplemental oxygen: roughly FiO₂ (%) × 5. On 40%, a PaO₂ near 200 is expected in healthy lungs.</li>
<li>Nasal cannula FiO₂ is approximate: about 0.21 + 0.03–0.04 per L/min.</li></ul>`,
keys:[['Normal P/F','> 400'],['ARDS mild/mod/severe','≤ 300 / 200 / 100'],['S/F ARDS threshold','≤ 315']],
hook:'Divide PaO₂ by FiO₂: 300, 200, 100 marks the ladder down.',
q:[['FiO₂ 0.6, PaO₂ 90, PEEP 10, bilateral infiltrates not cardiac. ARDS severity?',['Mild','Moderate','Severe','Not ARDS'],1,'90 ÷ 0.6 = 150: moderate.'],
['On 40% oxygen, roughly what PaO₂ would healthy lungs give?',['80','120','200','400'],2,'Rough rule: FiO₂% × 5 = 200 mmHg.']]});

lesson({id:'co2vent',m:'gas',t:'CO₂: ventilation\'s thermostat',
sum:'PaCO₂ ∝ CO₂ production ÷ alveolar ventilation. Halve ventilation, double PaCO₂. PaCO₂ is the best single measure of ventilation.',
body:`<div class="eq">PaCO₂ = 0.863 × VCO₂ ÷ V<sub>A</sub></div>
<p>Alveolar ventilation (V<sub>A</sub>) is minute ventilation minus dead space ventilation. A patient breathing fast and shallow can have a high minute ventilation and still retain CO₂ because most of each breath only fills dead space.</p>
<h3>Causes of hypercapnia</h3>
<ul><li><b>Won't breathe</b>: drive failure (opioids, sedatives, brainstem lesions, obesity hypoventilation, metabolic alkalosis).</li>
<li><b>Can't breathe</b>: neuromuscular (Guillain–Barré, myasthenia, high spinal injury), chest wall (kyphoscoliosis, flail chest), fatigue.</li>
<li><b>Can't get it out</b>: airway obstruction (COPD, asthma, upper airway), high dead space.</li>
<li><b>Making too much</b>: rarely alone; fever, sepsis, overfeeding with carbohydrate, malignant hyperthermia, bicarbonate infusion in a patient who cannot raise ventilation.</li></ul>
<h3>Oxygen and the CO₂ retainer</h3>
<p>High-flow oxygen raises PaCO₂ in some patients with chronic hypercapnia. The main reasons are loss of hypoxic pulmonary vasoconstriction (worse V/Q matching) and the Haldane effect; reduced hypoxic drive plays a smaller part. Target SpO₂ 88–92% in those at risk and recheck a gas.</p>`,
keys:[['PaCO₂ ∝','VCO₂ / alveolar ventilation'],['Normal PaCO₂','35–45 mmHg (4.7–6.0 kPa)'],['At-risk SpO₂ target','88–92%']],
hook:'Won\'t breathe, can\'t breathe, can\'t get it out.',
q:[['A patient\'s alveolar ventilation halves with no change in CO₂ production. PaCO₂ 40 becomes…',['50','60','80','Unchanged'],2,'PaCO₂ is inversely proportional to alveolar ventilation.'],
['The main reason PaCO₂ rises when hypercapnic COPD patients get high-flow O₂ is…',['Loss of hypoxic drive only','Worsened V/Q matching and the Haldane effect','Oxygen toxicity','Increased CO₂ production'],1,'Releasing hypoxic vasoconstriction perfuses poorly ventilated units; oxygenated Hb also releases CO₂.']]});

lesson({id:'respfail',m:'gas',t:'Type 1 and type 2 respiratory failure',
sum:'Type 1: PaO₂ < 60 mmHg (8 kPa) with normal or low PaCO₂. Type 2: PaCO₂ > 45 mmHg (6 kPa). pH and HCO₃⁻ tell acute from chronic.',
body:`${tw('<tr><th></th><th>Type 1 (hypoxaemic)</th><th>Type 2 (hypercapnic)</th></tr><tr><td>PaO₂</td><td>&lt; 60 mmHg (8 kPa)</td><td>Low or normal</td></tr><tr><td>PaCO₂</td><td>Normal or low</td><td>&gt; 45 mmHg (6 kPa)</td></tr><tr><td>Problem</td><td>Gas exchange (V/Q, shunt)</td><td>Ventilation (pump or drive)</td></tr><tr><td>Examples</td><td>Pneumonia, PE, pulmonary oedema, ARDS</td><td>COPD, opioids, neuromuscular, OHS, exhausted asthmatic</td></tr>')}
<h3>Acute, chronic or acute-on-chronic type 2</h3>
<ul><li><b>Acute</b>: pH low, HCO₃⁻ near normal (up ≈ 1 per 10 mmHg PaCO₂).</li>
<li><b>Chronic</b>: pH near normal, HCO₃⁻ high (up ≈ 4 per 10 mmHg).</li>
<li><b>Acute-on-chronic</b>: HCO₃⁻ high but pH still low. Typical of a COPD exacerbation.</li></ul>
<p>Treat the pH, not the PaCO₂. A COPD patient living at PaCO₂ 60 with pH 7.38 needs no ventilation; the same PaCO₂ with pH 7.25 needs non-invasive ventilation.</p>`,
keys:[['Type 1','PaO₂ < 60 mmHg (8 kPa)'],['Type 2','PaCO₂ > 45 mmHg (6 kPa)'],['Decides urgency','pH']],
hook:'One problem (oxygen) or two (oxygen and CO₂). Then let the pH tell you how new it is.',
q:[['PaCO₂ 80, HCO₃⁻ 34, pH 7.25. Interpretation?',['Acute respiratory acidosis','Chronic compensated respiratory acidosis','Acute-on-chronic respiratory acidosis','Metabolic alkalosis'],2,'Acute rule predicts HCO₃⁻ ≈ 28; chronic predicts ≈ 40. 34 sits between: a chronic retainer whose PaCO₂ has risen acutely on top.'],
['Pneumonia, PaO₂ 52, PaCO₂ 31. Type?',['Type 1','Type 2','Mixed','Normal'],0,'Hypoxaemia with low CO₂ (hyperventilation).']]});

lesson({id:'ventchg',m:'gas',t:'When ventilation changes: predicting the next gas',w:['hh'],
sum:'Acute changes in PCO₂ move HCO₃⁻ only slightly, so pH swings hard. Predict the next gas before you change the ventilation.',
body:`<p>Over minutes, only chemical buffering moves bicarbonate: about <b>+1 mmol/L per 10 mmHg</b> rise in PCO₂ (and about −2 per 10 mmHg fall from normal). The kidneys need days. So any sudden change in ventilation shows up almost entirely in the pH.</p>
<h3>Three situations where this kills</h3>
<ul><li><b>Metabolic acidosis losing its compensation.</b> DKA with HCO₃⁻ 6 and PCO₂ 17 has pH ≈ 7.17. If sedation or exhaustion lets PCO₂ rise to 40, HCO₃⁻ only reaches ≈ 8 and pH falls to ≈ 6.94. A "normal" PCO₂ in severe metabolic acidosis is respiratory failure.</li>
<li><b>Intubating salicylate or severe DKA.</b> Match the minute ventilation the patient was achieving before induction, recheck the gas within 15–30 minutes, and keep the PCO₂ near its pre-intubation value.</li>
<li><b>Over-ventilating a CO₂ retainer.</b> A COPD patient living with PCO₂ 65 and HCO₃⁻ 34 who is ventilated to 40 is left with the bicarbonate: post-hypercapnic metabolic alkalosis, pH above 7.5, low ionised calcium and potassium. Ventilate to the usual PCO₂ or a pH of about 7.35–7.40.</li></ul>
<h3>The ventilator arithmetic</h3>
<div class="eq">new rate ≈ current rate × current PaCO₂ ÷ target PaCO₂</div>
<p>PaCO₂ is inversely proportional to alveolar ventilation, so this holds when tidal volume and dead space stay the same. Example: rate 14, PaCO₂ 60, target 45 → 14 × 60 ÷ 45 ≈ 19. In ARDS, lung-protective tidal volumes (≈ 6 mL/kg predicted body weight) often mean accepting a higher PaCO₂ (permissive hypercapnia, pH above about 7.20) rather than raising tidal volume.</p>
<h3>Oxygenation levers are different</h3>
<p>PCO₂ follows ventilation (rate × tidal volume). PaO₂ follows FiO₂ and mean airway pressure (PEEP). Shunt responds to PEEP and recruitment, not to more oxygen alone.</p>
<p>In the Drill's step-by-step mode, some cases end with a "what happens next" question built on these numbers.</p>`,
keys:[['Acute HCO₃⁻ change','+1 per 10 mmHg ↑ · −2 per 10 ↓'],['New rate','rate × PaCO₂ ÷ target'],['Retainer target','usual PCO₂ / pH 7.35–7.40']],
hook:'In the first hour, the kidneys are not coming. Every change in CO₂ lands on the pH.',
q:[['DKA: HCO₃⁻ 6, PCO₂ 17. Sedation lets PCO₂ rise to 40 acutely. pH becomes about…',['7.17 (unchanged)','7.40','6.94','7.10'],2,'HCO₃⁻ ≈ 6 + 2.3 ≈ 8.3; pH = 6.1 + log(8.3 ÷ 1.2) ≈ 6.94.'],
['Ventilated patient: rate 12, PaCO₂ 55, target 40. New rate?',['12','14','16–17','24'],2,'12 × 55 ÷ 40 = 16.5, if tidal volume and dead space are unchanged.'],
['A COPD retainer (PCO₂ 65, HCO₃⁻ 34) is ventilated to PCO₂ 40 within an hour. Expected gas?',['Normal','Post-hypercapnic metabolic alkalosis with alkalaemia','Metabolic acidosis','Acute respiratory acidosis'],1,'The bicarbonate stays high for days while the CO₂ has gone: pH well above 7.45.']]});

/* ---------- KIDNEY & COMPENSATION ---------- */
lesson({id:'renal',m:'kid',t:'How the kidney handles bicarbonate',
sum:'Two jobs: reclaim the 4,300 mmol of HCO₃⁻ filtered each day, and make new HCO₃⁻ to replace what fixed acid consumed, mainly by excreting ammonium.',
body:`<h3>1. Reclaim (proximal tubule, ≈ 80–90%)</h3>
<p>Filtered load ≈ 180 L/day × 24 mmol/L ≈ 4,300 mmol. In the proximal tubule cell, H⁺ is secreted into the lumen by the Na⁺/H⁺ exchanger (NHE3). It meets filtered HCO₃⁻, and luminal carbonic anhydrase turns them into CO₂ and water. CO₂ diffuses into the cell, is rebuilt into HCO₃⁻, and leaves into blood. Net effect: filtered bicarbonate returned, no acid excreted.</p>
<h3>2. Regenerate (new bicarbonate)</h3>
<ul><li><b>Ammoniagenesis</b>: proximal cells metabolise glutamine into 2 NH₄⁺ and 2 new HCO₃⁻. NH₄⁺ is excreted. This is the adaptable route; it rises several-fold in chronic acidosis over 3–5 days.</li>
<li><b>Titratable acid</b>: secreted H⁺ is buffered by filtered phosphate (HPO₄²⁻ → H₂PO₄⁻). Fairly fixed by phosphate intake.</li></ul>
<h3>3. Fine-tune (collecting duct)</h3>
<p>α-intercalated cells secrete H⁺ by H⁺-ATPase and H⁺/K⁺-ATPase; β-intercalated cells secrete HCO₃⁻ (via pendrin) when alkalotic. Aldosterone stimulates H⁺ and K⁺ secretion, linking acid–base to potassium and volume.</p>
<p>What drives more bicarbonate reclaim: high PaCO₂, low ECF volume, angiotensin II, aldosterone, hypokalaemia.</p>`,
keys:[['Filtered HCO₃⁻','≈ 4,300 mmol/day'],['Proximal reclaim','≈ 80–90%'],['Main adaptable acid excretion','NH₄⁺']],
hook:'Reclaim the old, make the new, fine-tune at the end.',
q:[['Which process allows the kidney to increase acid excretion most in chronic acidosis?',['Titratable acid','Ammoniagenesis','Proximal HCO₃⁻ reclaim','Pendrin'],1,'Glutamine metabolism to NH₄⁺ can rise several-fold over days.'],
['Proximal bicarbonate reclaim depends on which enzyme?',['Lactate dehydrogenase','Carbonic anhydrase','Alcohol dehydrogenase','Glutaminase'],1,'Luminal and cytosolic carbonic anhydrase; acetazolamide blocks it.']]});

lesson({id:'rta',m:'kid',t:'Renal tubular acidosis and the urine anion gap',
sum:'RTA is a normal anion gap acidosis from the kidney. The urine anion gap (Na + K − Cl) separates gut losses (negative) from renal causes (positive).',
body:`${tw('<tr><th></th><th>Type 1 (distal)</th><th>Type 2 (proximal)</th><th>Type 4 (hypoaldosteronism)</th></tr><tr><td>Defect</td><td>Cannot secrete H⁺ distally</td><td>Cannot reclaim HCO₃⁻ proximally</td><td>Low aldosterone effect</td></tr><tr><td>Plasma K⁺</td><td>Low</td><td>Low</td><td><b>High</b></td></tr><tr><td>Urine pH</td><td>Always &gt; 5.5</td><td>&lt; 5.5 once plasma HCO₃⁻ is low</td><td>&lt; 5.5</td></tr><tr><td>HCO₃⁻</td><td>Can be very low (&lt; 10)</td><td>Usually 12–20</td><td>Usually &gt; 17</td></tr><tr><td>Clues</td><td>Calcium phosphate stones, nephrocalcinosis</td><td>Fanconi: glycosuria, phosphaturia, aminoaciduria</td><td>Diabetes, ACE-i/ARB, spironolactone, trimethoprim</td></tr><tr><td>Causes</td><td>Sjögren, SLE, amphotericin, lithium</td><td>Myeloma, tenofovir, ifosfamide, acetazolamide</td><td>Diabetic nephropathy, drugs, adrenal insufficiency</td></tr>')}
<h3>Urine anion gap (UAG)</h3>
<div class="eq">UAG = urine Na⁺ + urine K⁺ − urine Cl⁻</div>
<p>NH₄⁺ is the unmeasured urinary cation, excreted with Cl⁻. A kidney responding properly to acidosis excretes lots of NH₄Cl, so Cl⁻ exceeds Na⁺ + K⁺ and the gap is <b>negative</b>: the gut is losing bicarbonate ("neGUTive"). A <b>positive</b> gap means low NH₄⁺: the kidney is the problem (distal RTA, type 4).</p>
<p>The UAG fails when other anions (ketones, hippurate, drugs) are in the urine or when urine Na⁺ is below about 20 mmol/L. The urine osmolal gap is then more reliable.</p>`,
keys:[['UAG negative','Gut loss (diarrhoea)'],['UAG positive','Renal (distal or type 4 RTA)'],['Hyperkalaemic RTA','Type 4']],
hook:'"neGUTive" urine anion gap: the gut is guilty.',
q:[['NAGMA with plasma K⁺ 6.1 in a diabetic on ramipril. Most likely?',['Type 1 RTA','Type 2 RTA','Type 4 RTA','Diarrhoea'],2,'Hyperkalaemic RTA from hypoaldosteronism, worsened by ACE inhibition.'],
['NAGMA, urine Na 40, K 30, Cl 110. UAG and meaning?',['+40; renal','−40; appropriate NH₄⁺ excretion, likely GI loss','0; normal','Cannot use UAG'],1,'40 + 30 − 110 = −40.']]});

lesson({id:'alkmaint',m:'kid',t:'Why metabolic alkalosis persists',
sum:'Healthy kidneys excrete excess bicarbonate quickly. Metabolic alkalosis lasts only if something maintains it: volume depletion, chloride depletion, low potassium or excess mineralocorticoid.',
body:`<p>Every metabolic alkalosis has two phases.</p>
<h3>Generation</h3>
<ul><li>Loss of H⁺: vomiting, nasogastric suction, renal loss (diuretics, mineralocorticoid excess).</li>
<li>Gain of HCO₃⁻: bicarbonate infusion, massive transfusion (citrate → bicarbonate), milk–alkali syndrome.</li>
<li>Contraction: loss of bicarbonate-poor fluid around a fixed amount of bicarbonate.</li>
<li>Post-hypercapnia: chronic retainer ventilated down quickly, high bicarbonate left behind.</li></ul>
<h3>Maintenance</h3>
<ul><li><b>Volume depletion</b>: the kidney prioritises sodium, reclaiming it with HCO₃⁻.</li>
<li><b>Chloride depletion</b>: with little Cl⁻ to reabsorb with Na⁺, Na⁺ is reabsorbed in exchange for H⁺, and pendrin cannot secrete HCO₃⁻ without luminal Cl⁻.</li>
<li><b>Hypokalaemia</b>: increases H⁺ secretion and ammoniagenesis.</li>
<li><b>Aldosterone</b>: drives distal H⁺ and K⁺ secretion.</li></ul>
<p><b>Paradoxical aciduria</b>: after prolonged vomiting the urine can be acidic despite systemic alkalosis, because the kidney is defending volume and potassium.</p>
<p>Treatment follows maintenance: give chloride (as NaCl and KCl) to chloride-responsive alkalosis; treat the mineralocorticoid source in chloride-resistant disease.</p>`,
keys:[['Maintenance factors','Volume, Cl⁻, K⁺, aldosterone'],['Chloride responsive','Urine Cl⁻ < 20 mmol/L'],['Chloride resistant','Urine Cl⁻ > 20 mmol/L']],
hook:'Something has to stop the kidney peeing out the bicarbonate. Find it.',
q:[['After a week of vomiting, why is the urine acidic despite pH 7.55?',['Lab error','Kidney prioritises Na⁺ and K⁺ retention, secreting H⁺','Diarrhoea','Type 1 RTA'],1,'Volume, chloride and potassium depletion all push H⁺ secretion: paradoxical aciduria.'],
['Which fluid corrects a chloride-responsive metabolic alkalosis?',['5% dextrose','0.9% saline with KCl','Sodium bicarbonate','Hartmann\'s alone'],1,'Restoring chloride and volume lets the kidney excrete bicarbonate.']]});

lesson({id:'comp',m:'kid',t:'The compensation rules',w:['comp','map'],
sum:'Metabolic: Winter\'s formula and 0.7 × HCO₃⁻ + 20. Respiratory: 1, 4, 2, 5. Compensation never overshoots.',
body:`${tw('<tr><th>Primary disorder</th><th>Expected compensation</th><th>Limit</th><th>Time</th></tr><tr><td>Metabolic acidosis</td><td>PCO₂ = 1.5 × HCO₃⁻ + 8 (± 2) <i>Winter</i></td><td>PCO₂ ≈ 10–15</td><td>12–24 h</td></tr><tr><td>Metabolic alkalosis</td><td>PCO₂ = 0.7 × HCO₃⁻ + 20 (± 5)</td><td>PCO₂ ≈ 55–60</td><td>24–36 h</td></tr><tr><td>Acute respiratory acidosis</td><td>HCO₃⁻ ↑ <b>1</b> per 10 mmHg PCO₂ above 40</td><td>HCO₃⁻ ≈ 30</td><td>Minutes</td></tr><tr><td>Chronic respiratory acidosis</td><td>HCO₃⁻ ↑ <b>4</b> per 10</td><td>HCO₃⁻ ≈ 45</td><td>3–5 days</td></tr><tr><td>Acute respiratory alkalosis</td><td>HCO₃⁻ ↓ <b>2</b> per 10 mmHg PCO₂ below 40</td><td>HCO₃⁻ ≈ 18</td><td>Minutes</td></tr><tr><td>Chronic respiratory alkalosis</td><td>HCO₃⁻ ↓ <b>5</b> per 10</td><td>HCO₃⁻ ≈ 12–15</td><td>2–3 days</td></tr>')}
<h3>How to use them</h3>
<ol class="steps"><li>Identify the primary disorder from the pH and which value moved in the matching direction.</li>
<li>Calculate the expected value of the other one.</li>
<li>Measured outside the expected range → a second primary disorder.<br>Metabolic acidosis with PCO₂ higher than Winter's → coexisting respiratory acidosis. Lower → coexisting respiratory alkalosis.</li></ol>
<h3>Shortcuts</h3>
<ul><li>In metabolic acidosis, expected PCO₂ ≈ the two digits after "7." of the pH (pH 7.25 → PCO₂ ≈ 25), down to pH ≈ 7.10.</li>
<li>Also: expected PCO₂ ≈ HCO₃⁻ + 15. It stays within Winter's ± 2 only for HCO₃⁻ ≈ 10–20; outside that range use the formula.</li>
<li>Compensation brings pH toward normal but not past 7.40. A "normal" or overshot pH with abnormal PCO₂ and HCO₃⁻ is a mixed disorder, except chronic respiratory alkalosis, which can fully normalise pH.</li></ul>`,
keys:[['Winter\'s','PCO₂ = 1.5·HCO₃⁻ + 8 ± 2'],['Met alkalosis','PCO₂ = 0.7·HCO₃⁻ + 20 ± 5'],['Respiratory','1 · 4 · 2 · 5 per 10 mmHg']],
hook:'"One-four, two-five": acidosis acute/chronic 1 and 4, alkalosis acute/chronic 2 and 5.',
q:[['HCO₃⁻ 10 in DKA. Expected PCO₂?',['15 ± 2','23 ± 2','30 ± 2','40'],1,'1.5 × 10 + 8 = 23.'],
['Chronic respiratory acidosis with PCO₂ 70. Expected HCO₃⁻?',['27','30','36','45'],2,'24 + 4 × 3 = 36.'],
['Metabolic acidosis, HCO₃⁻ 14, PCO₂ 38. Interpretation?',['Appropriately compensated','Coexisting respiratory acidosis','Coexisting respiratory alkalosis','Chronic'],1,'Expected 29 ± 2. A PCO₂ of 38 is too high: the lungs are failing to compensate (fatigue, sedation, chest disease).']]});

lesson({id:'kacid',m:'kid',t:'Potassium and acid–base',
sum:'Acid–base and potassium pull on each other: shifts across cells, and renal handling linked through aldosterone.',
body:`<ul><li><b>Acidosis → hyperkalaemia (shift)</b>, most in mineral acidosis, little in organic acidosis.</li>
<li><b>Alkalosis → hypokalaemia</b>: K⁺ enters cells; distal K⁺ secretion rises.</li>
<li><b>Hypokalaemia → metabolic alkalosis</b>: H⁺ moves into cells, ammoniagenesis rises, distal H⁺ secretion rises.</li>
<li><b>Hyperkalaemia → acidosis</b>: suppresses ammoniagenesis (part of type 4 RTA).</li></ul>
<h3>DKA: the trap</h3>
<p>Plasma K⁺ is often normal or high at presentation, yet <b>total body K⁺ is depleted</b> by osmotic diuresis. Insulin drives K⁺ into cells. Do not start insulin until K⁺ is above about 3.5 mmol/L, and add potassium to fluids once it falls below about 5.0–5.5.</p>
<h3>Sodium bicarbonate</h3>
<p>Correcting acidosis lowers K⁺: useful in hyperkalaemia with acidosis, dangerous when K⁺ is already low.</p>
<h3>Ionised calcium</h3>
<p>H⁺ competes with Ca²⁺ for albumin binding. Acidosis raises ionised calcium; alkalosis lowers it, which is why hyperventilation causes tingling and carpopedal spasm.</p>`,
keys:[['DKA K⁺','Normal plasma, low total body'],['Insulin start','K⁺ ≥ 3.5 mmol/L'],['Alkalosis','↓ K⁺, ↓ ionised Ca²⁺']],
hook:'Acid pushes potassium out, alkali pulls it in.',
q:[['DKA: pH 7.05, K⁺ 3.1. First step?',['Start insulin infusion','Replace potassium before insulin','Give bicarbonate','Give insulin and recheck in 4 h'],1,'Insulin would drive K⁺ dangerously low. Replace to ≥ 3.5 first.'],
['A panicking patient hyperventilating has tingling fingers. Mechanism?',['Hyperkalaemia','Fall in ionised calcium from alkalosis','Hypoglycaemia','Hypoxia'],1,'Alkalosis increases calcium binding to albumin.']]});

/* ---------- SAMPLE & MACHINE ---------- */
lesson({id:'sites',m:'samp',t:'Arterial, venous, capillary and central samples',
sum:'Arterial blood tells you about the lungs\' output. Venous blood reflects the tissue it drained. Pick the sample that answers your question.',
body:`${tw('<tr><th>Sample</th><th>Good for</th><th>Not good for</th></tr><tr><td>Arterial (radial, brachial, femoral)</td><td>Oxygenation, A–a, exact PaCO₂</td><td>—</td></tr><tr><td>Peripheral venous</td><td>pH, HCO₃⁻, lactate, electrolytes, glucose, screening out hypercapnia</td><td>Oxygenation, exact PCO₂</td></tr><tr><td>Central venous (ScvO₂)</td><td>Delivery vs demand in shock</td><td>Arterial oxygenation</td></tr><tr><td>Arterialised capillary (earlobe)</td><td>pH and PCO₂ in COPD clinics, children</td><td>PaO₂ (underestimates)</td></tr>')}
<h3>Radial artery technique</h3>
<ul><li>Wrist slightly extended, palpate the artery 1–2 cm proximal to the crease.</li>
<li>Pre-heparinised syringe, needle at 30–45° bevel up, let the pulse fill the syringe.</li>
<li>Pressure for 5 minutes (longer if anticoagulated).</li>
<li>The modified Allen test is widely taught but predicts ischaemia poorly; many centres no longer rely on it. Avoid arteries with poor collateral supply and know the patient's anticoagulation.</li></ul>
<p>The next four lessons in this module are a technique clinic: the radial puncture step by step, the Allen test, venous and earlobe draws, and bubbles and delay.</p>
<p>On room air or note the FiO₂ and device. A gas without FiO₂ cannot be interpreted for oxygenation.</p>`,
keys:[['Oxygenation needs','Arterial sample + FiO₂'],['Pressure after ABG','≥ 5 min'],['Capillary','Fine for pH/PCO₂, not PO₂']],
hook:'An ABG without the FiO₂ is half a gas.',
q:[['Which question does a peripheral VBG answer reliably?',['Is the PaO₂ adequate?','Is the patient acidotic and what is the lactate?','What is the A–a gradient?','Is there shunt?'],1,'Venous pH, bicarbonate and lactate agree well with arterial values.'],
['What must accompany an ABG to interpret oxygenation?',['Patient\'s weight','FiO₂ or oxygen device','Serum albumin','Haemoglobin'],1,'Without it, a PaO₂ of 90 could be normal or terrible.']]});

lesson({id:'preanal',m:'samp',t:'Pre-analytical errors: when the sample lies',
sum:'Air bubbles, too much heparin, delay, haemolysis, and a venous sample labelled arterial account for most "impossible" gases.',
body:`${tw('<tr><th>Error</th><th>PO₂</th><th>PCO₂</th><th>Other</th></tr><tr><td>Air bubble</td><td>Toward ≈ 150 (up if low, down if high)</td><td>↓ toward 0</td><td>pH ↑</td></tr><tr><td>Excess liquid heparin (dilution)</td><td>Variable</td><td>↓</td><td>HCO₃⁻ ↓, iCa²⁺ ↓ (binding)</td></tr><tr><td>Delay at room temperature</td><td>↓ (cells consume O₂)</td><td>↑</td><td>pH ↓, lactate ↑, glucose ↓</td></tr><tr><td>Haemolysis (difficult draw, shaking)</td><td>—</td><td>—</td><td>K⁺ falsely ↑</td></tr><tr><td>Venous blood in an "arterial" syringe</td><td>Low (30–45)</td><td>↑ slightly</td><td>Saturation ≪ SpO₂</td></tr><tr><td>Leukocyte larceny</td><td>↓↓</td><td>↑</td><td>Normal SpO₂</td></tr>')}
<h3>Rules that prevent most errors</h3>
<ul><li>Use dry, balanced (calcium-titrated) lithium heparin syringes.</li>
<li>Expel air immediately and cap. Mix by rolling, not shaking.</li>
<li>Analyse within about 15–30 minutes in a plastic syringe at room temperature. Ice is for glass or longer delays (plastic is permeable to O₂ at low temperature).</li>
<li>Compare the PaO₂ with the SpO₂. If SpO₂ is 98% and PaO₂ is 38, you sampled a vein, or the oximeter is wrong.</li></ul>`,
keys:[['Bubble','PO₂ → 150, PCO₂ ↓'],['Delay','PO₂ ↓, PCO₂ ↑, lactate ↑'],['Analyse within','≈ 15–30 min']],
hook:'If the gas and the patient disagree, believe the patient and repeat the gas.',
q:[['SpO₂ 97%, "ABG" PaO₂ 36, SO₂ 68%, PCO₂ 47. Most likely?',['Severe shunt','Venous sample','Methaemoglobinaemia','Air bubble'],1,'Saturation far below a reliable SpO₂ with venous-range PO₂ means venous blood.'],
['A sample sat for 90 minutes before analysis. Which value rises falsely?',['PO₂','Glucose','Lactate','pH'],2,'Red and white cells continue glycolysis, producing lactate and consuming glucose and O₂.']]});

lesson({id:'analyser',m:'samp',t:'Inside the analyser',
sum:'Three electrodes measure pH, PCO₂ and PO₂ directly. Bicarbonate, base excess and often saturation are calculated. Co-oximetry measures haemoglobin species by light.',
body:`${tw('<tr><th>Value</th><th>How</th><th>Measured or calculated</th></tr><tr><td>pH</td><td>Glass electrode: H⁺-sensitive glass develops a voltage against a reference (Nernst, ≈ 61.5 mV per pH unit at 37 °C)</td><td>Measured</td></tr><tr><td>PCO₂</td><td><b>Severinghaus electrode</b>: CO₂ crosses a membrane into bicarbonate solution and changes its pH, read by a glass electrode</td><td>Measured</td></tr><tr><td>PO₂</td><td><b>Clark electrode</b>: O₂ is reduced at a platinum cathode; current ∝ PO₂</td><td>Measured</td></tr><tr><td>Na⁺, K⁺, Cl⁻, iCa²⁺</td><td>Direct ion-selective electrodes</td><td>Measured</td></tr><tr><td>Glucose, lactate</td><td>Enzyme electrodes (oxidase → H₂O₂ → current)</td><td>Measured</td></tr><tr><td>Hb species</td><td>Co-oximetry: absorbance at many wavelengths</td><td>Measured</td></tr><tr><td>HCO₃⁻</td><td>Henderson–Hasselbalch from pH and PCO₂</td><td><b>Calculated</b></td></tr><tr><td>Base excess</td><td>Van Slyke equation</td><td><b>Calculated</b></td></tr><tr><td>sO₂ (no co-oximeter)</td><td>From PO₂ via a standard curve</td><td><b>Calculated</b> (wrong in CO poisoning)</td></tr>')}
<h3>Gas machine versus main lab</h3>
<ul><li><b>Sodium</b>: blood gas machines use direct ISE, unaffected by high lipids or protein. Main labs often use indirect ISE (diluted sample), which gives pseudohyponatraemia in severe hyperlipidaemia or myeloma.</li>
<li><b>Bicarbonate</b>: the lab reports total CO₂ (measured), typically about 1–2 mmol/L higher than calculated HCO₃⁻.</li>
<li>Mixing the two in one anion gap adds error. Use one source for Na⁺, Cl⁻ and HCO₃⁻.</li></ul>`,
keys:[['PCO₂ electrode','Severinghaus'],['PO₂ electrode','Clark'],['HCO₃⁻','Calculated']],
hook:'Clark for oxygen, Severinghaus for CO₂, glass for pH. Everything else is arithmetic or light.',
q:[['On a gas without co-oximetry, a CO-poisoned patient shows sO₂ 99%. Why?',['CO raises PaO₂','sO₂ is calculated from PaO₂, which is normal','The Clark electrode reads CO as O₂','CO shifts the curve right'],1,'Calculated saturation assumes normal haemoglobin. Only co-oximetry measures COHb.'],
['Which value on a standard ABG printout is calculated, not measured?',['pH','PCO₂','HCO₃⁻','Na⁺'],2,'Derived from pH and PCO₂ by Henderson–Hasselbalch.']]});

lesson({id:'oxim',m:'samp',t:'Pulse oximetry and co-oximetry',
sum:'Pulse oximeters use two wavelengths and assume only oxy- and deoxy-Hb exist. CO reads as oxygen; MetHb drags readings toward 85%; darker skin can hide hypoxaemia.',
body:`<p>A pulse oximeter compares the pulsatile absorbance of red (≈ 660 nm) and infrared (≈ 940 nm) light. That only distinguishes two species. A co-oximeter uses many wavelengths and reports O₂Hb, HHb, COHb and MetHb separately.</p>
<h3>Where SpO₂ misleads</h3>
<ul><li><b>Carbon monoxide</b>: COHb absorbs like O₂Hb at 660 nm, so SpO₂ stays high despite low content.</li>
<li><b>Methaemoglobin</b>: absorbs both wavelengths; SpO₂ trends toward ≈ 85% regardless of the true value.</li>
<li><b>Skin pigmentation</b>: in large US cohorts, occult hypoxaemia (SaO₂ &lt; 88% with SpO₂ 92–96%) was about three times as common in Black patients as in White patients. Check an ABG when decisions hinge on SpO₂.</li>
<li>Poor perfusion, cold fingers, motion, nail polish, intravenous dyes (methylene blue).</li>
<li>Accuracy falls below about 80%.</li></ul>
<h3>Saturation gap</h3>
<p>SpO₂ (or calculated sO₂) minus co-oximetry SaO₂. A gap above about 5% suggests a dyshaemoglobin.</p>`,
keys:[['Wavelengths','660 nm and 940 nm'],['MetHb SpO₂','≈ 85%'],['Saturation gap','> 5% → dyshaemoglobin']],
hook:'A pulse oximeter only knows two colours of haemoglobin. The co-oximeter knows them all.',
q:[['A patient has blue lips, SpO₂ 85% on any amount of oxygen, normal PaO₂. Likely?',['Shunt','Methaemoglobinaemia','CO poisoning','Venous sample'],1,'Cyanosis with SpO₂ stuck near 85% and a normal PaO₂: methaemoglobin.'],
['Why is SpO₂ normal in carbon monoxide poisoning?',['CO does not bind Hb','COHb absorbs red light like oxyhaemoglobin','CO raises PaO₂','The probe heats up'],1,'Two-wavelength oximetry cannot separate COHb from O₂Hb.']]});
