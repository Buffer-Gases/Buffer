*{box-sizing:border-box;border-radius:0!important}
.round,.web-n circle,input[type=radio]{border-radius:50%!important}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--px);font-weight:400;line-height:1.25;margin:0;letter-spacing:0;font-synthesis:none;-webkit-font-smoothing:none;text-wrap:balance}
h1{font-size:24px}h2{font-size:18px}h3{font-size:14px}
p{margin:0}a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.px{font-family:var(--px);font-variant-numeric:tabular-nums;font-weight:400;-webkit-font-smoothing:none}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--px);font-size:10px;letter-spacing:0;text-transform:uppercase;color:var(--accent-ink);font-weight:400;-webkit-font-smoothing:none}
.muted{color:var(--muted)}
.note{font-size:.86rem;color:var(--muted);max-width:75ch;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* notched bevelled card */
.card{background:var(--surface);border:2px solid var(--line);box-shadow:inset 2px 2px 0 var(--bev),inset -2px -2px 0 var(--bevd);padding:16px;min-width:0;--n:3px;clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.card.tint{background:var(--accent-tint)}
.card.raised{border-color:var(--accent);box-shadow:5px 5px 0 var(--deep);clip-path:none}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--px);font-size:18px;color:var(--ink);-webkit-font-smoothing:none}
.brand .bub{position:relative;width:22px;height:22px;background:var(--accent);box-shadow:3px 3px 0 var(--deep)}
.brand .bub::before{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;background:var(--hi)}
.brand .bub::after{content:"";position:absolute;right:-7px;top:-7px;width:7px;height:7px;background:var(--accent);box-shadow:1px 1px 0 var(--deep)}
nav.tabs{display:flex;gap:2px;margin-left:10px}
nav.tabs button{border:0;background:none;font-family:var(--px);font-size:10px;padding:8px 10px;color:var(--muted);display:flex;align-items:center;gap:6px;-webkit-font-smoothing:none}
nav.tabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;shape-rendering:crispEdges}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs button:hover:not([aria-current="page"]){color:var(--ink)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-family:var(--px);font-size:10px;background:var(--surface-2);border:2px solid var(--line);white-space:nowrap;color:var(--ink);-webkit-font-smoothing:none}
.chip.hot,.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--line);background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--bevd),inset 0 1px 0 var(--bev)}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;background:var(--bg);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:3px;text-align:center;padding:7px 2px;font-size:9px;justify-content:center}
  nav.tabs button svg{width:22px;height:22px}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
  body.insession nav.tabs{display:none}
  body.insession main{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))!important}
  #roundbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  body.insession #roundbar{bottom:0}
  .hrow .chip.xp{display:none}
}
main{padding-block:18px 90px}
section.view{display:flex;flex-direction:column;gap:16px;animation:fadein .18s steps(3)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* buttons */

.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--px);font-size:14px;-webkit-font-smoothing:none}
.verdict i{width:28px;height:28px;display:grid;place-items:center;font-style:normal;font-family:var(--px);font-size:13px;color:#fff;flex:none}
.fb.ok .verdict i{background:var(--good)} .fb.no .verdict i{background:var(--bad)}
.stepl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stepl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 12px;background:var(--surface-2);border:2px solid var(--line)}
.stepl li>i{grid-row:span 2;font-family:var(--px);font-size:11px;line-height:24px;font-style:normal;text-align:center;width:26px;height:26px;background:var(--line);color:var(--ink)}
.stepl li.ok>i{background:var(--good);color:#fff}.stepl li.warn>i{background:var(--warn);color:#fff}.stepl li.bad>i{background:var(--bad);color:#fff}
.stepl li b{font-weight:700;font-size:.95rem}
.stepl li b small{font-family:var(--px);font-weight:400;font-size:9px;color:var(--muted);text-transform:uppercase;display:block}
.stepl li p{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.unsure{padding:10px 12px;background:var(--warn-soft);border:2px solid var(--warn)}
.causes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.bigread{font-family:var(--px);font-size:clamp(16px,2.4vw,22px);line-height:1.3;-webkit-font-smoothing:none}
.line{font:500 .82rem/1.5 var(--f-mono);background:var(--surface-2);border:2px solid var(--line);padding:10px 12px;overflow-wrap:anywhere}
.timer{font-family:var(--px);font-size:18px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropts .opt{padding:14px;font-size:1rem}
.flash-ok{animation:fok .4s steps(4)}.flash-no{animation:fno .4s steps(4)}
@keyframes fok{from{box-shadow:0 0 0 5px var(--good)}to{box-shadow:0 0 0 0 transparent}}
@keyframes fno{from{box-shadow:0 0 0 5px var(--bad)}to{box-shadow:0 0 0 0 transparent}}
.fitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.fitc{display:flex;flex-direction:column;gap:10px;padding:12px;text-align:left;color:inherit}
.fitc .slip{font-size:.8rem;padding:10px 10px 8px}
.fitc .slip td:nth-child(4){display:none}
.fitc:hover{border-color:var(--accent)}
.fitc.right{border-color:var(--good);background:var(--good-soft)}.fitc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.gymq{font-family:var(--px);font-size:clamp(15px,2.6vw,20px);line-height:1.45;-webkit-font-smoothing:none}
/* summary */
.sumhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.bigscore{display:grid;place-items:center;width:110px;height:110px;border:4px solid var(--accent);background:var(--accent-tint);box-shadow:5px 5px 0 var(--deep);text-align:center}
.bigscore b{font-family:var(--px);font-size:26px;font-weight:400;display:block}
.bigscore small{font-family:var(--px);font-size:10px;color:var(--muted)}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--px);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.stats small{font-family:var(--px);font-size:9px;color:var(--muted);text-transform:uppercase}
.slips{display:flex;flex-direction:column;gap:7px}
.sb{display:grid;grid-template-columns:140px minmax(0,1fr) 44px 40px;gap:10px;align-items:center;font-size:.88rem}
.sb b{font-family:var(--px);font-weight:400;font-size:11px;text-align:right}.sb small{font-family:var(--px);font-size:9px;color:var(--muted);text-align:right}
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
@media (max-width:480px){.sb{grid-template-columns:100px minmax(0,1fr) 38px 30px}}
.caselist{display:flex;flex-direction:column;gap:5px}
.caselist div{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line)}
.caselist .d{width:10px;height:10px;background:var(--good)}.caselist .d.x{background:var(--bad)}
.caselist small{font-family:var(--px);font-size:9px;color:var(--muted)}
.spark{display:flex;gap:3px;align-items:flex-end;height:44px}
.spark i{flex:1;max-width:12px;background:var(--line)}
.spark i.k{background:var(--good)}.spark i.x{background:var(--bad)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
/* interpret */
.igrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;align-items:start}
.igrid>*{min-width:0}
@media (max-width:900px){.igrid{grid-template-columns:minmax(0,1fr)}}
.fset{display:flex;flex-direction:column;gap:12px}
.fset h3{font-size:10px;color:var(--muted);text-transform:uppercase}
.ctrls.tight{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px 12px}
.ctrl input.filled{border-color:var(--accent);background:var(--accent-tint)}
textarea.inp{min-height:84px;font-size:.82rem;resize:vertical}
.refc{border-color:var(--accent);background:var(--accent-tint)}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary .eyebrow::after,details>summary.eyebrow::after{content:" ▸"}details[open]>summary .eyebrow::after,details[open]>summary.eyebrow::after{content:" ▾"}
.formulas .tbl td{font-size:.84rem}
/* settings */
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.srow b{font-weight:700}
.srow span{font-size:.85rem;color:var(--muted)}
.srow select,.srow input[type=number],.srow input[type=text]{border:2px solid var(--line);background:var(--raise);padding:8px 10px;font:500 .9rem var(--f-mono);color:var(--ink);max-width:100%}
.srow .slide{flex:1 1 220px;display:flex;align-items:center;gap:10px}
.srow .slide output{font-family:var(--px);font-size:12px;color:var(--accent-ink);min-width:44px;text-align:right}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.res a{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent)}
.res h3{font-size:12px}
.res p{font-size:.85rem;color:var(--muted)}
.res small{font-family:var(--px);font-size:9px;color:var(--accent-ink)}
textarea.copy{width:100%;min-height:90px;font:.75rem var(--f-mono);border:2px solid var(--line);background:var(--surface-2);color:var(--ink);padding:8px}
.g-status{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);background:var(--surface-2)}
.g-status.on{border-color:var(--good);background:var(--good-soft)}
.g-dot{width:12px;height:12px;background:var(--null);flex:none}
.g-status.on .g-dot{background:var(--good)}
.g-status b{display:block}.g-status small{color:var(--muted)}
.adv summary{font-family:var(--px);font-size:10px;color:var(--muted)}
/* concept web */
.web-wrap{padding:6px;overflow:auto}
.web-svg{width:100%;min-width:760px;height:auto;display:block;font-family:var(--f-body)}
.web-n{cursor:pointer}
.web-n.dim{opacity:.32}
.web-el{paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.web-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;margin-top:8px}
.web-legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.web-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin:8px 0}
.web-link{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;border:2px solid var(--line);background:var(--surface-2);color:inherit}
.web-link b{font-family:var(--px);font-size:10px;font-weight:400}.web-link span{font-size:.8rem;color:var(--muted)}
.web-link:hover{border-color:var(--accent)}
/* teach + estimate + scenarios */
.tb-text{border:2px solid var(--line);background:var(--raise);padding:10px 12px;width:100%;font-family:var(--f-body);font-size:1rem;line-height:1.5;resize:vertical;min-height:140px;color:var(--ink)}
.tb-echo{white-space:pre-wrap;line-height:1.55;font-style:italic}
.tb-rub{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer}
.tb-rub.on{border-color:var(--good);background:var(--good-soft)}
.tb-rub input{width:22px;height:22px;accent-color:var(--good);flex:none;margin-top:2px}
.est-track{position:relative;height:16px;background:var(--surface-2);border:2px solid var(--line)}
.est-track i{position:absolute;top:-6px;width:6px;height:24px;transform:translateX(-50%)}
.est-you{background:var(--accent)}.est-ans{background:var(--good)}.est-band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.est-lab{display:flex;justify-content:space-between;font-family:var(--px);font-size:10px;color:var(--muted);margin-top:6px}
.headline{font-size:1.1rem;line-height:1.5}
.ask{font-family:var(--px);font-size:12px;color:var(--accent-ink);-webkit-font-smoothing:none}
.scn-log{display:flex;flex-direction:column;gap:6px}
.scn-log div{padding:8px 10px;border-left:4px solid var(--line);background:var(--surface-2);font-size:.9rem}
.scn-log div.bad{border-left-color:var(--bad)}.scn-log div.good{border-left-color:var(--good)}
.scn-step{display:flex;flex-direction:column;gap:12px}
.scn-step .p{font-size:1.04rem;line-height:1.55}
.scn-opts{display:flex;flex-direction:column;gap:8px}
/* flash */
.flashwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.flashcard{width:min(100%,520px);min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:22px;background:var(--surface);border:2px solid var(--accent);box-shadow:6px 6px 0 var(--deep);text-align:center;touch-action:pan-y;user-select:none;position:relative;cursor:pointer;transition:transform .12s}
.flashcard .fq{font-family:var(--px);font-size:14px;line-height:1.5;-webkit-font-smoothing:none}
.flashcard .fa{font:700 1.15rem/1.45 var(--f-mono)}
.flashcard small{color:var(--muted)}
.flashcard[data-swipe]::after{content:attr(data-swipe);position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--px);font-size:11px;background:var(--ink);color:var(--bg);padding:4px 8px}
/* progress */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge-tile{display:flex;flex-direction:column;gap:3px;padding:10px;border:2px solid var(--line);color:var(--muted);background:var(--surface-2)}
.badge-tile b{font-family:var(--px);font-size:10px;font-weight:400}
.badge-tile small{font-size:.78rem}
.badge-tile.won{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;max-width:560px}
.heat i{aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:var(--accent-soft)}.heat i.l2{background:var(--hi)}.heat i.l3{background:var(--accent)}.heat i.t{outline:2px solid var(--ink)}
/* hand kit */
.hintbubble{position:fixed;z-index:80;max-width:270px;background:var(--ink);color:var(--bg);padding:10px 12px;font-size:.84rem;line-height:1.35;transform:translateY(-100%) scale(.95);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;border:2px solid var(--accent)}
.hintbubble.on{opacity:1;transform:translateY(-100%) scale(1)}
.hintbubble b{display:block;color:var(--accent);margin-bottom:2px;font-family:var(--px);font-size:10px;font-weight:400}
.held{transform:scale(.97);transition:transform .15s}
.sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-scrim.on{opacity:1}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border:2px solid var(--line);border-bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;transform:translateY(30px);transition:transform .2s;touch-action:none}
.sheet-scrim.on .sheet{transform:none}
.sheet-grab{width:40px;height:4px;background:var(--line);margin:0 auto 6px}
.sheet>b{font-family:var(--px);font-size:10px;padding:4px 0 6px;color:var(--muted);font-weight:400}
.sheet-btn{text-align:left;padding:13px 12px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:1rem;color:inherit}
.sheet-btn.cancel{background:none;border-color:transparent;color:var(--muted);text-align:center;margin-top:4px}
/* round bar + toast */
#roundbar{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--ink);color:var(--bg);border-top:2px solid var(--accent)}
.rb-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.rb-in .eyebrow{color:var(--accent)}.rb-in b{flex:1;min-width:140px;font-size:.9rem}
.rb-in .pips{max-width:160px;flex:1 0 100px}
.rb-in .btn{background:var(--raise);color:var(--ink);min-height:34px;padding:5px 10px}
body.inround main{padding-bottom:150px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:75;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
@media (max-width:760px){#toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
body.inround #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){body.inround:not(.insession) #toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
body.inround main.wrap{padding-bottom:90px}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:11px 16px;font-weight:700;border:2px solid var(--accent);animation:fadein .2s steps(3)}
.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--good)}
.crash{border-color:var(--bad);background:var(--bad-soft)}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:18px;border:2px dashed var(--line-2);color:var(--muted)}
.pocket{columns:2 320px;column-gap:14px}
.pocket .card{break-inside:avoid;margin-bottom:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* v4 additions: labs tools, settings, pocket, print */
.labgrid.one{grid-template-columns:minmax(0,1fr)}
.card.set{display:flex;flex-direction:column;gap:6px}
#google-root{margin:14px 0}
.ucv{display:grid;gap:10px}
.urow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.2fr) auto minmax(0,1.2fr);gap:10px;align-items:end}
.urow>b{align-self:center;font-size:.9rem}
.urow .eq{align-self:center;font-family:var(--f-mono);color:var(--accent-ink);padding-bottom:8px}
@media (max-width:560px){.urow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.urow>b{grid-column:1/-1}}
ul.tight,ol.tight{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;font-size:.92rem;line-height:1.45}
.pocket{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.pocket .tbl{width:100%;min-width:0;table-layout:fixed}.pocket .tbl td,.pocket .tbl th{font-size:.86rem;white-space:normal;overflow-wrap:anywhere}
#citrus-line:empty{display:none}
.flashcard{touch-action:pan-y;transition:transform .15s}
@media print{header.top,nav.tabs,#roundbar,#toasts,.noprint,.crumbs,.view-head{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none!important;break-inside:avoid;border:1px solid #999!important}.wrap{padding:0;max-width:none}}

/* 4.1: 44px touch targets */
.iconbtn{width:44px;height:44px}
.btn.small,.sbar .btn,.sbar .iconbtn,nav.tabs button,.chip.btn,.llist button{min-height:44px}
.sbar #sExit,.sbar .iconbtn{min-width:44px}
.brand{min-height:44px;display:inline-flex;align-items:center}

/* 4.2: Quiet mode + clinical skin */
body.quiet #hdr-xp,body.quiet .lvlpill,body.quiet .gamey{display:none!important}
html[data-skin="clinical"]{--px:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif}
html[data-skin="clinical"] *{-webkit-font-smoothing:antialiased!important}
html[data-skin="clinical"] *{border-radius:10px!important}
html[data-skin="clinical"] .round,html[data-skin="clinical"] .web-n circle{border-radius:50%!important}
html[data-skin="clinical"] .card,html[data-skin="clinical"] .btn,html[data-skin="clinical"] .chip,html[data-skin="clinical"] .iconbtn,html[data-skin="clinical"] .tile,html[data-skin="clinical"] .opt{clip-path:none!important;box-shadow:none!important;border-width:1px}
html[data-skin="clinical"] .card.raised{box-shadow:0 2px 10px rgba(0,0,0,.18)!important}
html[data-skin="clinical"] h1,html[data-skin="clinical"] h2,html[data-skin="clinical"] h3{font-weight:700;letter-spacing:-.005em}
html[data-skin="clinical"] .btn.primary{box-shadow:none;font-weight:700}
.sheet{max-height:86vh;overflow:auto}
/* 4.3 */
.nextc{display:grid;gap:10px}.nextc details{border-top:1px solid var(--line);padding-top:8px}.nextc summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.nextc h4,.weekc h4{margin:10px 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nx{margin:0;padding-left:1.1em;display:grid;gap:3px}.nx li{line-height:1.4}
.srcl{margin:6px 0 0;padding-left:1.3em;font-size:.82rem;color:var(--muted);display:grid;gap:4px}
.teachonly,.teachbar{font-size:.8rem;color:var(--muted);border-left:3px solid var(--accent);padding:6px 10px;margin:0;background:var(--accent-soft)}
.teachbar{margin:0 0 14px}
.privacy{font-size:.86rem;margin:0 0 12px;padding:8px 10px;border:1px dashed var(--accent);background:var(--accent-soft)}
.warnline{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:4px 0}
.fld{display:grid;gap:4px;margin:8px 0}.fld span{font-size:.85rem;color:var(--muted)}.fld input,.fld textarea{font:inherit;padding:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%;box-sizing:border-box}
.trend{display:grid;gap:8px;margin-top:10px}.trow{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:10px;align-items:center}.trow small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.78rem}
.spark{width:100%;height:56px}.tband{fill:var(--good-soft)}.tline{fill:none;stroke:var(--accent);stroke-width:2.5}.tdot{fill:var(--accent)}
.tlist{font-size:.84rem;margin:10px 0 6px;padding-left:1.3em;display:grid;gap:3px}
.loglist{display:grid;gap:10px;margin-top:12px}.logi{display:grid;gap:6px}
.seg.wrap{flex-wrap:wrap}
@media (max-width:520px){.trow{grid-template-columns:1fr}}
/* 4.4 */
.kst b{font-size:1rem;line-height:1.3}.davsteps{display:grid;gap:4px;padding-left:1.3em;margin:8px 0}.davsteps li{opacity:.55}.davsteps li.on,.davsteps.on li{opacity:1}
.spcard{display:grid;gap:14px}.spbar{height:8px;background:var(--line);overflow:hidden}.spbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .05s linear}
.spgas{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}.spgas div{border:2px solid var(--line);padding:8px 10px;display:grid}.spgas small{color:var(--muted);font-size:.78rem}.spgas small i{font-style:normal;opacity:.75}.spgas b{font-family:var(--f-mono);font-size:1.35rem}
