lesson({id:'stewartx',m:'chem',t:'Stewart, worked through one patient',w:['sid'],
sum:'Apparent SID − effective SID = strong ion gap. One example shows how chloride and hidden anions each pull the bicarbonate down.',
body:`<p>The anion gap and the Stewart approach answer the same question from two sides. Working one gas both ways makes the link concrete. A septic patient after 4 L of 0.9% saline:</p>
<div class="eq">Na 138 · K 4.0 · iCa 1.1 · Mg 0.6 · Cl 110 · lactate 2.0 · pH 7.25 · HCO₃⁻ 12 · albumin 25 g/L · phosphate 1.2</div>
<h3>1. Apparent SID (the strong ions you measured)</h3>
<div class="eq">SIDa = Na + K + 2·iCa + 2·Mg − Cl − lactate = 138 + 4 + 2.2 + 1.2 − 110 − 2 = 33.4</div>
<p>Normal is about 40–42. A low SIDa is acidifying. Here the main culprit is chloride: Na − Cl is only 28 (normally about 36; below 32 is clearly low).</p>
<h3>2. Effective SID (the weak acids that carry the remaining charge)</h3>
<div class="eq">Albumin⁻ = alb (g/L) × (0.123 × pH − 0.631) = 25 × 0.261 = 6.5<br>Phosphate⁻ = PO₄ (mmol/L) × (0.309 × pH − 0.469) = 1.2 × 1.771 = 2.1<br>SIDe = HCO₃⁻ + albumin⁻ + phosphate⁻ = 12 + 6.5 + 2.1 = 20.6</div>
<h3>3. Strong ion gap</h3>
<div class="eq">SIG = SIDa − SIDe = 33.4 − 20.6 = 12.8</div>
<p>Normally SIG is close to 0 (under about 2–3). A SIG of 12.8 means unmeasured anions (ketones, uraemic anions, toxins, unmeasured organic acids). Lactate is already inside SIDa, so it does not count again here.</p>
<h3>Read it the bedside way</h3>
<ul><li>AG = 138 − (110 + 12) = 16; corrected for albumin 16 + 0.25 × 15 ≈ 20: a high gap even though 16 looked borderline.</li>
<li>Na − Cl = 28: a hyperchloraemic (saline) component as well.</li>
<li>Both approaches find two processes: chloride gain plus an unmeasured-anion acidosis. Stewart adds why the low albumin makes the bicarbonate look less bad than the acid load (albumin loss is alkalinising).</li></ul>
<p>Try your own numbers in Labs → Tools → Stewart.</p>`,
keys:[['Normal SIDa','≈ 40–42 mEq/L'],['Normal SIG','≈ 0 (under 2–3)'],['Albumin charge','alb × (0.123·pH − 0.631)']],
hook:'Chloride up or SIG up: Stewart names which strong-ion problem is eating the bicarbonate.',
q:[['SIDa 33, SIDe 32, SIG 1, Na − Cl 27. What is the dominant problem?',['Unmeasured anions','Hyperchloraemia (low SID from chloride)','Hypoalbuminaemia','Respiratory acidosis'],1,'SIG is near zero, so there are no hidden anions; the low SIDa comes from chloride.'],
['Why does a low albumin make an acidosis look milder on the bicarbonate?',['Albumin is a weak acid; losing it is alkalinising','Albumin binds bicarbonate','Low albumin raises PCO₂','It does not'],0,'Less A_tot means less weak-acid charge, so for the same strong-ion problem the HCO₃⁻ is higher.']]});

lesson({id:'uosm',m:'kid',t:'When the urine anion gap lies: the urine osmolal gap',
sum:'Urine osmolal gap = measured − calculated urine osmolality. Ammonium ≈ gap ÷ 2. Use it when ketones, hippurate or drugs make the urine anion gap unreliable.',
body:`<p>The urine anion gap (Na + K − Cl) uses chloride as a stand-in for ammonium. That fails when ammonium leaves with another anion: ketoanions in DKA, hippurate in toluene inhalation, D-lactate, penicillins, or when urine Na⁺ is under about 20 mmol/L.</p>
<div class="eq">Calculated U-osm = 2 × (U-Na + U-K) + U-urea + U-glucose   (all mmol/L)<br>Urine osmolal gap = measured U-osm − calculated U-osm<br>Urine NH₄⁺ ≈ gap ÷ 2</div>
<h3>Reading it in a normal anion gap acidosis</h3>
${tw('<tr><th>Urine osmolal gap</th><th>NH₄⁺ estimate</th><th>Meaning</th></tr><tr><td>&ge; 150 mOsm/kg (often 300–400)</td><td>&ge; 75 mmol/L</td><td>Kidney excreting acid well: look outside the kidney (diarrhoea, saline, toluene)</td></tr><tr><td>&lt; 150 mOsm/kg</td><td>&lt; 75 mmol/L</td><td>Kidney failing to excrete ammonium: distal or type 4 RTA, CKD</td></tr>')}
<h3>Example: the glue sniffer</h3>
<p>Toluene is metabolised to hippuric acid. Hippurate is filtered and excreted quickly with Na⁺ and K⁺, so the gas shows a normal gap acidosis with severe hypokalaemia, and the urine anion gap is positive (looks renal). The urine osmolal gap is high because ammonium excretion is actually brisk: the problem is the hippurate, not the kidney.</p>
<p>Units: if urea and glucose are reported in mg/dL, divide BUN by 2.8 and glucose by 18.</p>`,
keys:[['U-osm gap','measured − (2(Na+K) + urea + glucose)'],['NH₄⁺','≈ gap ÷ 2'],['Renal cause','gap < 150']],
hook:'When the anion gap of the urine is confused by an extra anion, count the osmoles instead.',
q:[['NAGMA after glue sniffing; urine AG +20, urine osmolal gap 260. Interpretation?',['Distal RTA','Brisk ammonium excretion with hippurate in the urine','Type 4 RTA','Lab error'],1,'NH₄⁺ ≈ 130 mmol/L: the kidney is working. Hippurate makes the urine AG falsely positive.'],
['When is the urine anion gap least reliable?',['Diarrhoea with urine Na 60','Ketoacidosis or urine Na below 20','Saline infusion','Hypokalaemia'],1,'Other anions (ketones) or very low urine sodium break the chloride-for-ammonium assumption.']]});

lesson({id:'traps',m:'samp',t:'Analyser traps: low gaps, odd chloride and mixed sources',
sum:'A gap that is too low or a value that does not fit is usually the measurement, not the patient. Know the five classic traps.',
body:`${tw('<tr><th>Trap</th><th>What you see</th><th>Why</th></tr><tr><td>Gas HCO₃⁻ mixed with lab total CO₂</td><td>AG off by 1–3; Henderson check fails</td><td>Lab total CO₂ runs ≈ 1–2 above calculated HCO₃⁻; timing differs. Use one source for Na, Cl and HCO₃⁻.</td></tr><tr><td>Hypoalbuminaemia</td><td>"Normal" gap hiding an acidosis</td><td>Albumin is most of the normal gap. Correct: + 2.5 per 10 g/L below 40.</td></tr><tr><td>IgG myeloma</td><td>Low or near-zero gap</td><td>Cationic paraprotein is an unmeasured cation.</td></tr><tr><td>Bromide (and iodide) exposure</td><td>Very high "chloride", low or negative gap</td><td>Many chloride electrodes read bromide as chloride.</td></tr><tr><td>Lithium toxicity, severe hypercalcaemia or hypermagnesaemia</td><td>Low gap</td><td>Extra unmeasured cations.</td></tr><tr><td>Severe hypertriglyceridaemia or hyperproteinaemia</td><td>Low Na on the main lab, normal on the gas</td><td>Indirect ion-selective electrodes (diluted sample) give pseudohyponatraemia; the gas machine uses direct ISE.</td></tr><tr><td>Tourniquet, fist clenching, haemolysis</td><td>High K⁺ and lactate</td><td>Local muscle work and red-cell lysis.</td></tr><tr><td>Delay, air bubble, liquid heparin</td><td>See "Pre-analytical errors"</td><td>Living cells, room air, dilution.</td></tr>')}
<h3>A low anion gap is a clue</h3>
<p>Under about 4 (on a reference of 12), think albumin first, then a paraprotein, then bromide or lithium, then laboratory error. Recheck before interpreting the rest of the gas.</p>
<h3>Two gases that disagree</h3>
<p>If the same patient's gas and lab chemistry give different sodium values, believe the gas machine in lipaemic or very high-protein samples, and repeat both if neither fits the clinical picture.</p>`,
keys:[['Low AG first thought','Albumin'],['Bromide','False high Cl, low AG'],['Lipaemia','Main lab Na falsely low']],
hook:'A gap near zero is a puzzle about the measurement before it is a puzzle about the patient.',
q:[['AG 1 in a patient with back pain, anaemia and high total protein. Likely?',['Bromide','IgG myeloma','Lactic acidosis','Diarrhoea'],1,'A cationic IgG paraprotein lowers the gap.'],
['A patient on an old bromide-containing sedative has Cl 128 and AG −4. Explanation?',['True hyperchloraemia','Bromide read as chloride','Lithium','Air bubble'],1,'Chloride electrodes often count bromide.']]});

lesson({id:'rhabdo',m:'clin',t:'Rhabdomyolysis',ex:{pH:7.30,pco2:30,hco3:14.2,po2:98,fio2:.21,na:139,cl:101,alb:42,lac:3.1,k:6.0,age:28},
sum:'Muscle breakdown releases potassium, phosphate, urate and organic acids. Expect hyperkalaemia, a high-gap acidosis and AKI. Fluids early; watch the ECG.',
body:`<p>Causes in your practice: exertional (labourers in heat, new recruits, gym novices), crush and prolonged lying after a fall, seizures, drugs (statins with interacting drugs, cocaine, amphetamines), hypokalaemia and hypophosphataemia themselves, and severe infection.</p>
<h3>The gas and chemistry</h3>
<ul><li><b>High anion gap metabolic acidosis</b>: phosphate, urate, organic acids, lactate if muscles are ischaemic, and AKI later.</li>
<li><b>Hyperkalaemia</b>, often early and dangerous. Check the ECG and a gas K⁺ straight away.</li>
<li><b>Hypocalcaemia</b> early (calcium deposits in damaged muscle), then rebound hypercalcaemia during recovery. Do not treat asymptomatic early hypocalcaemia; calcium can deposit further.</li>
<li><b>CK</b> usually more than 5× normal; above about 5,000 U/L the AKI risk rises. Urine dipstick positive for blood with no red cells on microscopy suggests myoglobin.</li></ul>
<h3>Treatment that the gas guides</h3>
<ul><li>Early, generous isotonic crystalloid, aiming for a high urine output (often quoted as about 200–300 mL/h in adults) while watching for overload.</li>
<li>Treat hyperkalaemia as usual (calcium for ECG changes, insulin–glucose, salbutamol). Dialysis for refractory hyperkalaemia, acidosis or overload.</li>
<li>Bicarbonate and mannitol have not been shown to improve outcomes and are not routine.</li>
<li>Compartment syndrome after crush: measure pressures or call surgery; a rising lactate and K⁺ can be the clue.</li></ul>
<p>Exertional heat stroke and rhabdomyolysis often come together: see the heat lesson.</p>`,
keys:[['CK','> 5× ULN; AKI risk ↑ above ~5,000'],['Early Ca²⁺','Low: do not treat unless symptomatic'],['Dangerous','Hyperkalaemia']],
hook:'Broken muscle leaks the inside of the cell: potassium, phosphate and acid.',
q:[['Labourer after a long shift: CK 48,000, K⁺ 6.4, peaked T waves. First step?',['Bicarbonate infusion','IV calcium, then shift K⁺ and give fluids','Mannitol','Wait for the CK to fall'],1,'Stabilise the myocardium first; fluids and potassium shifting follow.'],
['Ionised calcium 0.95 in early rhabdomyolysis, no tetany, normal QT. Replace?',['Yes, always','No: treat only if symptomatic or for hyperkalaemia','Only with bicarbonate','Give vitamin D'],1,'Calcium deposits in damaged muscle and rebounds later.']]});

lesson({id:'etoh',m:'clin',t:'Alcohol, withdrawal and refeeding',
sum:'Alcohol can give three disorders at once: ketoacidosis, alkalosis from vomiting and a respiratory alkalosis from withdrawal. Feeding then drops phosphate, potassium and magnesium.',
body:`<h3>On arrival</h3>
<ul><li><b>Alcoholic ketoacidosis</b> after a binge and days of not eating: HAGMA with normal or low glucose; blood BHB high (urine strips under-read it).</li>
<li><b>Vomiting</b>: metabolic alkalosis that hides the ketoacidosis (Δ ratio above 2).</li>
<li><b>Withdrawal</b> (6–72 h after the last drink), pain, sepsis or liver disease drive breathing: respiratory alkalosis.</li>
<li>A triple disorder is common. The pH can look nearly normal while the patient is very unwell.</li>
<li>Also check the osmolar gap: ethanol raises it (about 1 mOsm per 4.6 mg/dL), and toxic alcohols hide in drinkers.</li></ul>
<h3>Treatment</h3>
<p>Thiamine before glucose, then dextrose-containing fluids; ketoacidosis settles with glucose and fluid, usually without insulin. Replace potassium and magnesium.</p>
<h3>Refeeding</h3>
<p>Feeding (oral, enteral or IV glucose) after starvation releases insulin, which drives phosphate, potassium and magnesium into cells. Hypophosphataemia can cause muscle weakness, respiratory failure (including failure to wean), haemolysis, arrhythmia and confusion.</p>
<ul><li>High risk (NICE CG32): BMI under 16, little or no intake for more than 10 days, unintentional weight loss above 15% in 3–6 months, or low K/PO₄/Mg before feeding; alcohol misuse adds risk.</li>
<li>Start low (as little as 10 kcal/kg/day in the highest risk), give thiamine and vitamins first, check phosphate, potassium and magnesium daily for the first days.</li></ul>`,
keys:[['AKA glucose','Normal or low'],['Give first','Thiamine'],['Refeeding falls','PO₄ · K · Mg']],
hook:'Starve, drink, vomit, breathe fast: four processes, one nearly normal pH.',
q:[['Heavy drinker, vomiting for 3 days: pH 7.41, HCO₃⁻ 22, PCO₂ 34, AG 26. Read?',['Normal','HAGMA + metabolic alkalosis (+ respiratory alkalosis)','Pure respiratory alkalosis','NAGMA'],1,'The high gap with an almost normal bicarbonate means an alkalosis is hiding it; the low PCO₂ adds a respiratory alkalosis.'],
['Day 3 of feeding a malnourished patient: weakness, phosphate 0.3 mmol/L. Mechanism?',['Renal loss','Insulin-driven intracellular shift (refeeding)','Lab error','Vitamin D excess'],1,'Insulin moves phosphate into cells as metabolism restarts.']]});

lesson({id:'drugacid',m:'clin',t:'Drugs that make acid',
sum:'Metformin with AKI, propofol, salbutamol, linezolid, paracetamol (5-oxoproline), acetazolamide and topiramate, and toluene: know which gas each gives.',
body:`${tw('<tr><th>Drug</th><th>Gas</th><th>Key point</th></tr><tr><td>Metformin (with AKI, sepsis, overdose)</td><td>Severe lactic HAGMA</td><td>Metformin-associated lactic acidosis. EXTRIP 2015: dialysis if lactate &gt; 20, pH ≤ 7.0, shock, falling consciousness or failure of standard care.</td></tr><tr><td>Propofol (high dose, &gt; 48 h)</td><td>Lactic HAGMA</td><td>Propofol infusion syndrome: also rhabdomyolysis, hyperkalaemia, high triglycerides, Brugada-like ECG, heart failure. Stop the infusion.</td></tr><tr><td>Salbutamol, adrenaline</td><td>Raised lactate</td><td>β₂-driven aerobic glycolysis; perfusion usually fine.</td></tr><tr><td>Linezolid, older NRTIs</td><td>Lactic HAGMA</td><td>Mitochondrial toxicity, usually after prolonged use.</td></tr><tr><td>Paracetamol (chronic, malnourished)</td><td>HAGMA, normal lactate</td><td>5-oxoproline from glutathione depletion.</td></tr><tr><td>Acetazolamide, topiramate</td><td>NAGMA</td><td>Carbonic anhydrase inhibition; topiramate also causes kidney stones.</td></tr><tr><td>Toluene (glue, paint thinners)</td><td>NAGMA with very low K⁺</td><td>Hippurate excreted in urine; urine AG misleading, use the urine osmolal gap.</td></tr><tr><td>Salicylate</td><td>HAGMA + respiratory alkalosis</td><td>See its own lesson.</td></tr><tr><td>Saline (large volumes)</td><td>NAGMA</td><td>Strong ion difference of zero.</td></tr><tr><td>Loop and thiazide diuretics</td><td>Metabolic alkalosis</td><td>Volume, chloride and potassium loss.</td></tr>')}
<p>Ask about every drug, including over-the-counter and work exposures (solvents, glues), whenever an acidosis has no obvious cause.</p>`,
keys:[['MALA dialysis','lactate > 20 or pH ≤ 7.0 (EXTRIP 2015)'],['Toluene','NAGMA + very low K⁺'],['Topiramate','NAGMA']],
hook:'An unexplained acidosis is a drug history you have not taken yet.',
q:[['ICU patient on propofol 5 mg/kg/h for 4 days: new lactate 8, K⁺ 6.2, triglycerides high. Action?',['Increase propofol','Stop propofol: propofol infusion syndrome','Give bicarbonate only','Start metformin'],1,'Stop the infusion and support; consider ECMO or dialysis if severe.'],
['Migraine patient on topiramate: HCO₃⁻ 18, AG 10. Type?',['HAGMA','NAGMA from carbonic anhydrase inhibition','Respiratory acidosis','Lab error'],1,'Topiramate weakly inhibits carbonic anhydrase.']]});

lesson({id:'gib',m:'clin',t:'GI bleeding and massive transfusion',
sum:'Shock gives a lactic acidosis; the urea rises from digested blood. Massive transfusion adds citrate: low ionised calcium early and metabolic alkalosis later.',
body:`<h3>The bleeding patient</h3>
<ul><li><b>Lactate</b> and base deficit mark hypoperfusion before the haemoglobin falls; the Hb lags for hours.</li>
<li><b>Urea</b> rises out of proportion to creatinine in upper GI bleeding (digested blood plus hypovolaemia).</li>
<li>Trend the lactate: clearance follows successful resuscitation.</li></ul>
<h3>Massive transfusion</h3>
<ul><li><b>Ionised calcium</b> falls as citrate binds it, worse with liver failure (slower citrate metabolism). Check iCa²⁺ on the gas and replace (calcium chloride or gluconate) during massive transfusion.</li>
<li><b>Potassium</b> can rise from stored red cells.</li>
<li><b>Metabolic alkalosis</b> appears a day or two later as citrate is metabolised to bicarbonate.</li>
<li>Acidosis, hypothermia and coagulopathy (the lethal triad, with hypocalcaemia often added as a fourth) feed each other: warm everything, give blood products early in balanced ratios, use tranexamic acid in trauma within 3 hours (not routinely in GI bleeding).</li></ul>`,
keys:[['Early marker','Lactate / base deficit'],['Citrate','↓ iCa²⁺ early, alkalosis later'],['TXA','Trauma ≤ 3 h; not routine in GI bleed']],
hook:'Bleeding shows on the gas before it shows on the haemoglobin.',
q:[['During massive transfusion iCa²⁺ is 0.82 mmol/L. Mechanism?',['Dilution only','Citrate binding calcium','Hyperkalaemia','Alkalosis from vomiting'],1,'Citrate chelates calcium; liver dysfunction slows its clearance.'],
['Two days after a massive transfusion: HCO₃⁻ 33, no vomiting, no diuretics. Likely?',['Laboratory error','Citrate metabolised to bicarbonate','Respiratory acidosis','Type 4 RTA'],1,'Each unit carries citrate that the liver turns into bicarbonate.']]});

lesson({id:'kids',m:'clin',t:'Children: what is different',
sum:'Same rules, different traps: gastroenteritis with ketosis, saline hyperchloraemia, pyloric stenosis, and paediatric DKA with cerebral oedema.',
body:`<ul><li><b>Normal values</b> are broadly the adult ones beyond infancy; newborns and young infants run a slightly lower bicarbonate (around 20–22). Capillary gases are common: fine for pH and PCO₂, not for PO₂.</li>
<li><b>Gastroenteritis</b>: stool bicarbonate loss gives NAGMA; poor intake adds starvation ketosis (children become ketotic quickly), so a mixed gap is common. Oral rehydration first.</li>
<li><b>Big saline resuscitation</b>: hyperchloraemic acidosis can look like ongoing shock. Check the chloride and the lactate before giving more fluid.</li>
<li><b>Pyloric stenosis</b> (2–8 weeks old, projectile non-bilious vomiting): hypochloraemic, hypokalaemic metabolic alkalosis. The alkalosis and chloride are corrected with fluids and potassium before surgery because alkalosis raises the risk of postoperative apnoea.</li>
<li><b>Paediatric DKA</b>: cerebral oedema is the main killer. Fluids are calculated carefully, insulin infusion (often 0.05–0.1 units/kg/h) starts after initial fluids, and bicarbonate is avoided. Headache, falling GCS, bradycardia or rising BP during treatment → treat cerebral oedema at once (mannitol or hypertonic saline).</li>
<li><b>Inborn errors</b>: an unexplained high gap with hypoglycaemia or hyperammonaemia in a sick infant needs specialist input.</li></ul>`,
keys:[['Infant HCO₃⁻','≈ 20–22'],['Pyloric stenosis','↓Cl ↓K metabolic alkalosis'],['Paediatric DKA killer','Cerebral oedema']],
hook:'Children run the same chemistry faster: they get ketotic, alkalotic and oedematous sooner.',
q:[['Six-week-old with projectile vomiting: pH 7.52, HCO₃⁻ 34, Cl 88, K 3.0. Before theatre?',['Operate now','Correct fluids, chloride and potassium first','Give acetazolamide','Give bicarbonate'],1,'Alkalosis increases the risk of postoperative apnoea.'],
['Child in DKA treatment develops headache and bradycardia. Next?',['More insulin','Treat cerebral oedema now (mannitol or hypertonic saline)','Bicarbonate','Stop fluids and wait'],1,'Cerebral oedema is the leading cause of death in paediatric DKA.']]});

lesson({id:'tc-radial',m:'samp',t:'Technique clinic: the radial puncture, step by step',
sum:'Eight steps, each with the reason behind it, the usual error and how to rescue it. Most failed or misleading gases come from steps 2, 5 and 6.',
body:`<p>Treat this as a checklist you rehearse before your hands are shaking. Each step has a <b>why</b> so that you can adapt when the patient does not look like the textbook.</p>
${tw('<tr><th>#</th><th>Do</th><th>Why</th><th>Common error → rescue</th></tr><tr><td>1</td><td>Check indication, anticoagulation, the other wrist and the FiO₂ or device</td><td>An unreadable gas (no FiO₂) is wasted pain</td><td>Forgetting FiO₂ → write it on the syringe now</td></tr><tr><td>2</td><td>Wrist extended about 30° over a rolled towel, hand relaxed</td><td>Brings the artery close to the skin and steadies it</td><td>Over-extension flattens the pulse → ease back until it is strongest</td></tr><tr><td>3</td><td>Palpate with two fingers 1–2 cm above the crease, mark the line of the artery</td><td>The artery runs straight; you want to enter along it</td><td>Palpating with the thumb (it has its own pulse) → use index and middle</td></tr><tr><td>4</td><td>Clean the skin; consider 0.25–0.5 mL of 1% lidocaine</td><td>Local anaesthetic reduces pain without making the stick harder</td><td>Skipping it in a conscious patient → offer it</td></tr><tr><td>5</td><td>Needle at 30–45°, bevel up, advance slowly towards the pulse</td><td>Bevel up gives a clean entry; a slow advance lets you feel the wall</td><td>Going too steep and through the back wall → withdraw slowly until the flash appears</td></tr><tr><td>6</td><td>Let the pulse fill the syringe (1–2 mL); do not pull the plunger</td><td>Pulsatile self-filling confirms an artery; pulling draws venous blood and air</td><td>Dark, non-pulsatile blood → vein; stop and repeat</td></tr><tr><td>7</td><td>Needle out, pressure for at least 5 minutes (longer on anticoagulants), then expel air, cap and roll the syringe</td><td>Prevents haematoma; air and delay corrupt the gas</td><td>Releasing pressure early to check → hold, do not peek</td></tr><tr><td>8</td><td>Label with name, time, FiO₂, temperature and site; analyse within 30 minutes</td><td>The gas is only as good as the context attached to it</td><td>Leaving the sample on a desk → run it now or repeat it</td></tr>')}
<h3>When not to puncture the radial artery</h3>
<ul><li>Infection, burn or skin lesion over the site, or no palpable pulse.</li>
<li>A limb with a dialysis fistula or vascular graft.</li>
<li>Severe peripheral vascular disease or an ischaemic hand. Pick another site.</li>
<li>Bleeding disorders and anticoagulation are not absolute bars. Choose a compressible site, use the smallest needle and press for longer.</li></ul>
<h3>If you miss</h3>
<p>Pull back to just under the skin and redirect without leaving the artery's line. After two misses, change wrist or ask a colleague. Repeated probing hurts and causes haematoma.</p>`,
keys:[['Angle','30–45°, bevel up'],['Syringe','Fills by the pulse, no pulling'],['Pressure','≥ 5 min (longer if anticoagulated)'],['Label','FiO₂, time, temperature, site']],
hook:'Pulse fills the syringe, pressure for five minutes, FiO₂ on the label.',
q:[['Dark blood fills the syringe slowly and only when you pull the plunger. What does that suggest?',['A clean arterial sample','Venous blood, not arterial','A very high PaCO₂','A syringe with too much heparin'],1,'An arterial sample is bright, pulsatile and self-filling. Pulling and dark colour point to a vein.'],
['After the needle is withdrawn, what is the right next action?',['Press firmly for 5 minutes or more','Press for 30 seconds, then look','Apply a light dressing and go','Ask the patient to flex the wrist for a while'],0,'Short pressure is the commonest cause of haematoma.'],
['Which patient needs a different site rather than a radial attempt?',['An anxious patient on a monitor','A limb with a dialysis fistula','A patient breathing room air','A patient with a high fever'],1,'Never puncture a fistula or graft limb.']]});

lesson({id:'tc-allen',m:'samp',t:'Technique clinic: the Allen test and collateral flow',
sum:'How to do the modified Allen test, how to read it, and why it is a quick check rather than a guarantee.',
body:`<h3>The modified Allen test</h3>
<ol><li>Patient clenches the fist for about 30 seconds while you press on both the radial and ulnar arteries.</li>
<li>Open the hand. It should be pale.</li>
<li>Release the <b>ulnar</b> artery only and time the return of colour to the whole palm and thumb.</li></ol>
${tw('<tr><th>Colour returns in</th><th>Reading</th></tr><tr><td>Under about 5–7 seconds</td><td>Ulnar supply is adequate</td></tr><tr><td>8–14 seconds</td><td>Equivocal</td></tr><tr><td>Over about 15 seconds</td><td>Ulnar supply poor: avoid that radial artery</td></tr>')}
<h3>What the evidence says</h3>
<ul><li>The test is subjective: results vary by examiner, skin tone, room temperature and how hard the patient clenches.</li>
<li>It has not been shown to predict hand ischaemia after radial puncture, and ischaemic complications are very rare either way. Some guidelines still recommend it, others do not.</li>
<li>More objective options exist: a pulse oximeter or Doppler on the thumb while the radial artery is compressed (the Barbeau test).</li></ul>
<h3>How to use it</h3>
<p>Use it as a quick screen that takes under a minute, not as permission or as a veto. A clearly abnormal result is a reason to choose the other wrist, or another site. A normal one does not remove the need for the usual care: one attempt at a time, pressure afterwards, and a look at the hand if the patient complains of pain or numbness.</p>
<h3>Red flags after puncture</h3>
<p>Persistent pain, a cold, pale or numb hand, or a growing swelling at the wrist need review at once. They can mean haematoma, spasm or arterial occlusion.</p>`,
keys:[['Release','Ulnar artery only'],['Abnormal','Colour back in over ~15 s'],['Evidence','Poor predictor of ischaemia']],
hook:'Allen test: a quick screen, not a promise.',
q:[['In the modified Allen test, which artery is released first?',['The radial artery','The ulnar artery','The brachial artery above it','Both arteries together at once'],1,'You are testing whether the ulnar artery can supply the whole hand.'],
['How should the Allen test be used?',['A quick screen that helps pick the site','Proof that ischaemia can never happen','A full substitute for pressure afterwards','A test that is used only in small children'],0,'It is subjective and a weak predictor, so it informs the choice and never replaces care.'],
['After a radial gas the hand becomes cold, pale and numb. What now?',['Reassure and watch the hand','Urgent review for arterial compromise','Give another dose of heparin now','Repeat the puncture on the same wrist'],1,'Treat it as possible occlusion until proven otherwise.']]});

lesson({id:'tc-venous',m:'samp',t:'Technique clinic: getting a good venous or capillary gas',
sum:'When a vein will do, how to draw it without distorting the numbers, and when an earlobe sample is worth it.',
body:`<h3>Choose the sample for the question</h3>
${tw('<tr><th>You want to know</th><th>Sample</th></tr><tr><td>Is the patient acidotic? Lactate, K⁺, glucose</td><td>Peripheral venous is enough</td></tr><tr><td>Is the patient hypercapnic?</td><td>Venous screens it out (normal PCO₂ is reassuring); abnormal or doubtful → arterial</td></tr><tr><td>Is oxygenation the problem?</td><td>Arterial with FiO₂ (or pulse oximetry first)</td></tr><tr><td>Repeated gases in a stable COPD or child</td><td>Arterialised capillary (earlobe), warmed and free-flowing</td></tr>')}
<h3>Drawing a venous gas well</h3>
<ul><li>Use a heparinised gas syringe. A tourniquet for more than a minute and a clenched fist push up lactate and potassium and lower pH, so release it before or soon after puncture.</li>
<li>Avoid the arm with an infusion running. Fluids dilute the sample.</li>
<li>Sample at the time of cannulation when you can, free-flowing, without pulling hard.</li>
<li>Expel air, cap, label as <b>venous</b>, and note the site. A venous sample labelled arterial is a classic trap.</li></ul>
<h3>Remember the offsets</h3>
<p>Compared with arterial: pH about 0.03 lower, PCO₂ about 5 mmHg higher, HCO₃⁻ about 1 mmol/L higher. Use the Labs → venous to arterial tool and keep the scatter in mind. A venous value is a screen, not a substitute, when the number sits near a decision line.</p>
<h3>Earlobe (arterialised capillary)</h3>
<ul><li>Warm the lobe or apply vasodilator cream for about 10 minutes so that blood is arterialised.</li>
<li>Free flow into a capillary tube. Squeezing mixes in tissue fluid and distorts the values.</li>
<li>Reliable for pH and PCO₂; treat PO₂ with caution.</li></ul>`,
keys:[['Tourniquet','Under 1 min, release early'],['Venous vs arterial','pH −0.03 · PCO₂ +5 · HCO₃⁻ +1'],['Earlobe','Warm, free-flowing, PO₂ unreliable']],
hook:'A vein answers acid-base; only an artery answers oxygen.',
q:[['Which question can a peripheral venous gas answer reliably?',['The PaO₂ in a shocked patient','pH and lactate levels','The A–a gradient of the patient','The shunt fraction in the lungs'],1,'Venous pH and lactate track arterial values closely.'],
['What does a long tourniquet and fist clenching do to a venous sample?',['Lowers the lactate by dilution','Raises lactate and K⁺, lowers pH','Raises the pH and the glucose','Changes nothing that you can measure'],1,'Local stasis and muscle work change the sample.'],
['An earlobe sample is squeezed hard to get enough blood. What is the effect?',['No effect on any value','Tissue fluid distorts the values','PO₂ rises falsely and only that','Only the glucose changes'],1,'Free flow is essential for capillary gases.']]});

lesson({id:'tc-bubbles',m:'samp',t:'Technique clinic: bubbles, heparin and delay, with drills',
sum:'What to do in the first minute after the draw, and the quick checks that tell you the sample cannot be trusted.',
body:`<h3>The first minute</h3>
<ol><li><b>Expel the air at once</b>: hold the syringe upright, tap, push the bubbles out and cap it.</li>
<li><b>Mix by rolling</b> the syringe between the palms and inverting a few times. Do not shake it.</li>
<li><b>Label</b> and send, or run it yourself.</li></ol>
<h3>Why a bubble matters</h3>
<p>Room air has a PO₂ of about 150 mmHg and almost no CO₂. A bubble in the syringe drags the sample's PO₂ towards 150 and its PCO₂ downwards. A patient with a PaO₂ of 60 looks better; one on high-flow oxygen with a PaO₂ of 400 looks worse. The longer it sits and the bigger the bubble, the larger the error.</p>
<h3>Heparin and delay</h3>
<ul><li>Use dry or balanced heparin and fill the syringe. Leaving a lot of liquid heparin dilutes the sample: PCO₂ and HCO₃⁻ fall and calcium binds.</li>
<li>Cells keep working in the syringe: PO₂ falls, PCO₂ and lactate rise, pH and glucose fall. Plastic at room temperature is fine for about 30 minutes. Longer than that, run a fresh sample.</li></ul>
<h3>Four drills</h3>
${tw('<tr><th>You see</th><th>Think</th><th>Do</th></tr><tr><td>PaO₂ 36, SO₂ 68%, SpO₂ 97%</td><td>Venous blood in an arterial syringe</td><td>Repeat from an artery</td></tr><tr><td>PaO₂ 140 on room air, PCO₂ 12 in a well patient</td><td>Air bubble</td><td>Repeat, expel air at once</td></tr><tr><td>Lactate 9 in a bright, well patient; sample 2 hours old</td><td>Delay</td><td>Repeat and run it within 30 minutes</td></tr><tr><td>K⁺ 7.4, no ECG changes, difficult draw</td><td>Haemolysis</td><td>Repeat before treating</td></tr>')}
<p>The rule behind all four: when the numbers and the patient disagree, believe the patient and repeat the sample.</p>`,
keys:[['Air','PO₂ → ~150, PCO₂ ↓'],['Delay','PO₂ ↓, PCO₂ ↑, lactate ↑'],['Window','~30 min in plastic at room temperature']],
hook:'Bubbles out, roll never shake, run it inside half an hour.',
q:[['A well patient on room air has a "PaO₂ 142, PCO₂ 12". Most likely?',['Excellent gas exchange','An air bubble in the syringe','Simple hyperventilation in a calm patient','Methaemoglobinaemia that is present'],1,'A PO₂ near 150 with a very low PCO₂ is the bubble signature.'],
['A sample sits for two hours. What happens?',['Lactate falls steadily as cells rest','PO₂ rises over time in the syringe','Lactate and PCO₂ up, PO₂ and pH down','The pH climbs slowly with glucose'],2,'Cells keep metabolising in the syringe.'],
['Why roll the syringe instead of shaking it?',['To warm the sample up slowly','Shaking can haemolyse and add air','Rolling removes the lactate first','Rolling raises the pH slightly at once'],1,'Gentle mixing keeps cells intact and prevents bubbles.']]});

function reflexStatus(){const h=S.reflex.hist;let best=0;for(const lv of [1,2,3,4]){const a=h.filter(x=>x.l===lv).slice(-20);if(a.length>=20){const acc=a.filter(x=>x.ok).length/20,med=median(a.map(x=>x.t));if(acc>=0.9&&med<=8000)best=lv;}}return best;}

function MODS_META(m,w,mist,rb){if(m==='today')return dueKinds().length?dueKinds().length+' due · '+S.sessLen+' gases':S.sessLen+' gases';if(m==='steps'||m==='quick')return S.sessLen+' gases · '+LVLS[S.lvl-1][1];if(m==='fit')return S.sessLen+' patients';if(m==='reflex')return '20 gases · '+(rb?'automatic to L'+rb:'level '+(S.reflex.lvl||1));if(m==='gym')return '10 sums'+(stepAcc('comp')!=null?' · compensation '+Math.round(stepAcc('comp')*100)+'%':'');return mist+' saved';}

/* ---------- case generation helpers ---------- */
function safeCase(kind,lvl,opt){for(let i=0;i<4;i++){const c=genCase(kind,lvl,opt);if(c)return c;}
 for(let i=0;i<20;i++){const c=genCase(pick(kindsFor(lvl)),lvl,{strict:opt&&opt.strict});if(c)return c;}
 const r=REFCASES[1];const c=Object.assign({kind:'hagma',cause:'dka',vig:'Young adult with diabetes, vomiting and deep breathing',fio2:0.21,po2:100,age:30,k:4.5,lac:1.2,glu:22},r.i);c.o=interp(c);c.label=buildLabel(c.o.r,lvl);return c;}
function chooseKind(sess){const ks=kindsFor(sess.lvl);const used=sess.res.map(r=>r.kind);const last=used[used.length-1];
 if(sess.kind&&KINDS[sess.kind])return sess.kind;
 if(sess.mode==='due'){const due=dueKinds().filter(k=>!used.includes(k));if(due.length)return pick(due);}
 if(sess.mode==='today'){const due=dueKinds().filter(k=>ks.includes(k)&&!used.includes(k));if(due.length&&Math.random()<0.75)return pick(due);}
 const pool=ks.filter(k=>k!==last);const wts=pool.map(k=>{const s=S.kinds[k];return (s&&s.n?1+(1-s.c/s.n)*3:2)*(used.includes(k)?0.4:1);});
 let t=Math.random()*wts.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){t-=wts[i];if(t<=0)return pool[i];}return pool[0]||ks[0];}

/* ---------- question builders ---------- */
const PRIMOPT={mac:'Metabolic acidosis',malk:'Metabolic alkalosis',rac:'Respiratory acidosis',ralk:'Respiratory alkalosis',two:'Two primary processes',none:'No primary disturbance'};
const COMPOPT={met:{ok:'Appropriate compensation',rac:'PCO₂ too high → added respiratory acidosis',ralk:'PCO₂ too low → added respiratory alkalosis'},
 rac:{a:'Acute',ac:'Acute-on-chronic (or 1–2 days old)',c:'Chronic, renally compensated',mac:'HCO₃⁻ too low → added metabolic acidosis',malk:'HCO₃⁻ too high → added metabolic alkalosis'},
 ralk:{a:'Acute',p:'Partly compensated (hours to 2 days)',c:'Chronic, renally compensated',malk:'HCO₃⁻ too high → added metabolic alkalosis',mac:'HCO₃⁻ too low → added metabolic acidosis'}};
const DELTAOPT=['< 0.4 · normal-gap acidosis dominates','0.4–0.8 · HAGMA + NAGMA','0.8–2 · pure HAGMA','> 2 · HAGMA + metabolic alkalosis'];
const VENOX='Cannot assess: venous PO₂ says nothing about the lungs';
const REALOPT=['Yes: the numbers fit together','No: recheck before interpreting'];
const deltaBand=d=>d<0.4?0:d<0.8?1:d<=2?2:3;
function gapWhy(c,o){const ar=S.agref||12;return 'AG = '+c.na+' − ('+c.cl+' + '+r1(o.est.hco3)+') = '+r1(o.ag)+(c.alb!=null&&c.alb!==40?'. Albumin '+c.alb+' g/L: '+(0.25*(40-c.alb)>=0?'+ ':'− ')+Math.abs(r1(0.25*(40-c.alb)))+' → corrected '+r1(o.agc):'')+'. Reference ≈ '+ar+', so '+(o.agHigh?'high (above '+(ar+2)+').':'normal.')+(o.ven?' (Estimated arterial HCO₃⁻ used; venous runs ≈ 1 higher.)':'');}
function hintFor(cat,c){const o=c.o,ar=S.agref||12;switch(cat){
 case 'real':return '[H⁺] = 24 × PCO₂ ÷ HCO₃⁻ should be close to 80 − the pH decimals (for pH 7.20–7.50).';
 case 'ph':return 'Acidaemia below 7.35, alkalaemia above 7.45.'+(o.ven?' Venous pH runs ≈ 0.03 below arterial.':'');
 case 'prim':return 'Normal PCO₂ 35–45 mmHg, HCO₃⁻ 22–26. The value that moved in the direction of the pH is the primary process; if both did, there are two.';
 case 'comp':return o.primKey==='mac'?'Winter\'s: expected PCO₂ = 1.5 × HCO₃⁻ + 8 ± 2.':o.primKey==='malk'?'Expected PCO₂ = 0.7 × HCO₃⁻ + 20 ± 5.':o.primKey==='rac'?'For every 10 mmHg above 40: HCO₃⁻ +1 acute, +4 chronic (± 2).':'For every 10 mmHg below 40: HCO₃⁻ −2 acute, −5 chronic (± 2).';
 case 'gap':return 'AG = Na⁺ − (Cl⁻ + HCO₃⁻). Add 2.5 for every 10 g/L of albumin below 40. High if above '+(ar+2)+'.';
 case 'delta':return '(AG − '+ar+') ÷ (24 − HCO₃⁻). Under 0.8: an extra normal-gap acidosis. Over 2: an extra metabolic alkalosis.';
 case 'read':return 'Put together every process you found: primary, any failed compensation, the gap type and the Δ ratio.';
 case 'cause':return 'Which history produces exactly this combination?';
 case 'ox':return o.ven?'Look at the sample type before the number.':'Room air: PAO₂ = 0.21 × ('+(S.patm||760)+' − 47) − PaCO₂ ÷ 0.8, and the A–a gradient is normal up to about age ÷ 4 + 4. On oxygen: P/F = PaO₂ ÷ FiO₂.';
 case 'whatif':return 'Acutely, HCO₃⁻ moves only ≈ 1 per 10 mmHg of PCO₂. Then pH = 6.1 + log(HCO₃⁻ ÷ (0.03 × PCO₂)).';}
 return '';}
function realQ(c,consistent){return {cat:'real',t:'Is this gas internally consistent?',opts:REALOPT,a:REALOPT[consistent?0:1],why:c.o.steps.find(s=>s.k==='real').d};}
function buildQs(c,lvl,mode){const o=c.o,qs=[];const est=o.est;
 if(mode==='steps'){
  const ps=phState(est.pH);qs.push({cat:'ph',t:'pH: acidaemia, alkalaemia or normal?',opts:['Acidaemia','Alkalaemia','Normal pH'],a:ps==='acid'?'Acidaemia':ps==='alk'?'Alkalaemia':'Normal pH',why:o.steps.find(s=>s.k==='ph').d});
  qs.push({cat:'prim',t:'Primary process?',opts:['mac','malk','rac','ralk','two','none'].map(k=>PRIMOPT[k]),a:PRIMOPT[o.primKey],why:o.steps.find(s=>s.k==='sys').d});
  if(['mac','malk','rac','ralk'].includes(o.primKey)){const set=o.primKey==='mac'||o.primKey==='malk'?COMPOPT.met:COMPOPT[o.primKey];qs.push({cat:'comp',t:'Compensation?',opts:Object.values(set),a:set[o.compKey],why:o.steps.find(s=>s.k==='comp').d});}
  if(lvl>=3&&o.agc!=null){qs.push({cat:'gap',t:'Anion gap (corrected for albumin)?',opts:['Normal','High'],a:o.agHigh?'High':'Normal',why:gapWhy(c,o)});
   if(o.delta!=null)qs.push({cat:'delta',t:'Δ ratio?',opts:DELTAOPT,a:DELTAOPT[deltaBand(o.delta)],why:'Δ ratio = (AG − '+(S.agref||12)+') ÷ (24 − HCO₃⁻) = ('+r1(o.agc)+' − '+(S.agref||12)+') ÷ (24 − '+r1(est.hco3)+') = '+o.delta.toFixed(2)+'.'});}}
 const lab=c.label;qs.push({cat:'read',t:mode==='steps'?'So the full read is…':'What is the acid–base read?',opts:shuffle([lab].concat(distract(lab,lvl,4))),a:lab,conf:true,why:'Every process found along the way: '+lab+'.'});
 const same=KINDS[c.kind].v.map(v=>v[0]).filter(x=>x!==c.cause);const others=shuffle(Object.keys(CAUSES).filter(x=>x!==c.cause&&x!=='normal'&&!same.includes(x)));
 const cd=shuffle(same).slice(0,1).concat(others.slice(0,3-Math.min(1,same.length)));
 qs.push({cat:'cause',t:'Most likely cause in this patient?',opts:shuffle([c.cause].concat(cd)).map(x=>CAUSES[x]),a:CAUSES[c.cause],why:'Match the gas to the story: '+CAUSES[c.cause]+'.'});
 if(lvl>=4){const opts=Object.values(OXLAB).concat([VENOX]);
  if(o.ven)qs.push({cat:'ox',t:'And the oxygenation?',opts,a:VENOX,why:'This is a venous sample. A PvO₂ of '+P(c.po2)+' '+PU()+' is normal for venous blood and tells you nothing about gas exchange. Use the SpO₂, or take an ABG if oxygenation matters.'});
  else if(o.ox)qs.push({cat:'ox',t:'And the oxygenation?',opts,a:OXLAB[o.ox.cat],why:o.steps.find(s=>s.k==='ox').d});}
 const wi=whatIf(c);if(wi&&lvl>=2&&mode==='steps')qs.push(wi);
 return qs;}
function whatIf(c){const o=c.o,e=o.est;
 if(o.primKey==='mac'&&e.pco2<34&&Math.random()<0.45){const nh=e.hco3+(40-e.pco2)/10,np=phFrom(nh,40);
  const opts=[np,e.pH,7.40,np-0.12].map(x=>x.toFixed(2));if(new Set(opts).size<4||Math.abs(np-e.pH)<0.06)return null;
  const a=np.toFixed(2);return {cat:'whatif',t:'This patient is sedated for intubation and ventilated at "normal" settings. PCO₂ rises to '+P(40)+' '+PU()+' within minutes. The pH becomes about…',opts:shuffle(opts),a,
   why:'The low PCO₂ was the compensation. Acutely, HCO₃⁻ rises only ≈ 1 per 10 mmHg of CO₂, so HCO₃⁻ ≈ '+r1(nh)+'. pH = 6.1 + log('+r1(nh)+' ÷ (0.03 × 40)) = '+a+'. Ventilate a severely acidotic patient to match the minute ventilation they achieved on their own; a "normal" PCO₂ in metabolic acidosis is a danger sign.'};}
 if(o.primKey==='rac'&&(o.compKey==='c'||o.compKey==='ac')&&Math.random()<0.5){const opts=['A normal gas','Alkalaemia from retained bicarbonate (post-hypercapnic metabolic alkalosis)','Worsening respiratory acidosis','Metabolic acidosis'];
  const nh=e.hco3-(e.pco2-40)/10,np=phFrom(nh,40);
  return {cat:'whatif',t:'This patient is intubated and ventilated down to PCO₂ '+P(40)+' '+PU()+' within an hour. What does the next gas show?',opts:shuffle(opts),a:opts[1],
   why:'The kidneys took days to build HCO₃⁻ '+r1(e.hco3)+' and need days to excrete it. Removing the CO₂ quickly leaves the bicarbonate behind: pH ≈ '+np.toFixed(2)+'. Ventilate known retainers to their usual PCO₂ (or a pH of about 7.35–7.40), not to 40.'};}
 return null;}
function inconsistentCase(lvl){const c=safeCase(pick(kindsFor(lvl)),lvl,{strict:true});const b=Object.assign({},c);delete b.o;
 for(const f of shuffle([1.45,0.65,1.6,0.6])){b.hco3=r1(c.hco3*f);const o=interp(b);if(!o.err&&o.flags.includes('inconsistent')){b.o=o;b.label=c.label;b.bad=true;return b;}}return null;}

/* ---------- session engine ---------- */
let SS=null;
function startSession(mode,opt){opt=opt||{};if(!MODES[mode])mode='today';
 let len=mode==='reflex'?20:mode==='gym'?10:mode==='mist'?Math.min(S.sessLen,(S.mist||[]).length):mode==='gotd'?1:mode==='final'?12:mode==='due'?Math.max(1,Math.min(S.sessLen,dueKinds().length)):S.sessLen;
 let pool=null,deadline=0;
 if(mode==='boss'){const M=MBYID[opt.mod];pool=shuffle(moduleBossPool(opt.mod)).slice(0,10);if(!M||pool.length<4){toast('No boss for this module yet.');return;}len=pool.length;deadline=Date.now()+Math.max(3,Math.ceil(len*0.6))*60000;}
 if(mode==='final')deadline=Date.now()+10*60000;
 if(opt.n)len=opt.n;
 if(mode==='mist'&&!len){toast('No saved mistakes. Nice.');return;}
 if(mode==='due'&&!dueKinds().length&&!opt.round){toast('Nothing due. Here is a mixed session instead.');mode='today';len=S.sessLen;}
 SS={mode,lvl:mode==='reflex'?(S.reflex.lvl||1):mode==='final'||mode==='gotd'?4:S.lvl,n:len,res:[],tally:{},t0:Date.now(),cur:null,timer:0,done:false,mq:mode==='mist'?(S.mist||[]).slice(0,len):null,kind:opt.kind||null,round:!!opt.round,pool,mod:opt.mod||null,deadline};
 if(opt.kind)SS.title='Drill: '+KSHORT[opt.kind];
 go('session');nextItem();
 if(deadline){clearInterval(SS.clock);SS.clock=setInterval(()=>{if(!SS||SS.done){clearInterval(SS&&SS.clock);return;}const left=SS.deadline-Date.now();const t=$('bT');if(t)t.textContent=Math.max(0,Math.floor(left/60000))+':'+String(Math.max(0,Math.floor(left/1000)%60)).padStart(2,'0');if(left<=0){clearInterval(SS.clock);finishSession(true,true);}},500);}}
function leaveSession(){if(SS){clearInterval(SS.timer);SS.timer=0;if(SS.clock&&!SS.done){clearInterval(SS.clock);}}}
RENDER.session=function(){if(!SS){go('practice');return;}if(SS.cur&&!SS.done)drawSession();};
function sessionBar(){const segs=[];for(let i=0;i<SS.n;i++){const r=SS.res[i];segs.push('<i class="'+(r?(r.ok?'k':'x'):(i===SS.res.length?'cur':''))+'"></i>');}
 const ok=SS.res.filter(r=>r.ok).length;
 const title=SS.title||(SS.mode==='boss'?'Boss · '+MBYID[SS.mod].t:MODES[SS.mode].t);
 return '<div class="sbar"><button class="iconbtn" id="sExit" aria-label="End session">'+ic('x')+'</button><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><div class="btnrow" style="justify-content:space-between;gap:6px"><b>'+esc(title)+'</b><span class="stxt">'+Math.min(SS.res.length+1,SS.n)+' / '+SS.n+(SS.mode==='reflex'?' · <span id="rT">0.0</span> s':'')+(SS.deadline?' · ⏱ <span id="bT">'+Math.max(0,Math.floor((SS.deadline-Date.now())/60000))+':'+String(Math.max(0,Math.floor((SS.deadline-Date.now())/1000)%60)).padStart(2,'0')+'</span>':'')+'</span></div><div class="sprog">'+segs.join('')+'</div></div><span class="stxt">'+ok+' ✓</span></div>';}
function nextItem(){if(SS.res.length>=SS.n){finishSession();return;}
 const m=SS.mode;
 if(m==='fit')SS.cur={fit:newFit()};
 else if(m==='gym')SS.cur={g:gymItem(),t0:performance.now()};
 else if(m==='boss'){const b=SS.pool[SS.res.length];const opts=shuffle(b.opts.slice());SS.cur={g:{kind:MBYID[SS.mod].t,q:b.q,opts,a:b.a,why:b.why},t0:performance.now()};}
 else if(m==='final'){const c=safeCase(pick(kindsFor(4)),4,{strict:true});const comp=c.o.steps.find(s=>s.k==='comp');SS.cur={g:{kind:'Full read',q:c.vig,opts:shuffle([c.label].concat(distract(c.label,4,3))),a:c.label,why:comp.v+'. '+comp.d,slip:slip(c,{lv:4})},t0:performance.now()};}
 else if(m==='reflex'){let c=null;for(let i=0;i<8&&!c;i++)c=genCase(pick(kindsFor(SS.lvl)),SS.lvl);if(!c)c=safeCase('hagma',SS.lvl);c._opts=SS.lvl===1?labelPool(1).sort():shuffle([c.label].concat(distract(c.label,SS.lvl,4)));SS.cur={c,stage:0,t0:performance.now(),wait:false};}
 else{let c,q;
  if(m==='mist'){const snap=SS.mq[SS.res.length];c=Object.assign({},snap.c);c.o=interp(c);c.label=snap.label;c._mid=snap.id;q=buildQs(c,snap.lvl,'steps');}
  else if(m==='gotd'){const g=gasOfDay();c=Object.assign({},g);q=withSeed(dayNum(),()=>buildQs(c,4,'steps'));}
  else{const lvl=SS.lvl;const roll=Math.random();
   if((m==='today'||m==='steps')&&lvl>=2&&roll<0.07){c=inconsistentCase(lvl);if(c)q=[realQ(c,false)];}
   if(!c){c=safeCase(chooseKind(SS),lvl,{strict:m!=='quick',ven:m!=='quick'&&Math.random()<0.28});q=buildQs(c,lvl,m==='quick'?'quick':'steps');if((m==='today'||m==='steps')&&lvl>=2&&roll<0.27)q.unshift(realQ(c,true));}}
  SS.cur={c,q,step:0,ans:{},assist:{},auto:{},conf:'think'};}
 drawSession();window.scrollTo(0,0);}
function drawSession(){const host=$('v-session');const m=SS.mode;let body='';
 if(m==='fit')body=fitHTML();else if(m==='gym'||m==='boss'||m==='final')body=gymHTML();else if(m==='reflex')body=reflexHTML();else body=caseHTML();
 host.innerHTML=sessionBar()+body;

function hintMode(cat){if(S.hints==='never')return 'off';if(S.hints==='always')return 'open';const s=(S.steps||{})[cat];if(!s||s.n<4)return 'open';return stepAcc(cat)<0.7?'open':'closed';}
function caseHTML(){const C=SS.cur,c=C.c;const qs=C.q.map((q,i)=>{if(i>C.step)return '';const answered=C.ans[i]!=null,ok=answered&&C.ans[i]===q.a&&!C.assist[i];
  const hm=hintMode(q.cat),h=hintFor(q.cat,c);let hint='';
  if(!answered&&h){if(hm==='open'||C.assist[i]){hint='<div class="hint"><b>Hint</b><span>'+esc(h)+'</span></div>';if(hm==='open')C.auto[i]=1;}else if(hm==='closed')hint='<button class="hintbtn" data-hintq="'+i+'">Show hint (H)</button>';}
  return '<div class="qblock'+(answered?(ok?' done':' miss'):'')+'" data-q="'+i+'"><h3><span class="qn">'+(answered?(ok?'✓':'✗'):(i+1))+'</span>'+q.t+'</h3>'+hint+(q.conf&&!answered?'<div class="conf"><span>How sure?</span><div class="seg">'+['sure','think','guess'].map(x=>'<button data-cf="'+x+'" aria-pressed="'+(C.conf===x)+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div></div>':'')+'<div class="opts'+(answered?' done':'')+'">'+q.opts.map((o,oi)=>{if(answered&&o!==q.a&&o!==C.ans[i])return '';let cl='opt';if(answered){if(o===q.a)cl+=' right';else if(o===C.ans[i])cl+=' wrong';}return '<button class="'+cl+'" data-o="'+oi+'"'+(answered?' disabled':'')+'><kbd>'+(answered&&o===q.a?'✓':answered&&o===C.ans[i]?'✗':oi+1)+'</kbd><span>'+esc(o)+'</span></button>';}).join('')+'</div>'+(answered?'<p class="why '+(ok?'ok':'no')+'"><b>'+(ok?'Right.':C.assist[i]&&C.ans[i]===q.a?'Right, with a hint.':'Answer: '+esc(q.a)+'.')+'</b> '+q.why+'</p>'+(C.ans[i]!==q.a?autopsyHTML(i):''):'')+'</div>';}).join('');
 const finished=Object.keys(C.ans).length===C.q.length;
 return '<div class="dgrid"><div class="card stick" style="display:grid;gap:14px"><div class="btnrow" style="justify-content:space-between"><span class="eyebrow">'+(c.sample==='v'?'Venous sample':'Arterial sample')+'</span>'+(SS.mode==='mist'?'<span class="chip">from your mistakes</span>':'')+'</div><p class="vig">'+esc(c.vig)+'</p>'+slip(c,{lv:SS.mode==='mist'?4:SS.lvl,urea:!!c.osm})+'</div><div class="card" style="display:grid;gap:20px">'+qs+'</div></div>'+(finished?caseFeedback():'');}

 if(!finished&&C.step>0){const cur=host.querySelector('.qblock[data-q="'+C.step+'"]');if(cur&&cur.getBoundingClientRect().bottom>window.innerHeight-40)cur.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'});}
 if(finished){if($('fbMap'))drawMap($('fbMap'),[{ph:C.c.o.est.pH,h:C.c.o.est.hco3,l:C.c.o.ven?'est. arterial':'this gas'}],280);

let ROUND=null;
function roundPlan(){const legs=[];const due=dueKinds().length;
 if(due)legs.push({t:'due',label:'Review '+Math.min(due,4)+' due pattern'+(Math.min(due,4)>1?'s':''),min:5});
 const c=conceptOfDay();legs.push({t:'concept',label:'Concept of the day: '+c[1],min:2,c:c[0]});
 legs.push({t:'gym',label:'Five compensation sums',min:3});
 legs.push({t:'est',label:'Three estimates',min:3});
 legs.push({t:'steps',label:'Five step-by-step gases',min:8});
 const sc=SCENARIOS.find(x=>!(S.scen||{})[x.id])||SCENARIOS[dayNum()%SCENARIOS.length];legs.push({t:'scen',label:'Shift: '+sc.title,min:5,id:sc.id});
 legs.push({t:'teach',label:'Teach one idea back',min:3});
 return legs;}
function weakLeg(){const w=weakestStep();return w?{t:'weak',label:'Weakest step: '+STEPNAME[w.c]+' ('+Math.round(w.a*100)+'%)',min:5,c:w.c}:null;}
function roundCatalog(){const L0=roundPlan(),wl=weakLeg(),o=[];if(wl)o.push(wl);L0.forEach(g=>o.push(g));return o;}
const LEG_PRI=['weak','due','steps','gym','est','concept','scen','teach','five','case','noise','trend','hand'];
function roundCap(){let m=15;try{if(typeof G!=='undefined'&&G.plan&&+G.plan.minutes)m=+G.plan.minutes;if(typeof slotFor==='function'){const c=SLOT_MIN[slotFor(today())];if(c!=null&&c<m)m=c;}}catch(e){}return m;}
function presetLegs(cat,cap){const out=[];let t=0;[...cat].sort((a,b)=>LEG_PRI.indexOf(a.t)-LEG_PRI.indexOf(b.t)).forEach(g=>{if(t+g.min<=cap||!out.length){out.push(g);t+=g.min;}});return cat.filter(g=>out.includes(g));}
function startRound(){openRoundBuilder();}
function openRoundBuilder(){const cat=roundCatalog();let sel=new Set(presetLegs(cat,roundCap()).map(g=>g.t+(g.id||'')));const old=document.querySelector('.sheet-scrim');if(old)old.remove();
 const sc=document.createElement('div');sc.className='sheet-scrim';
 function draw(){const tot=cat.filter(g=>sel.has(g.t+(g.id||''))).reduce((s,g)=>s+g.min,0);
  sc.innerHTML='<div class="sheet" role="dialog" aria-label="Build today\'s Round"><div class="sheet-grab"></div><b>Build today\'s Round</b><p class="note" style="margin:6px 0 10px">Tick the legs you want. Your weakest step comes first. '+(typeof G!=='undefined'&&G.plan?'Citrus planned '+esc(String(G.plan.minutes||''))+' min.':'')+'</p>'+
  '<div class="btnrow" style="margin-bottom:10px"><button class="btn small" data-p="10">Quick 10</button><button class="btn small" data-p="25">Standard 25</button><button class="btn small" data-p="99">Everything</button></div>'+
  cat.map((g,i)=>'<label class="srow"><div><b>'+esc(g.label)+'</b><span>about '+g.min+' min</span></div><input type="checkbox" data-i="'+i+'"'+(sel.has(g.t+(g.id||''))?' checked':'')+' aria-label="'+esc(g.label)+'"></label>').join('')+
  '<div class="btnrow" style="margin-top:12px"><button class="btn primary" id="rbBuild"'+(tot?'':' disabled')+'>Start · '+tot+' min</button><button class="btn" id="rbCancel">Cancel</button></div></div>';
  sc.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{const g=cat[+c.dataset.i],k=g.t+(g.id||'');c.checked?sel.add(k):sel.delete(k);draw();});
  sc.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sel=new Set(presetLegs(cat,+b.dataset.p).map(g=>g.t+(g.id||'')));draw();});
  $('rbCancel').onclick=()=>sc.remove();
  $('rbBuild').onclick=()=>{const legs=cat.filter(g=>sel.has(g.t+(g.id||'')));sc.remove();if(!legs.length)return;ROUND={legs,i:0,t0:Date.now(),xp0:S.xp||0,day:today()};S.round=ROUND;save();roundGo();};}
 sc.addEventListener('click',e=>{if(e.target===sc)sc.remove();});document.body.appendChild(sc);draw();requestAnimationFrame(()=>sc.classList.add('on'));}
function roundGo(){if(!ROUND)return;const g=ROUND.legs[ROUND.i];if(!g){roundFinish();return;}
 switch(g.t){case 'due':startSession('due',{round:true,n:Math.min(4,Math.max(1,dueKinds().length))});break;
  case 'concept':WEBSEL=g.c;go('web');break;

 /* remove label overlaps: push boxes apart */
 for(let it=0;it<300;it++){let moved=false;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const A=P[ids[i]],B=P[ids[j]];const ox=(A.w+B.w)/2+12-Math.abs(A.x-B.x),oy=44-Math.abs(A.y-B.y);if(ox>0&&oy>0){moved=true;if(ox/(A.w+B.w)<oy/44){const s=Math.sign(A.x-B.x||1)*ox/2;A.x+=s;B.x-=s;}else{const s=Math.sign(A.y-B.y||1)*oy/2;A.y+=s;B.y-=s;}}}if(!moved)break;}

 if(k==='ph'){const h=Math.round(rnd(6,40)),p=Math.round(rnd(18,85));const a=phFrom(h,p);if(a<6.9||a>7.7)return estNew();q={k,text:'HCO₃⁻ <b>'+h+'</b> mmol/L, PCO₂ <b>'+P(p)+' '+PU()+'</b>.',ask:'Estimate the pH',unit:'',min:6.9,max:7.7,step:0.01,tol:0.04,ans:a,fmt:x=>x.toFixed(2),work:'Ratio '+h+' ÷ (0.03 × '+p+') = '+(h/(0.03*p)).toFixed(1)+' (normal 20). pH = 6.1 + log('+(h/(0.03*p)).toFixed(1)+') = '+a.toFixed(2)+'. Henderson check: [H⁺] = 24 × '+p+' ÷ '+h+' = '+Math.round(24*p/h)+' nmol/L.'};}
 else if(k==='winters'){const h=Math.round(rnd(5,21));const a=1.5*h+8;q={k,text:'Metabolic acidosis with HCO₃⁻ <b>'+h+'</b> mmol/L.',ask:'Estimate the expected PCO₂ (mmHg)',unit:' mmHg',min:10,max:50,step:1,tol:3,ans:a,fmt:x=>String(Math.round(x)),work:'Winter\'s: 1.5 × '+h+' + 8 = '+r1(a)+' ± 2. Shortcut: HCO₃⁻ + 15 = '+(h+15)+' (fine for HCO₃⁻ 10–18).'};}
 else if(k==='hplus'){const ph=r2(rnd(7.0,7.6));const a=Math.pow(10,9-ph);q={k,text:'pH <b>'+ph.toFixed(2)+'</b>.',ask:'Estimate [H⁺] (nmol/L)',unit:' nmol/L',min:20,max:110,step:1,tol:5,ans:a,fmt:x=>String(Math.round(x)),work:'10^(9 − '+ph.toFixed(2)+') = '+Math.round(a)+' nmol/L.'+(ph>=7.2&&ph<=7.5?' The 80 rule: 80 − '+Math.round((ph-7)*100)+' = '+(80-Math.round((ph-7)*100))+'.':' Outside 7.20–7.50 the 80 rule drifts; remember 7.10 ≈ 80, 7.00 ≈ 100.')};}
 else if(k==='agc'){const na=Math.round(rnd(132,146)),hc=Math.round(rnd(8,24)),cl=Math.round(na-hc-rnd(6,24)),alb=Math.round(rnd(18,42));const ag=na-cl-hc,a=ag+0.25*(40-alb);q={k,text:'Na <b>'+na+'</b>, Cl <b>'+cl+'</b>, HCO₃⁻ <b>'+hc+'</b>, albumin <b>'+alb+'</b> g/L.',ask:'Estimate the albumin-corrected anion gap',unit:'',min:0,max:40,step:1,tol:2,ans:a,fmt:x=>String(Math.round(x)),work:'AG = '+na+' − ('+cl+' + '+hc+') = '+ag+'. Correction + 0.25 × (40 − '+alb+') = '+(0.25*(40-alb)>=0?'+':'')+r1(0.25*(40-alb))+' → '+r1(a)+'.'};}
 else{const pc=Math.round(rnd(26,70)),age=Math.round(rnd(25,80)),pa=(S.patm||760);const PA=0.21*(pa-47)-pc/0.8;const po=Math.round(PA-rnd(2,45));const a=PA-po;q={k,text:'Room air'+(pa!==760?' at '+pa+' mmHg':'')+': PaCO₂ <b>'+pc+'</b>, PaO₂ <b>'+po+'</b>, age <b>'+age+'</b>.',ask:'Estimate the A–a gradient (mmHg)',unit:' mmHg',min:0,max:60,step:1,tol:5,ans:a,fmt:x=>String(Math.round(x)),work:'PAO₂ = 0.21 × ('+pa+' − 47) − '+pc+' ÷ 0.8 = '+Math.round(PA)+'. A–a = '+Math.round(PA)+' − '+po+' = '+Math.round(a)+'. Expected ≤ '+Math.round(age/4+4)+' for age '+age+' (upper limit with tolerance '+Math.round(age/4+9)+'): '+(a>age/4+9?'raised.':'normal.')};}
 ES={q,v:null,shown:false};}

const isNight=s=>!!s&&(s.overnight===true||/^n/i.test(String(s.code||''))||/night/i.test(String(s.label||'')));
function slotFor(k){const s=shiftOf(k);if(isNight(s))return 'tough';if(isNight(shiftOf(addD(k,-1))))return 'postnight';
 if(s&&s.start){const h=parseInt(String(s.start).slice(0,2),10);if(h<7)return 'early';}if(isNight(shiftOf(addD(k,1))))return 'before';return 'free';}

 const d0=new Date();const dow=(d0.getDay()+6)%7;const start=new Date(d0);start.setDate(d0.getDate()-dow);const days=[];
 for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=isoD(d),sh=shiftOf(k);days.push({date:k,shift:sh&&sh.code||null,studied:S.days.includes(k),planned:k>=t,slot:slotFor(k)});}
 const done=days.filter(x=>x.studied).length;const end=new Date(start);end.setDate(start.getDate()+6);
 const slotT=slotFor(t);const cap=SLOT_MIN[slotT];

 if(G.plan&&G.plan.status==='accepted'&&G.plan.title&&!roundDone){nextTitle=G.plan.title;mins=+G.plan.minutes||mins;}
 mins=Math.min(mins,cap||mins);
 const items=(S.sess||[]).filter(s=>s.d===t).map(s=>({title:(MODES[s.m]||{t:s.m}).t,minutes:Math.max(2,Math.round(s.n*1.2)),score:s.ok+'/'+s.n}));if(roundDone)items.unshift({title:'The Round',minutes:25,score:'done'});

 const pending=[];if(due)pending.push(due+' patterns due');if(!roundDone)pending.push('Round not done today');const w=weakestStep();if(w)pending.push('Weak step: '+STEPNAME[w.c]+' ('+Math.round(w.a*100)+'%)');
 return {app:APP_SLUG,title:APP_TITLE,icon:'🧪',color:'#F26A1B',url:location.origin+location.pathname,version:APP_VERSION,device:navigator.platform||'web',updatedAt:new Date().toISOString(),summary,

  today:{date:t,done:roundDone,slot:slotT,items},week:{start:isoD(start),end:isoD(end),done,target:7,need:Math.max(0,7-done),days},

 const cur=(await listFiles('status.json',app))[0];const overwritten=!!(cur&&lastMd5&&cur.md5Checksum&&cur.md5Checksum!==lastMd5);

/* ---- state: Drive holds a copy; two phones MERGE, they never overwrite each other ---- */
const REC_N=['kinds','steps','teach','scen','flash','serial'];
function pickRec(a,b){if(a==null)return b;if(b==null)return a;if(typeof a!=='object'||typeof b!=='object')return typeof a==='number'&&typeof b==='number'?Math.max(a,b):a;
 const na=+a.n||0,nb=+b.n||0;if(na!==nb)return na>nb?a:b;const la=+a.last||+a.t||0,lb=+b.last||+b.t||0;if(la!==lb)return la>lb?a:b;return JSON.stringify(a)>=JSON.stringify(b)?a:b;}
function mergeMap(a,b,f){const o={};const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);ks.forEach(k=>{o[k]=f(a&&a[k],b&&b[k]);});return o;}
const maxN=(a,b)=>Math.max(+a||0,+b||0);
function unionArr(a,b,key,cap){const seen=new Set(),out=[];[...(a||[]),...(b||[])].forEach(x=>{const k=key(x);if(seen.has(k))return;seen.add(k);out.push(x);});return out.length>cap?out.slice(-cap):out;}
function mergeStates(A,B){const a=migrate(JSON.parse(JSON.stringify(A))),b=migrate(JSON.parse(JSON.stringify(B)));
 const ea=+a.epoch||0,eb=+b.epoch||0;if(ea!==eb)return JSON.parse(JSON.stringify(ea>eb?a:b));
 const newer=(a.savedAt||'')>=(b.savedAt||'')?a:b;const o=JSON.parse(JSON.stringify(newer));
 o.xp=maxN(a.xp,b.xp);o.read=maxN(a.read,b.read);o.roundsDone=maxN(a.roundsDone,b.roundsDone);o.epoch=ea;
 o.lastRound=(a.lastRound||'')>(b.lastRound||'')?a.lastRound:b.lastRound;
 REC_N.forEach(k=>{o[k]=mergeMap(a[k],b[k],pickRec);});
 o.done=mergeMap(a.done,b.done,(x,y)=>x||y);o.badges=mergeMap(a.badges,b.badges,(x,y)=>x||y);
 o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-400);
 o.dayN=mergeMap(a.dayN,b.dayN,maxN);o.why=mergeMap(a.why,b.why,(x,y)=>typeof x==='number'||typeof y==='number'?maxN(x,y):pickRec(x,y));
 o.qs=mergeMap(a.qs,b.qs,pickRec);
 ['ret','gym','est'].forEach(k=>{o[k]=pickRec(a[k],b[k])||o[k];});
 if(a.reflex||b.reflex){const x=a.reflex||{},y=b.reflex||{};o.reflex=Object.assign({},newer.reflex||{},{lvl:maxN(x.lvl,y.lvl),hist:((x.hist||[]).length>=(y.hist||[]).length?x.hist:y.hist)||[]});}
 o.sess=unionArr(a.sess,b.sess,x=>JSON.stringify(x),120);o.mist=unionArr(a.mist,b.mist,x=>x.id||JSON.stringify(x),40);
 if(Array.isArray(a.conf)||Array.isArray(b.conf))o.conf=unionArr(a.conf,b.conf,x=>JSON.stringify(x),300);
 const ra=a.round&&a.round.date===today()?a.round:null,rb=b.round&&b.round.date===today()?b.round:null;o.round=ra&&rb?(JSON.stringify(ra).length>=JSON.stringify(rb).length?ra:rb):(ra||rb||null);
 return o;}
const coreOf=o=>{const c=Object.assign({},o);delete c.google;delete c.savedAt;delete c.device;return c;};
const stHash=o=>hash(JSON.stringify(coreOf(o)));

function adopt(next,why){try{localStorage.setItem(gk('before_drive'),JSON.stringify(S));}catch(e){}const g=S.google;S=migrate(next);S.google=g;S.savedAt=next.savedAt||new Date().toISOString();_save();try{localStorage.setItem(gk('synced_h'),stHash(S));}catch(e){}G.line=why||'Merged with Drive';renderHeader();renderRoundBar();if(typeof SS==='undefined'||!SS){if(VIEW&&RENDER[VIEW]&&!SUBVIEWS.includes(VIEW))try{RENDER[VIEW]();}catch(e){}}}
const SUBVIEWS=['session','lesson','tool','scen'];
async function pullOrPush(opts={}){if(!signedIn()||!gcfg().syncState)return;const {app}=await hubFolder();
 for(let round=0;round<3;round++){
  const remote=await getJSON('state.json',app);const lh=stHash(S);
  if(!remote||!remote.data||!remote.data.v){const body=stateForDrive();const r=await putJSON('state.json',app,body,stHash(body));try{localStorage.setItem(gk('synced_h'),stHash(body));}catch(e){}S.savedAt=body.savedAt;_save();G.line=remote?'Replaced an unreadable Drive save':'Progress saved to Drive';return;}
  const rd=remote.data,rh=(remote.file.appProperties&&remote.file.appProperties.h)||stHash(rd);
  if(rh===lh&&!opts.force){G.line='Up to date';return;}
  const ea=+S.epoch||0,er=+rd.epoch||0;let merged;
  if(er>ea){adopt(rd,'Progress was reset on another device; applied');return;}
  merged=er<ea?JSON.parse(JSON.stringify(S)):mergeStates(S,rd);
  const mh=stHash(merged);
  if(mh!==lh){adopt(Object.assign({},merged,{savedAt:new Date().toISOString()}),'Merged with '+(rd.device||'another device'));}
  if(mh!==rh||opts.force){const body=stateForDrive();await putJSON('state.json',app,body,stHash(body));
   const chk=await getJSON('state.json',app);const ch=chk&&chk.file.appProperties&&chk.file.appProperties.h;
   if(chk&&ch&&ch!==stHash(body)){continue;}
   S.savedAt=body.savedAt;_save();try{localStorage.setItem(gk('synced_h'),stHash(body));}catch(e){}G.line=mh!==lh?G.line:'Progress saved to Drive';return;}
  G.line=mh!==lh?G.line:'Up to date';return;}
 G.line='Another phone is writing; will merge on the next sync';}

 for(const nm of ['citrus','scheduler']){const f=await folder(nm,hub,false);if(f){p=await getJSON('plan.json',f);if(p)break;}}if(!p)return;const t=today();const d=p.data;

 {sel:'.web-n',items:el=>{const n=WEB_NODES.find(x=>x[0]===el.dataset.id);if(!n)return [];const tb=TEACH.find(t=>t.c===n[0]);return [['Focus',()=>{WEBSEL=n[0];RENDER.web();}],LBYID[n[4]]?['Open the lesson',()=>openLesson(n[4])]:null,tb?['Teach it back',()=>{TB_PICK=n[0];TB=null;go('teach');}]:null].filter(Boolean);}}
];
function onDown(e){if(e.button&&e.button!==0)return;target=e.target;sx0=e.clientX;sy0=e.clientY;clearTimeout(timer);
 timer=setTimeout(()=>{if(!target)return;const m=MENUS.find(m=>target.closest(m.sel));if(m){const el=target.closest(m.sel);const items=m.items(el);if(items.length){el.classList.add('held');setTimeout(()=>el.classList.remove('held'),300);swallow=true;const t=(el.querySelector('b,h3,span:not(.mono-mark):not(.ck)')||el).textContent.trim().slice(0,48);sheet(t,items);return;}}
  const h=hintOf(target);if(h&&h[0]){swallow=true;showBubble(sx0,sy0,h[0],h[1]);}},460);}
function onMove(e){if(Math.abs(e.clientX-sx0)>10||Math.abs(e.clientY-sy0)>10)clearTimeout(timer);}
function onUp(){clearTimeout(timer);setTimeout(hideBubble,1100);}
document.addEventListener('pointerdown',onDown,{passive:true});document.addEventListener('pointermove',onMove,{passive:true});document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp);
document.addEventListener('scroll',()=>clearTimeout(timer),{passive:true,capture:true});
document.addEventListener('click',e=>{if(swallow){swallow=false;e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest(MENUS.map(m=>m.sel).join(',')+',[data-hint]'))e.preventDefault();});
/* swipe flash cards: right = got it, left = again */
let card=null,sx=0,sy=0,dx=0;
document.addEventListener('pointerdown',e=>{card=e.target.closest('.flashcard');if(!card)return;sx=e.clientX;sy=e.clientY;dx=0;});
document.addEventListener('pointermove',e=>{if(!card)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(Math.abs(dx)<14||Math.abs(dy)>Math.abs(dx))return;clearTimeout(timer);card.style.transform='translateX('+dx+'px) rotate('+(dx/30)+'deg)';card.dataset.swipe=dx>0?'Got it →':'← Again';});
document.addEventListener('pointerup',()=>{if(!card)return;const c=card,d=dx;card=null;c.style.transform='';delete c.dataset.swipe;if(Math.abs(d)>90&&typeof FL!=='undefined'&&FL){swallow=true;setTimeout(()=>{swallow=false;},50);FL.swipes=(FL.swipes||0)+1;if(!FL.flipped){FL.flipped=true;RENDER.flash();setTimeout(()=>flashRate(d>0),350);}else flashRate(d>0);}});
})();

boot();hubBoot();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
